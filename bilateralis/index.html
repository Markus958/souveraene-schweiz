<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#CC0000">
<title>Bilateralis – EU-Schweiz Verträge Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>

/* =========================================================================
   BILATERALIS – EU-Schweiz Verträge Quiz
   Helle Optik nach Vorbild des bestehenden CH-EU-Quiz
   (warmgrauer Hintergrund, weisse Karten, Schweizer Rot + Blau, Playfair).
   Hinweis: --gold bleibt als Variablenname erhalten, ist aber auf Blau gemappt
   (Akzentfarbe für VP/Score), damit bestehende Referenzen weiter passen.
   ========================================================================= */
:root{
  --bg:#F5F5F0;
  --surface:#FFFFFF;
  --surface-2:#FBFBF9;
  --surface-3:#F0F0EB;
  --primary:#E30613;        /* Schweizer Rot – Hauptaktion */
  --primary-dark:#CC0000;
  --secondary:#0033B6;      /* Blau – Akzent / Score */
  --secondary-soft:#EEF2FF;
  --gold:#0033B6;           /* Name beibehalten -> Blau */
  --gold-2:#1f57d6;
  --gold-soft:rgba(0,51,182,.08);
  --streak:#FF6D00;
  --correct:#2E7D32; --correct-bg:#E8F5E9;
  --incorrect:#C62828; --incorrect-bg:#FFEBEE;
  --blue:#0033B6;
  --text:#1A1A1A;
  --muted:#666666;
  --muted-2:#9A9A93;
  --border:#E2E2DE;
  --border-solid:#DDDDD7;
  --r:10px; --r-sm:8px;
  --shadow:0 1px 4px rgba(0,0,0,.07);
  --shadow-gold:0 2px 12px rgba(0,51,182,.16);
  --maxw:640px;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--sans);color:var(--text);background:var(--bg);
  min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
.app{max-width:var(--maxw);margin:0 auto;padding:0 16px 64px;}
.view{animation:fade .3s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ── Brand-Nav (rot) + Breadcrumb (wie altes Quiz) ── */
#brand-nav{background:var(--primary-dark);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px;position:sticky;top:0;z-index:200;}
.brand-logo{font-family:var(--serif);font-weight:700;font-size:1rem;color:#fff;text-decoration:none;display:flex;align-items:center;gap:8px;}
.kreuz{width:20px;height:20px;background:#fff;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.kreuz::before{content:'+';color:var(--primary-dark);font-size:1.05rem;font-weight:900;line-height:1;font-family:Arial,sans-serif;}
.brand-back{font-size:.8rem;color:rgba(255,255,255,.82);text-decoration:none;white-space:nowrap;}
.brand-back:hover{color:#fff;}
#brand-crumb{background:#f8f8f6;border-bottom:1px solid #e8e8e6;padding:5px 16px;font-size:.72rem;color:#999;}
#brand-crumb a{color:#999;text-decoration:none;}
#brand-crumb a:hover{color:var(--primary);}
#brand-crumb span{margin:0 4px;}
#brand-crumb strong{color:#444;}

/* ── Statusleiste (VP / Level / Streak) ── */
header.statusbar{position:sticky;top:48px;z-index:190;background:rgba(245,245,240,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
.statusbar-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:8px;padding:9px 16px;}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;text-decoration:none;color:inherit;user-select:none;}
.brand .mark{width:30px;height:30px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:1rem;font-family:var(--serif);background:var(--primary);color:#fff;}
.brand .bname{font-family:var(--serif);font-weight:700;font-size:1.06rem;letter-spacing:.2px;}
.topbar-spacer{flex:1;}
.stat-pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:.82rem;font-weight:700;white-space:nowrap;}
.stat-pill .ic{font-size:.9rem;line-height:1;}
.stat-pill.gold{color:var(--secondary);border-color:rgba(0,51,182,.25);}
.stat-pill.streak{color:var(--streak);}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:1.05rem;display:grid;place-items:center;transition:.15s;}
.icon-btn:hover{background:var(--surface-3);border-color:var(--primary);}
.levelbar-wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px 6px;}
.levelbar{height:5px;background:var(--border);border-radius:999px;overflow:hidden;}
.levelbar > i{display:block;height:100%;background:var(--secondary);border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1);}
@media(max-width:560px){.stat-pill .lbl{display:none;}.brand .bname{display:none;}}

/* ── Typografie / Sektionen ── */
h1.page-title{font-family:var(--serif);font-size:1.85rem;font-weight:800;margin:20px 0 4px;line-height:1.15;}
.subtitle{color:var(--muted);font-size:.95rem;margin-bottom:16px;}
.section-h{display:flex;align-items:center;gap:10px;margin:24px 0 12px;}
.section-h h2{font-family:var(--serif);font-size:1.15rem;font-weight:700;}
.section-h .line{flex:1;height:1px;background:var(--border);}
.section-h .count{font-size:.74rem;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:2px 9px;border-radius:999px;}

/* ── Karten / Buttons ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;cursor:pointer;border:none;border-radius:var(--r);padding:13px 20px;transition:transform .08s,background .2s,box-shadow .2s,opacity .2s,color .2s;}
.btn:active{transform:scale(.98);opacity:.92;}
.btn-gold{background:var(--primary);color:#fff;box-shadow:var(--shadow);}      /* Hauptaktion = rot */
.btn-gold:hover{background:var(--primary-dark);}
.btn-ghost{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px;font-size:.85rem;}

/* ── Modus-Kacheln ── */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.mode{position:relative;text-align:left;padding:18px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--border);cursor:pointer;transition:.16s;box-shadow:var(--shadow);overflow:hidden;}
.mode:hover{transform:translateY(-3px);border-color:var(--secondary);box-shadow:0 6px 16px rgba(0,0,0,.1);}
.mode .em{font-size:1.7rem;display:block;margin-bottom:8px;}
.mode h3{font-family:var(--serif);font-size:1.1rem;font-weight:700;margin-bottom:3px;}
.mode p{font-size:.83rem;color:var(--muted);}
.mode .tag{position:absolute;top:12px;right:12px;font-size:.64rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--secondary-soft);color:var(--secondary);}
.mode.locked{opacity:.5;cursor:not-allowed;box-shadow:none;}
.mode.locked:hover{transform:none;border-color:var(--border);box-shadow:none;}

/* ── Dossier-Kacheln ── */
.dossiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;}
.dossier{text-align:left;padding:14px;border-radius:var(--r-sm);cursor:pointer;background:var(--surface);border:1.5px solid var(--border);transition:.15s;display:flex;flex-direction:column;gap:10px;min-height:118px;box-shadow:var(--shadow);}
.dossier:hover{border-color:var(--secondary);transform:translateY(-2px);}
.dossier .d-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.dossier .d-name{font-size:.9rem;font-weight:700;line-height:1.25;}
.dossier .d-medal{font-size:1.15rem;line-height:1;}
.dossier .d-meta{font-size:.72rem;color:var(--muted);margin-top:auto;}
.progress{height:7px;background:var(--border);border-radius:999px;overflow:hidden;}
.progress > i{display:block;height:100%;border-radius:999px;background:var(--secondary);transition:width .6s ease;}
.dossier .neu{display:inline-block;margin-top:4px;font-size:.62rem;font-weight:800;letter-spacing:.05em;color:#fff;background:var(--primary);padding:1px 6px;border-radius:5px;}

/* ── Quiz-Oberfläche ── */
.quiz-head{display:flex;align-items:center;gap:12px;margin:18px 0 14px;flex-wrap:wrap;}
.qprogress{flex:1;min-width:140px;}
.qprogress .bar{height:8px;background:var(--border);border-radius:999px;overflow:hidden;}
.qprogress .bar > i{display:block;height:100%;background:var(--primary);transition:width .4s;}
.qprogress .lbl{font-size:.76rem;color:var(--muted);margin-top:5px;}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:7px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:.92rem;}
.timer.warn{color:var(--incorrect);border-color:rgba(198,40,40,.5);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.5;}}
.q-card{padding:20px;}
.q-meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;align-items:center;}
.chip{font-size:.68rem;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:999px;background:var(--surface-3);color:var(--muted);text-transform:uppercase;border:1px solid var(--border);}
.chip.dossier-chip{background:var(--secondary-soft);color:var(--secondary);border-color:rgba(0,51,182,.2);}
.chip.diff-leicht{background:var(--correct-bg);color:var(--correct);border-color:rgba(46,125,50,.25);}
.chip.diff-mittel{background:#FFF3E0;color:#E65100;border-color:rgba(230,81,0,.25);}
.chip.diff-schwer{background:var(--incorrect-bg);color:var(--incorrect);border-color:rgba(198,40,40,.25);}
.chip.neu{background:var(--primary);color:#fff;border-color:var(--primary);}
.q-text{font-family:var(--serif);font-size:1.35rem;font-weight:700;line-height:1.35;margin-bottom:6px;}
.q-type-hint{font-size:.82rem;color:var(--muted);margin-bottom:18px;}
.answers{display:flex;flex-direction:column;gap:10px;}
.answer{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 15px;border-radius:var(--r);cursor:pointer;background:var(--surface);border:1.5px solid var(--border);color:var(--text);font:inherit;font-size:.98rem;transition:.13s;line-height:1.4;}
.answer:hover:not(:disabled){border-color:var(--secondary);background:var(--secondary-soft);}
.answer:disabled{cursor:default;}
.answer .key{flex:0 0 auto;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:.88rem;background:var(--surface-3);color:var(--muted);transition:.13s;}
.answer .txt{flex:1;}
.answer .txt .pair{display:block;}
.answer .txt .pair + .pair{margin-top:3px;padding-top:3px;border-top:1px dashed var(--border);}
.answer.correct{border-color:var(--correct);background:var(--correct-bg);}
.answer.correct .key{background:var(--correct);color:#fff;}
.answer.incorrect{border-color:var(--incorrect);background:var(--incorrect-bg);}
.answer.incorrect .key{background:var(--incorrect);color:#fff;}
.answer .res{margin-left:auto;font-size:1.1rem;}
.explain{margin-top:16px;border-radius:var(--r);border:1px solid var(--border);border-left:3px solid var(--secondary);background:var(--secondary-soft);overflow:hidden;}
.explain .x-head{display:flex;align-items:center;gap:9px;padding:12px 15px;font-weight:700;border-bottom:1px solid rgba(0,51,182,.12);}
.explain .x-head .vp{margin-left:auto;font-size:.78rem;color:var(--secondary);font-weight:800;}
.explain .x-body{padding:13px 15px;font-size:.92rem;color:#2a2a2a;line-height:1.6;}
.explain .x-body .src{margin-top:10px;font-size:.76rem;color:var(--muted);border-top:1px dashed rgba(0,51,182,.18);padding-top:9px;}
.explain .x-body .src b{color:var(--muted);font-weight:700;}
.quiz-foot{margin-top:16px;display:flex;gap:10px;}
.vp-float{position:fixed;left:50%;top:30%;transform:translateX(-50%);pointer-events:none;z-index:120;font-weight:800;font-size:1.5rem;color:var(--secondary);text-shadow:0 1px 8px rgba(255,255,255,.9);animation:vpfloat 1.1s ease forwards;}
@keyframes vpfloat{0%{opacity:0;transform:translate(-50%,10px) scale(.8);}25%{opacity:1;}100%{opacity:0;transform:translate(-50%,-46px) scale(1.05);}}

/* ── Session-Ende ── */
.result{padding:28px 20px;text-align:center;}
.result .ring{width:148px;height:148px;margin:6px auto 14px;position:relative;}
.result .ring svg{transform:rotate(-90deg);}
.result .ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:2.2rem;font-weight:800;color:var(--secondary);}
.result h2{font-family:var(--serif);font-size:1.7rem;margin-bottom:4px;}
.result .verdict{color:var(--muted);margin-bottom:16px;}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;}
.score-grid .s{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 8px;box-shadow:var(--shadow);}
.score-grid .s b{display:block;font-size:1.4rem;font-family:var(--serif);}
.score-grid .s span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.vp-break{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:4px 16px;margin:6px 0 18px;box-shadow:var(--shadow);}
.vp-break .row{display:flex;justify-content:space-between;padding:10px 0;font-size:.9rem;border-bottom:1px solid var(--border);}
.vp-break .row:last-child{border-bottom:none;font-weight:800;color:var(--secondary);}
.vp-break .row .mul{color:var(--secondary);font-size:.78rem;}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:110;overflow:hidden;}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;opacity:.9;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(108vh) rotate(640deg);opacity:.7;}}

/* ── Badge-Toast ── */
.toast-wrap{position:fixed;left:0;right:0;bottom:18px;z-index:250;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:360px;width:calc(100% - 32px);background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--secondary);border-radius:var(--r);padding:12px 15px;box-shadow:0 6px 20px rgba(0,0,0,.13);animation:toastIn .4s ease both;}
.toast .em{font-size:1.8rem;}
.toast b{display:block;font-size:.95rem;}
.toast small{color:var(--muted);font-size:.8rem;}
@keyframes toastIn{from{opacity:0;transform:translateY(18px) scale(.96);}to{opacity:1;transform:none;}}

/* ── Profil / Badges ── */
.profile-hero{display:flex;gap:18px;align-items:center;padding:20px;flex-wrap:wrap;}
.rank-disc{width:80px;height:80px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-family:var(--serif);font-size:1.9rem;font-weight:800;color:#fff;background:var(--secondary);box-shadow:var(--shadow-gold);}
.profile-hero .pi h2{font-family:var(--serif);font-size:1.4rem;}
.profile-hero .pi .lv{color:var(--secondary);font-weight:700;}
.profile-hero .pi .vp{color:var(--muted);font-size:.9rem;}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0;}
.stat-cards .sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);}
.stat-cards .sc b{font-family:var(--serif);font-size:1.5rem;display:block;}
.stat-cards .sc span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.badge{text-align:center;padding:16px 10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);transition:.16s;box-shadow:var(--shadow);}
.badge.earned{border-color:var(--secondary);background:var(--secondary-soft);}
.badge .em{font-size:2rem;display:block;margin-bottom:7px;filter:grayscale(1) opacity(.35);}
.badge.earned .em{filter:none;}
.badge b{font-size:.85rem;display:block;}
.badge small{font-size:.72rem;color:var(--muted);display:block;margin-top:3px;}

/* ── Modal (Einstellungen) ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,26,26,.45);backdrop-filter:blur(3px);z-index:300;display:grid;place-items:center;padding:18px;animation:fade .2s;}
.modal{width:100%;max-width:430px;max-height:88vh;overflow:auto;border-radius:var(--r);padding:22px;background:var(--surface);}
.modal h3{font-family:var(--serif);font-size:1.25rem;margin-bottom:14px;}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
.setting-row .lab b{display:block;font-size:.95rem;}
.setting-row .lab small{color:var(--muted);font-size:.8rem;}
.switch{position:relative;width:48px;height:27px;flex:0 0 auto;}
.switch input{opacity:0;width:0;height:0;}
.switch .sl{position:absolute;inset:0;background:var(--border);border-radius:999px;cursor:pointer;transition:.2s;}
.switch .sl::before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch input:checked + .sl{background:var(--secondary);}
.switch input:checked + .sl::before{transform:translateX(21px);}

/* ── Empty / Error / Loader ── */
.notice{text-align:center;padding:42px 22px;}
.notice .em{font-size:3rem;display:block;margin-bottom:12px;}
.notice h2{font-family:var(--serif);font-size:1.4rem;margin-bottom:8px;}
.notice p{color:var(--muted);max-width:460px;margin:0 auto 8px;}
.notice code{background:var(--surface-3);border:1px solid var(--border);padding:2px 7px;border-radius:6px;font-size:.85rem;color:var(--primary);}
.loader{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 0;color:var(--muted);}
.spin{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:rot .8s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
.choice-list{display:flex;flex-direction:column;gap:9px;}
.choice{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--border);cursor:pointer;transition:.14s;text-align:left;width:100%;color:var(--text);font:inherit;box-shadow:var(--shadow);}
.choice:hover{border-color:var(--secondary);background:var(--secondary-soft);}
.choice .c-name{font-weight:700;font-size:.96rem;}
.choice .c-meta{margin-left:auto;font-size:.78rem;color:var(--muted);text-align:right;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);background:none;border:none;font:inherit;cursor:pointer;padding:14px 0;font-size:.9rem;}
.back-link:hover{color:var(--primary);}
.hidden{display:none !important;}
.center{text-align:center;}
footer.foot{text-align:center;color:var(--muted-2);font-size:.76rem;padding:30px 0 10px;}

</style>
</head>
<body>

<!-- ───────── Brand-Nav + Breadcrumb (Site-Chrome) ───────── -->
<nav id="brand-nav">
  <a href="/" class="brand-logo"><span class="kreuz"></span>Souveräne Schweiz</a>
  <a href="/ch-eu/" class="brand-back">← Paket CH–EU</a>
</nav>
<div id="brand-crumb">
  <a href="/">Start</a><span>/</span><a href="/ch-eu/">Paket CH–EU</a><span>/</span><strong>Bilateralis-Quiz</strong>
</div>

<!-- ───────── Statusleiste (VP / Level / Streak) ───────── -->
<header class="statusbar">
  <div class="statusbar-inner">
    <a class="brand" id="brandHome">
      <span class="mark">B</span>
      <span class="bname">Bilateralis</span>
    </a>
    <span class="topbar-spacer"></span>
    <span class="stat-pill streak" id="pillStreak" title="Täglicher Streak"><span class="ic">🔥</span><span id="streakVal">0</span></span>
    <span class="stat-pill gold" id="pillVP" title="Vertrags-Punkte"><span class="ic">◆</span><span id="vpVal">0</span><span class="lbl">&nbsp;VP</span></span>
    <span class="stat-pill" id="pillLevel" title="Level" style="cursor:pointer"><span class="ic">🎖️</span><span class="lbl">Lvl&nbsp;</span><span id="lvlVal">1</span></span>
    <button class="icon-btn" id="btnSettings" title="Einstellungen">⚙</button>
  </div>
  <div class="levelbar-wrap"><div class="levelbar"><i id="levelBarFill" style="width:0%"></i></div></div>
</header>


<main class="app" id="app">
  <!-- Inhalt wird per JS gerendert -->
  <div class="loader"><div class="spin"></div><span>Fragen werden geladen …</span></div>
</main>

<footer class="foot">
  Bilateralis · Lern-Quiz zu den Verträgen Schweiz–EU · Fortschritt lokal gespeichert
</footer>

<div class="toast-wrap" id="toastWrap"></div>

<script>
"use strict";
/* =========================================================================
   1) KONSTANTEN & KONFIGURATION
   ========================================================================= */
const DATA_URL = "./Quiz/quiz_fragen.json";
const STORE_KEY = "bilateralis_state_v1";
const NEU_TAGE = 14;                 // "NEU"-Markierung: gueltig_ab innerhalb der letzten 14 Tage

// Vertrags-Punkte je Schwierigkeit
const VP_DIFF = { leicht:10, mittel:15, schwer:25 };
const VP_ERKLAERUNG = 5;             // Erklärung gelesen
const VP_MATCHING    = 10;           // Matching richtig (Extra)
const VP_PERFEKT     = 100;          // 100 % Session (flach, wird nicht multipliziert)
const MULT_ERSTE_SESSION = 1.5;      // Erste Session des Tages

// Streak-Multiplikator nach aufeinanderfolgenden Tagen
function streakMultiplier(days){
  if(days >= 30) return 2.00;
  if(days >= 14) return 1.75;
  if(days >= 7)  return 1.50;
  if(days >= 3)  return 1.25;
  return 1.00;                        // Tag 1–2
}

// Level-Schwellen (VP-Untergrenze je Level 1..30) + Rangbezeichnung
const RANKS = [
  {from:1,  to:4,  name:"Anfänger"},
  {from:5,  to:9,  name:"Kenner"},
  {from:10, to:14, name:"Experte"},
  {from:15, to:19, name:"Profi"},
  {from:20, to:24, name:"Meister"},
  {from:25, to:30, name:"Legend"},
];
// VP-Untergrenzen Level 1..30 (Index 0 = Level 1). Aus den Vorgaben linear je Band verteilt.
const LEVEL_MIN_VP = [
  0,500,1000,1500,                          // Anfänger 1–4   (0–2.000)
  2001,3200,4400,5600,6800,                 // Kenner 5–9     (2.001–8.000)
  8001,10000,12000,14000,16000,             // Experte 10–14  (8.001–18.000)
  18001,21400,24800,28200,31600,            // Profi 15–19    (18.001–35.000)
  35001,40000,45000,50000,55000,            // Meister 20–24  (35.001–60.000)
  60001,75000,90000,105000,120000,135000    // Legend 25–30   (60.001+)
];

// Modi-Definitionen
const MODES = {
  classic:  {emoji:"🎯", title:"Classic",          desc:"Gemischte Fragen aus allen Dossiers (10–15).", tag:""},
  daily:    {emoji:"📅", title:"Daily Challenge",   desc:"Jeden Tag dieselben 10 Fragen für alle.",      tag:"Täglich"},
  focus:    {emoji:"🔎", title:"Focus Mode",        desc:"Trainiere ein bestimmtes Dossier gezielt.",    tag:""},
  weak:     {emoji:"💪", title:"Weak Spots",        desc:"Nur Fragen, die du bisher falsch hattest.",    tag:""},
  exam:     {emoji:"🏛️", title:"Prüfungsmodus",     desc:"30 Fragen, auf Zeit – ohne Sicherheitsnetz.",  tag:"20 Min."},
};
const EXAM_COUNT = 30;
const EXAM_SECONDS = 20*60;          // 20 Minuten
const CLASSIC_COUNT = 12;
const DAILY_COUNT = 10;
const FOCUS_COUNT = 12;

// Badge-Katalog. check(stats) -> bool
const BADGES = [
  {id:"first_steps", em:"👣", t:"Erste Schritte",  d:"Erste Session abgeschlossen",      check:s=>s.sessionsPlayed>=1},
  {id:"daily_win",   em:"📅", t:"Tagessieger",     d:"Eine Daily Challenge gemeistert",  check:s=>s.dailyChallengesDone>=1},
  {id:"perfect",     em:"💯", t:"Makellos",        d:"Eine Session mit 100 %",           check:s=>s.perfectSessions>=1},
  {id:"streak7",     em:"🔥", t:"Brennt!",         d:"7 Tage Streak erreicht",           check:s=>s.maxStreak>=7},
  {id:"streak30",    em:"🌋", t:"Unermüdlich",     d:"30 Tage Streak erreicht",          check:s=>s.maxStreak>=30},
  {id:"reader",      em:"📖", t:"Wissensdurst",    d:"50 Erklärungen gelesen",           check:s=>s.explanationsRead>=50},
  {id:"answers100",  em:"🧠", t:"Hundertschaft",   d:"100 Fragen richtig beantwortet",   check:s=>s.totalCorrect>=100},
  {id:"answers500",  em:"⚔️", t:"Marathon",        d:"500 Fragen beantwortet",           check:s=>s.totalAnswered>=500},
  {id:"exam_pass",   em:"🎓", t:"Bestanden",       d:"Prüfung mit ≥ 80 % bestanden",     check:s=>s.examPassed>=1},
  {id:"dossier_master",em:"🏅",t:"Dossier-Meister",d:"Ein Dossier zu 100 % gemeistert",  check:s=>s.dossiersMastered>=1},
  {id:"collector",   em:"📚", t:"Sammler",         d:"Alle Dossiers angespielt",         check:s=>s.dossiersTouched>=s.dossiersTotal && s.dossiersTotal>0},
  {id:"legend",      em:"👑", t:"Legende",         d:"Level 25 (Legend) erreicht",       check:s=>s.level>=25},
];

/* =========================================================================
   2) ZUSTAND (localStorage)
   ========================================================================= */
function defaultState(){
  return {
    v:1,
    totalVP:0,
    streak:{ count:0, lastDate:null, max:0 },
    answers:{},                 // qid -> {correctOnce:bool, lastCorrect:bool, attempts:int}
    explanationsRead:0,
    readQuestions:{},           // qid -> true (Erklärungs-VP nur einmal pro Frage)
    sessionsPlayed:0,
    perfectSessions:0,
    dailyChallengesDone:0,
    examPassed:0,
    lastSessionDate:null,       // für "Erste Session des Tages"
    dailyDoneDate:null,         // an welchem Tag Daily erledigt
    badges:{},                  // id -> ISO-Datum verdient
    knownIds:[],                // bekannte Frage-IDs (Neu-Erkennung)
    seenIntro:false,
    settings:{ preview:false }, // Vorschau: zukünftige Fragen anzeigen
  };
}
let STATE = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed, {
      streak:Object.assign({count:0,lastDate:null,max:0}, parsed.streak||{}),
      settings:Object.assign({preview:false}, parsed.settings||{}),
    });
  }catch(e){ console.warn("State konnte nicht gelesen werden – Neustart.", e); return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }
  catch(e){ console.warn("State konnte nicht gespeichert werden.", e); }
}

/* =========================================================================
   3) HILFSFUNKTIONEN
   ========================================================================= */
const $ = sel => document.querySelector(sel);
const APP = $("#app");

function todayStr(d=new Date()){
  // Lokales Datum als YYYY-MM-DD (kein UTC-Versatz)
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function daysBetween(aStr,bStr){
  const a=new Date(aStr+"T00:00:00"), b=new Date(bStr+"T00:00:00");
  return Math.round((b-a)/86400000);
}
function isValidDate(s){ return typeof s==="string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function esc(str){ return String(str==null?"":str).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(n){ return Number(n).toLocaleString("de-CH"); }

// Deterministischer PRNG (mulberry32) + Hash – für reproduzierbare Daily Challenge
function hashStr(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);} return (h>>>0); }
function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr, rnd=Math.random){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* =========================================================================
   4) DATEN LADEN & VALIDIEREN
   ========================================================================= */
let ALL_QUESTIONS = [];     // gültige & (nach Datum/Settings) sichtbare Fragen
let RAW_VALID = [];         // alle strukturell gültigen Fragen (unabhängig vom Datum)
let DATA_ERROR = null;
let EARLIEST_FUTURE = null; // früheste gueltig_ab, die noch in der Zukunft liegt

async function loadData(){
  let json;
  try{
    const res = await fetch(DATA_URL, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    json = await res.json();
  }catch(e){
    DATA_ERROR = e;
    console.error("Quiz-Daten konnten nicht geladen werden:", e);
    return;
  }
  if(!Array.isArray(json)){ DATA_ERROR = new Error("JSON ist kein Array."); return; }

  const today = todayStr();
  let ignoredNoDate = 0, futureCount = 0;

  for(const q of json){
    // Pflichtfeld gueltig_ab prüfen
    if(!q || !isValidDate(q.gueltig_ab)){
      ignoredNoDate++;
      console.warn(`[Bilateralis] Frage ignoriert – fehlendes/ungültiges "gueltig_ab":`, q && (q.id||q.frage) || q);
      continue;
    }
    RAW_VALID.push(q);
    const isVisible = (q.gueltig_ab <= today);
    if(isVisible || STATE.settings.preview){
      ALL_QUESTIONS.push(q);
    }
    if(!isVisible){
      futureCount++;
      if(EARLIEST_FUTURE===null || q.gueltig_ab < EARLIEST_FUTURE) EARLIEST_FUTURE = q.gueltig_ab;
    }
  }

  if(ignoredNoDate>0) console.warn(`[Bilateralis] ${ignoredNoDate} Frage(n) ohne gültiges "gueltig_ab" ignoriert.`);
  console.info(`[Bilateralis] ${RAW_VALID.length} gültige Fragen, davon ${RAW_VALID.length-futureCount} aktuell freigeschaltet, ${futureCount} künftig.`);
}

// "Sichtbare" Fragen je nach Vorschau-Einstellung (rechnet nicht neu fetch)
function recomputeVisible(){
  const today = todayStr();
  ALL_QUESTIONS = RAW_VALID.filter(q => STATE.settings.preview || q.gueltig_ab <= today);
}

/* ---- Neu-Erkennung & NEU-Markierung ---- */
function isNeu(q){ // gueltig_ab innerhalb der letzten NEU_TAGE Tage
  const diff = daysBetween(q.gueltig_ab, todayStr());
  return diff>=0 && diff<=NEU_TAGE;
}
function detectNewQuestions(){
  const known = new Set(STATE.knownIds);
  const fresh = ALL_QUESTIONS.filter(q => !known.has(q.id));
  return fresh; // Fragen, die seit dem letzten Besuch neu freigeschaltet wurden
}
function markAllKnown(){
  STATE.knownIds = ALL_QUESTIONS.map(q=>q.id);
  saveState();
}

/* =========================================================================
   5) GAMIFICATION-LOGIK
   ========================================================================= */
function levelFromVP(vp){
  let lvl = 1;
  for(let i=0;i<LEVEL_MIN_VP.length;i++){ if(vp >= LEVEL_MIN_VP[i]) lvl = i+1; }
  return lvl;
}
function rankName(level){
  const r = RANKS.find(r=>level>=r.from && level<=r.to);
  return r ? r.name : "Anfänger";
}
function levelProgress(vp){
  const lvl = levelFromVP(vp);
  const curMin = LEVEL_MIN_VP[lvl-1];
  const nextMin = lvl<30 ? LEVEL_MIN_VP[lvl] : null;
  const pct = nextMin===null ? 100 : Math.min(100, ((vp-curMin)/(nextMin-curMin))*100);
  return {lvl, rank:rankName(lvl), curMin, nextMin, pct, toNext: nextMin===null?0:nextMin-vp};
}

// Streak beim Sessionstart aktualisieren. Liefert {multiplier, firstSessionToday}
function touchStreakForSession(){
  const today = todayStr();
  const s = STATE.streak;
  const firstSessionToday = STATE.lastSessionDate !== today;

  if(s.lastDate === today){
    /* schon heute gespielt – Streak unverändert */
  } else if(s.lastDate && daysBetween(s.lastDate, today) === 1){
    s.count += 1;                       // Folgetag
  } else {
    s.count = 1;                        // erster Tag oder Lücke
  }
  s.lastDate = today;
  s.max = Math.max(s.max||0, s.count);

  STATE.lastSessionDate = today;
  saveState();
  return { multiplier: streakMultiplier(s.count), firstSessionToday };
}

// Statistik-Schnappschuss für Badge-Checks
function buildStatSnapshot(){
  let totalCorrect=0, totalAnswered=0;
  for(const id in STATE.answers){
    const a=STATE.answers[id];
    totalAnswered += a.attempts||0;
    if(a.correctOnce) totalCorrect++;
  }
  const {dossiersTouched, dossiersMastered, dossiersTotal} = dossierStats();
  return {
    sessionsPlayed:STATE.sessionsPlayed,
    dailyChallengesDone:STATE.dailyChallengesDone,
    perfectSessions:STATE.perfectSessions,
    maxStreak:STATE.streak.max||0,
    explanationsRead:STATE.explanationsRead,
    examPassed:STATE.examPassed,
    totalCorrect, totalAnswered,
    level:levelFromVP(STATE.totalVP),
    dossiersTouched, dossiersMastered, dossiersTotal,
  };
}

// Badges prüfen & neu verdiente zurückgeben
function checkBadges(){
  const stats = buildStatSnapshot();
  const newly=[];
  for(const b of BADGES){
    if(!STATE.badges[b.id] && b.check(stats)){
      STATE.badges[b.id] = todayStr();
      newly.push(b);
    }
  }
  if(newly.length) saveState();
  return newly;
}

/* ---- Dossier-Auswertung ---- */
function dossierList(){
  // verfügbare Dossiers (sichtbare Fragen) mit Fortschritt
  const map = new Map();
  for(const q of ALL_QUESTIONS){
    const key = q.dossier || "Sonstige";
    if(!map.has(key)) map.set(key,{name:key,total:0,correct:0,neu:0});
    const e=map.get(key); e.total++;
    if(STATE.answers[q.id] && STATE.answers[q.id].correctOnce) e.correct++;
    if(isNeu(q)) e.neu++;
  }
  return [...map.values()].sort((a,b)=>b.total-a.total);
}
function dossierStats(){
  const list = dossierList();
  let touched=0, mastered=0;
  for(const d of list){
    if(d.correct>0) touched++;
    if(d.total>0 && d.correct>=d.total) mastered++;
  }
  return {dossiersTouched:touched, dossiersMastered:mastered, dossiersTotal:list.length};
}
function medalFor(pct){
  if(pct>=100) return "🥇";
  if(pct>=66)  return "🥈";
  if(pct>=33)  return "🥉";
  return "";
}

/* =========================================================================
   6) FRAGE-AUSWAHL JE MODUS
   ========================================================================= */
function pickQuestions(mode, opts={}){
  if(mode==="daily"){
    // deterministisch nach Datum: gleiche Fragen für alle an einem Tag
    const rnd = mulberry32(hashStr("daily-"+todayStr()));
    return shuffle(ALL_QUESTIONS, rnd).slice(0, Math.min(DAILY_COUNT, ALL_QUESTIONS.length));
  }
  if(mode==="focus"){
    const pool = ALL_QUESTIONS.filter(q=>(q.dossier||"Sonstige")===opts.dossier);
    return shuffle(pool).slice(0, Math.min(FOCUS_COUNT, pool.length));
  }
  if(mode==="weak"){
    const pool = ALL_QUESTIONS.filter(q=>{
      const a=STATE.answers[q.id];
      return a && a.lastCorrect===false;          // zuletzt falsch beantwortet
    });
    return shuffle(pool).slice(0, Math.min(15, pool.length));
  }
  if(mode==="exam"){
    return shuffle(ALL_QUESTIONS).slice(0, Math.min(EXAM_COUNT, ALL_QUESTIONS.length));
  }
  // classic
  return shuffle(ALL_QUESTIONS).slice(0, Math.min(CLASSIC_COUNT, ALL_QUESTIONS.length));
}

/* =========================================================================
   7) RENDERING – DASHBOARD
   ========================================================================= */
function renderTopbar(){
  const lp = levelProgress(STATE.totalVP);
  $("#vpVal").textContent = fmt(STATE.totalVP);
  $("#lvlVal").textContent = lp.lvl;
  $("#streakVal").textContent = STATE.streak.count||0;
  $("#levelBarFill").style.width = lp.pct+"%";
  $("#pillStreak").style.display = (STATE.streak.count>0)?"flex":"none";
}

function renderDashboard(){
  recomputeVisible();
  renderTopbar();

  // Datenfehler?
  if(DATA_ERROR){ return renderError(); }
  if(RAW_VALID.length===0){
    APP.innerHTML = noticeHTML("📭","Keine gültigen Fragen gefunden",
      `Die Datei <code>${DATA_URL}</code> enthält keine Fragen mit gültigem Feld <code>gueltig_ab</code>.`);
    return;
  }

  const lp = levelProgress(STATE.totalVP);
  const newQs = detectNewQuestions();
  const dossiers = dossierList();
  const noneVisible = ALL_QUESTIONS.length===0;

  // Modus-Verfügbarkeit
  const weakCount = ALL_QUESTIONS.filter(q=>{const a=STATE.answers[q.id];return a&&a.lastCorrect===false;}).length;
  const dailyDone = STATE.dailyDoneDate===todayStr();

  let html = `<div class="view">`;

  // Banner: Vorschau aktiv
  if(STATE.settings.preview){
    html += `<div class="card" style="padding:11px 15px;margin-top:16px;border-color:rgba(0,51,182,.3);font-size:.86rem;display:flex;gap:10px;align-items:center">
      <span style="font-size:1.1rem">👁️</span>
      <span><b style="color:var(--gold)">Vorschau-Modus aktiv</b> – auch noch nicht freigeschaltete Fragen werden angezeigt.</span>
    </div>`;
  }

  // Hinweis: aktuell keine Fragen freigeschaltet
  if(noneVisible){
    let when = EARLIEST_FUTURE ? ` Die ersten Fragen werden am <b>${EARLIEST_FUTURE}</b> freigeschaltet.` : "";
    html += `<div class="card" style="padding:16px;margin-top:16px;border-color:rgba(0,51,182,.3)">
      <b>🔒 Aktuell sind keine Fragen freigeschaltet.</b>
      <p style="color:var(--muted);font-size:.9rem;margin-top:6px">Fragen erscheinen automatisch ab ihrem Stichtag (<code>gueltig_ab</code>).${when}
      Über <b>⚙ Einstellungen → Vorschau</b> kannst du künftige Fragen schon jetzt zum Testen anzeigen.</p>
    </div>`;
  }

  // Begrüssung + Level
  html += `
    <h1 class="page-title">Willkommen zurück</h1>
    <p class="subtitle">${lp.rank} · Level ${lp.lvl} · ${fmt(STATE.totalVP)} VP
      ${lp.nextMin!==null?`· noch ${fmt(lp.toNext)} VP bis Level ${lp.lvl+1}`:`· Maximalstufe erreicht 👑`}</p>`;

  // Neue Fragen Hinweis
  if(newQs.length>0){
    html += `<div class="card" style="padding:13px 15px;margin-bottom:6px;border-color:rgba(0,51,182,.3);display:flex;align-items:center;gap:10px">
      <span style="font-size:1.2rem">✨</span>
      <span style="font-size:.9rem"><b style="color:var(--gold)">${newQs.length} neue Frage${newQs.length>1?"n":""}</b> seit deinem letzten Besuch freigeschaltet!</span>
      <button class="btn btn-ghost btn-sm" id="dismissNew" style="margin-left:auto">OK</button>
    </div>`;
  }

  // Modi
  html += `<div class="section-h"><h2>Spielmodi</h2><span class="line"></span></div><div class="modes">`;
  for(const key of ["classic","daily","focus","weak","exam"]){
    const m=MODES[key];
    let locked=false, lockNote="";
    if(key==="weak" && weakCount===0){ locked=true; lockNote="keine offenen Fehler"; }
    if(noneVisible){ locked=true; }
    let tag = m.tag;
    if(key==="daily" && dailyDone){ tag="✓ erledigt"; }
    if(key==="weak" && weakCount>0){ tag=weakCount+" offen"; }
    html += `<button class="mode${locked?" locked":""}" data-mode="${key}" ${locked?"disabled":""}>
      ${tag?`<span class="tag">${esc(tag)}</span>`:""}
      <span class="em">${m.emoji}</span>
      <h3>${m.title}</h3>
      <p>${locked&&lockNote?esc(lockNote):esc(m.desc)}</p>
    </button>`;
  }
  html += `</div>`;

  // Dossiers
  html += `<div class="section-h"><h2>Dossiers</h2><span class="line"></span><span class="count">${dossiers.length}</span></div>`;
  if(dossiers.length===0){
    html += `<p class="subtitle">Noch keine Dossiers freigeschaltet.</p>`;
  }else{
    html += `<div class="dossiers">`;
    for(const d of dossiers){
      const pct = d.total? Math.round(d.correct/d.total*100):0;
      const medal = medalFor(pct);
      html += `<button class="dossier" data-dossier="${esc(d.name)}">
        <div class="d-top">
          <span class="d-name">${esc(d.name)}</span>
          ${medal?`<span class="d-medal">${medal}</span>`:""}
        </div>
        <div class="progress"><i style="width:${pct}%"></i></div>
        <div class="d-meta">${d.correct}/${d.total} richtig · ${pct}%
          ${d.neu>0?`<span class="neu">${d.neu} NEU</span>`:""}</div>
      </button>`;
    }
    html += `</div>`;
  }

  // Profil-Button
  html += `<div style="margin-top:26px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-ghost" id="goProfile">🎖️ Profil & Badges</button>
      <button class="btn btn-ghost" id="goSettings2">⚙ Einstellungen</button>
    </div>`;

  html += `</div>`;
  APP.innerHTML = html;

  // Events
  APP.querySelectorAll(".mode:not(.locked)").forEach(el=>{
    el.addEventListener("click",()=>{
      const mode=el.dataset.mode;
      if(mode==="focus") renderFocusPicker();
      else startSession(mode);
    });
  });
  APP.querySelectorAll(".dossier").forEach(el=>{
    el.addEventListener("click",()=> startSession("focus",{dossier:el.dataset.dossier}));
  });
  const dn=$("#dismissNew"); if(dn) dn.addEventListener("click",()=>{ markAllKnown(); renderDashboard(); });
  $("#goProfile").addEventListener("click",renderProfile);
  $("#goSettings2").addEventListener("click",openSettings);

  // Bekannte IDs aktualisieren (nach Anzeige), damit nächster Besuch korrekt erkennt
  // (erst nach Klick auf "OK" oder beim Start einer Session)
}

/* Focus-Mode: Dossier-Auswahl */
function renderFocusPicker(){
  const dossiers = dossierList();
  let html = `<div class="view">
    <button class="back-link" id="backHome">← Zurück</button>
    <h1 class="page-title">🔎 Focus Mode</h1>
    <p class="subtitle">Wähle ein Dossier zum gezielten Training.</p>
    <div class="choice-list">`;
  for(const d of dossiers){
    const pct=d.total?Math.round(d.correct/d.total*100):0;
    html += `<button class="choice" data-dossier="${esc(d.name)}">
      <span class="c-name">${esc(d.name)}</span>
      <span class="c-meta">${d.total} Fragen<br><span style="color:var(--gold)">${pct}% gemeistert</span></span>
    </button>`;
  }
  html += `</div></div>`;
  APP.innerHTML=html;
  $("#backHome").addEventListener("click",renderDashboard);
  APP.querySelectorAll(".choice").forEach(el=>el.addEventListener("click",()=>startSession("focus",{dossier:el.dataset.dossier})));
}

/* =========================================================================
   8) QUIZ-SESSION
   ========================================================================= */
let SESSION = null;

function startSession(mode, opts={}){
  const questions = pickQuestions(mode, opts);
  if(questions.length===0){
    showToast("🚫","Keine Fragen verfügbar","Für diesen Modus stehen aktuell keine Fragen bereit.");
    return;
  }
  // bekannte IDs aktualisieren (Neu-Markierung „verbraucht")
  markAllKnown();

  const streakInfo = touchStreakForSession();   // Streak/erste-Session beim Start fixieren

  SESSION = {
    mode, opts, questions,
    idx:0,
    answered:0, correct:0,
    questionVP:0,            // Summe Frage-VP (Schwierigkeit + Matching)
    readVP:0,                // Summe Erklärungs-VP dieser Session
    results:[],              // {q, chosen, correct}
    streakMult: streakInfo.multiplier,
    firstSessionToday: streakInfo.firstSessionToday,
    timed: mode==="exam",
    timeLeft: mode==="exam"?EXAM_SECONDS:0,
    timerId:null,
    startTs: Date.now(),
  };

  if(SESSION.timed) startTimer();
  renderQuestion();
}

function startTimer(){
  const tick=()=>{
    SESSION.timeLeft--;
    updateTimerUI();
    if(SESSION.timeLeft<=0){
      clearInterval(SESSION.timerId);
      endSession(true);   // Zeit abgelaufen
    }
  };
  SESSION.timerId = setInterval(tick,1000);
}
function updateTimerUI(){
  const el=$("#timer"); if(!el) return;
  const m=Math.floor(SESSION.timeLeft/60), s=SESSION.timeLeft%60;
  el.textContent = `⏱ ${m}:${String(s).padStart(2,"0")}`;
  el.classList.toggle("warn", SESSION.timeLeft<=60);
}

function renderQuestion(){
  const S=SESSION, q=S.questions[S.idx];
  const total=S.questions.length;
  const diff=(q.schwierigkeit||"mittel").toLowerCase();
  const neu=isNeu(q);
  const isMatching = q.fragetyp==="matching";

  const typeHints = {
    matching:"Ordne die Vertragsstellen korrekt zu – wähle die stimmige Zuordnung.",
    was_steht_wirklich_drin:"Was steht wirklich im Vertragstext?",
    mythos_oder_fakt:"Mythos oder Fakt – wähle die zutreffende Aussage.",
    schaetzfrage:"Schätzfrage – welche Zahl/Frist/Schwelle stimmt?",
  };

  let html = `<div class="view">
    <button class="back-link" id="quitSession">← Session abbrechen</button>
    <div class="quiz-head">
      <div class="qprogress">
        <div class="bar"><i style="width:${Math.round(S.idx/total*100)}%"></i></div>
        <div class="lbl">Frage ${S.idx+1} von ${total} · ${MODES[S.mode].title}</div>
      </div>
      ${S.timed?`<div class="timer" id="timer">⏱ 20:00</div>`:""}
    </div>

    <div class="card q-card">
      <div class="q-meta">
        <span class="chip dossier-chip">${esc(q.dossier||"–")}</span>
        <span class="chip diff-${diff}">${esc(diff)}</span>
        ${isMatching?`<span class="chip">Matching · +${VP_MATCHING} VP</span>`:""}
        ${neu?`<span class="chip neu">NEU</span>`:""}
      </div>
      <div class="q-text">${esc(q.frage)}</div>
      <div class="q-type-hint">${esc(typeHints[q.fragetyp]||"")}</div>
      <div class="answers" id="answers">`;

  const letters=["A","B","C","D","E","F"];
  q.optionen.forEach((opt,i)=>{
    // Matching-Optionen mit " / " hübsch in Zeilen aufteilen
    let inner;
    if(isMatching && String(opt).includes(" / ")){
      inner = String(opt).split(" / ").map(p=>`<span class="pair">${esc(p)}</span>`).join("");
    }else{
      inner = esc(opt);
    }
    html += `<button class="answer" data-i="${i}">
      <span class="key">${letters[i]||i+1}</span>
      <span class="txt">${inner}</span>
      <span class="res"></span>
    </button>`;
  });

  html += `</div></div>
    <div id="explainSlot"></div>
    <div class="quiz-foot hidden" id="quizFoot">
      <button class="btn btn-gold btn-block" id="nextBtn">${S.idx+1>=total?"Session abschliessen":"Nächste Frage →"}</button>
    </div>
  </div>`;

  APP.innerHTML=html;
  if(S.timed) updateTimerUI();

  $("#quitSession").addEventListener("click",()=>{
    if(confirm("Session wirklich abbrechen? Der Fortschritt dieser Runde geht verloren.")){
      if(S.timerId) clearInterval(S.timerId);
      SESSION=null; renderDashboard();
    }
  });
  APP.querySelectorAll(".answer").forEach(el=>el.addEventListener("click",()=>handleAnswer(parseInt(el.dataset.i,10))));
}

function handleAnswer(chosen){
  const S=SESSION, q=S.questions[S.idx];
  const correctIdx = q.korrekte_option;
  const isCorrect = chosen===correctIdx;
  const isMatching = q.fragetyp==="matching";
  const diff=(q.schwierigkeit||"mittel").toLowerCase();

  // Buttons sperren + einfärben
  APP.querySelectorAll(".answer").forEach(el=>{
    const i=parseInt(el.dataset.i,10);
    el.disabled=true;
    if(i===correctIdx){ el.classList.add("correct"); el.querySelector(".res").textContent="✓"; }
    else if(i===chosen){ el.classList.add("incorrect"); el.querySelector(".res").textContent="✗"; }
  });

  // VP berechnen
  let gained=0;
  if(isCorrect){
    gained += VP_DIFF[diff]||VP_DIFF.mittel;
    if(isMatching) gained += VP_MATCHING;
    S.questionVP += gained;
    S.correct++;
    showVPFloat("+"+gained+" VP");
  }
  S.answered++;

  // Antwort dauerhaft protokollieren (für Weak Spots, Dossier-Fortschritt, Statistik)
  const rec = STATE.answers[q.id] || {correctOnce:false, lastCorrect:false, attempts:0};
  rec.attempts += 1;
  rec.lastCorrect = isCorrect;
  if(isCorrect) rec.correctOnce = true;
  STATE.answers[q.id]=rec;
  saveState();

  S.results.push({q, chosen, correct:isCorrect, gained});

  // Erklärung anzeigen (mit Lese-Bonus, einmal pro Frage)
  renderExplanation(q, isCorrect);

  $("#quizFoot").classList.remove("hidden");
  $("#nextBtn").addEventListener("click",()=>{
    S.idx++;
    if(S.idx>=S.questions.length) endSession(false);
    else renderQuestion();
  },{once:true});
}

function renderExplanation(q, wasCorrect){
  const alreadyRead = !!STATE.readQuestions[q.id];
  let bonusText="";
  if(!alreadyRead){
    STATE.readQuestions[q.id]=true;
    STATE.explanationsRead += 1;
    SESSION.readVP += VP_ERKLAERUNG;
    bonusText = `+${VP_ERKLAERUNG} VP fürs Lesen`;
    saveState();
  }
  const src = [
    q.originaldokument_rechtsakt && `<b>Quelle:</b> ${esc(q.originaldokument_rechtsakt)}`,
    q.genaue_vertragsstelle && `<b>Stelle:</b> ${esc(q.genaue_vertragsstelle)}`,
  ].filter(Boolean).join(" · ");

  $("#explainSlot").innerHTML = `
    <div class="explain" style="animation:fade .3s">
      <div class="x-head">
        <span>${wasCorrect?"✅ Richtig":"❌ Leider falsch"}</span>
        ${bonusText?`<span class="vp">${bonusText}</span>`:""}
      </div>
      <div class="x-body">
        ${esc(q.erklaerung||"Keine Erklärung hinterlegt.")}
        ${src?`<div class="src">${src}</div>`:""}
      </div>
    </div>`;
}

function showVPFloat(text){
  const el=document.createElement("div");
  el.className="vp-float"; el.textContent=text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1100);
}

/* =========================================================================
   9) SESSION-ENDE & PUNKTE-AUSWERTUNG
   ========================================================================= */
function endSession(timeUp){
  const S=SESSION;
  if(S.timerId) clearInterval(S.timerId);

  const total=S.answered || S.questions.length;
  const pct = total? Math.round(S.correct/total*100):0;
  const perfect = total>0 && S.correct===total && S.answered===S.questions.length;

  // VP-Zusammensetzung
  const baseVP = S.questionVP + S.readVP;
  const multiplier = S.streakMult * (S.firstSessionToday?MULT_ERSTE_SESSION:1);
  const multipliedVP = Math.round(baseVP * multiplier);
  const perfectBonus = perfect ? VP_PERFEKT : 0;
  const sessionVP = multipliedVP + perfectBonus;

  // State fortschreiben
  STATE.totalVP += sessionVP;
  STATE.sessionsPlayed += 1;
  if(perfect) STATE.perfectSessions += 1;
  if(S.mode==="daily"){ STATE.dailyChallengesDone += 1; STATE.dailyDoneDate=todayStr(); }
  if(S.mode==="exam" && pct>=80) STATE.examPassed += 1;
  saveState();

  const newBadges = checkBadges();
  renderResult({total,pct,perfect,baseVP,multiplier,multipliedVP,perfectBonus,sessionVP,timeUp});
  newBadges.forEach((b,i)=> setTimeout(()=>showToast(b.em,"Badge freigeschaltet!",b.t), 600+i*900));
}

function renderResult(r){
  const S=SESSION;
  renderTopbar();

  const verdicts = r.pct>=90?["🏆","Herausragend!"]:r.pct>=70?["🎉","Stark gespielt!"]:r.pct>=50?["👍","Solide Runde."]:["📚","Da geht noch mehr."];
  const circ=2*Math.PI*64;
  const dash=circ*(r.pct/100);

  const examInfo = (S.mode==="exam")
    ? `<p class="verdict">${r.timeUp?"⏱ Zeit abgelaufen – ":""}${r.pct>=80?"Prüfung <b style='color:var(--correct)'>bestanden</b> 🎓":"Prüfung <b style='color:var(--incorrect)'>nicht bestanden</b> (≥80 % nötig)"}</p>`
    : "";

  let html=`<div class="view result">
    <div class="ring">
      <svg width="148" height="148">
        <circle cx="74" cy="74" r="64" fill="none" stroke="#E2E2DE" stroke-width="11"/>
        <circle cx="74" cy="74" r="64" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="${dash} ${circ}"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3366d6"/><stop offset="1" stop-color="#0033B6"/></linearGradient></defs>
      </svg>
      <div class="pct">${r.pct}%</div>
    </div>
    <h2>${verdicts[0]} ${verdicts[1]}</h2>
    <p class="verdict">${MODES[S.mode].title} · ${S.correct} von ${r.total} richtig</p>
    ${examInfo}

    <div class="score-grid">
      <div class="s"><b style="color:var(--correct)">${S.correct}</b><span>Richtig</span></div>
      <div class="s"><b style="color:var(--incorrect)">${r.total-S.correct}</b><span>Falsch</span></div>
      <div class="s"><b style="color:var(--gold)">+${fmt(r.sessionVP)}</b><span>VP</span></div>
    </div>

    <div class="vp-break">
      <div class="row"><span>Frage-Punkte</span><span>${fmt(S.questionVP)} VP</span></div>
      <div class="row"><span>Erklärungen gelesen</span><span>${fmt(S.readVP)} VP</span></div>
      ${r.multiplier>1?`<div class="row"><span>Multiplikator <span class="mul">${S.firstSessionToday?"1. Session ×1.5 · ":""}Streak ×${S.streakMult.toFixed(2)}</span></span><span>×${r.multiplier.toFixed(2)}</span></div>`:""}
      ${r.perfectBonus?`<div class="row"><span>100 %-Bonus 💯</span><span>+${fmt(r.perfectBonus)} VP</span></div>`:""}
      <div class="row"><span>Total dieser Session</span><span>+${fmt(r.sessionVP)} VP</span></div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="btn btn-gold" id="againBtn">Nochmal</button>
      <button class="btn btn-ghost" id="homeBtn">Zur Übersicht</button>
    </div>
  </div>`;

  APP.innerHTML=html;
  if(r.pct>=70) launchConfetti();

  $("#againBtn").addEventListener("click",()=>{
    const m=S.mode, o=S.opts; SESSION=null; startSession(m,o);
  });
  $("#homeBtn").addEventListener("click",()=>{ SESSION=null; renderDashboard(); });
}

function launchConfetti(){
  const wrap=document.createElement("div"); wrap.className="confetti";
  const colors=["#E30613","#0033B6","#2E7D32","#FF6D00","#FFC107"];
  for(let i=0;i<70;i++){
    const c=document.createElement("i");
    c.style.left=Math.random()*100+"%";
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2.4+Math.random()*1.8)+"s";
    c.style.animationDelay=(Math.random()*0.5)+"s";
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    wrap.appendChild(c);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(),4200);
}

/* =========================================================================
   10) PROFIL & BADGES
   ========================================================================= */
function renderProfile(){
  const lp=levelProgress(STATE.totalVP);
  const stats=buildStatSnapshot();
  const earned=Object.keys(STATE.badges).length;

  let html=`<div class="view">
    <button class="back-link" id="backHome">← Zurück</button>
    <div class="card profile-hero">
      <div class="rank-disc">${lp.lvl}</div>
      <div class="pi">
        <h2>${lp.rank}</h2>
        <div class="lv">Level ${lp.lvl} · ${fmt(STATE.totalVP)} VP</div>
        <div class="vp">${lp.nextMin!==null?`Noch ${fmt(lp.toNext)} VP bis Level ${lp.lvl+1}`:"Maximalstufe erreicht 👑"}</div>
      </div>
    </div>

    <div class="stat-cards">
      <div class="sc"><b>${fmt(stats.totalCorrect)}</b><span>Richtige Fragen</span></div>
      <div class="sc"><b>${fmt(STATE.sessionsPlayed)}</b><span>Sessions</span></div>
      <div class="sc"><b>${STATE.streak.count||0}</b><span>Streak (Tage)</span></div>
      <div class="sc"><b>${STATE.streak.max||0}</b><span>Längster Streak</span></div>
      <div class="sc"><b>${fmt(stats.perfectSessions)}</b><span>100 %-Sessions</span></div>
      <div class="sc"><b>${fmt(STATE.explanationsRead)}</b><span>Erklärungen</span></div>
      <div class="sc"><b>${stats.dossiersMastered}/${stats.dossiersTotal}</b><span>Dossiers gemeistert</span></div>
      <div class="sc"><b>${earned}/${BADGES.length}</b><span>Badges</span></div>
    </div>

    <div class="section-h"><h2>Badges</h2><span class="line"></span><span class="count">${earned}/${BADGES.length}</span></div>
    <div class="badges">`;
  for(const b of BADGES){
    const got=!!STATE.badges[b.id];
    html += `<div class="badge${got?" earned":""}">
      <span class="em">${b.em}</span>
      <b>${esc(b.t)}</b>
      <small>${got?"✓ "+STATE.badges[b.id]:esc(b.d)}</small>
    </div>`;
  }
  html += `</div></div>`;
  APP.innerHTML=html;
  $("#backHome").addEventListener("click",renderDashboard);
}

/* =========================================================================
   11) EINSTELLUNGEN, EXPORT/IMPORT
   ========================================================================= */
function openSettings(){
  const ov=document.createElement("div"); ov.className="modal-bg"; ov.id="settingsModal";
  ov.innerHTML=`<div class="card modal">
    <h3>⚙ Einstellungen</h3>

    <div class="setting-row">
      <div class="lab"><b>Vorschau-Modus</b><small>Künftige (noch nicht freigeschaltete) Fragen anzeigen – nur zum Testen.</small></div>
      <label class="switch"><input type="checkbox" id="setPreview" ${STATE.settings.preview?"checked":""}><span class="sl"></span></label>
    </div>

    <div class="setting-row">
      <div class="lab"><b>Fortschritt exportieren</b><small>Alle Daten als JSON-Datei sichern.</small></div>
      <button class="btn btn-ghost btn-sm" id="setExport">Export</button>
    </div>
    <div class="setting-row">
      <div class="lab"><b>Fortschritt importieren</b><small>Zuvor exportierte JSON-Datei laden.</small></div>
      <button class="btn btn-ghost btn-sm" id="setImport">Import</button>
    </div>
    <div class="setting-row">
      <div class="lab"><b>Alles zurücksetzen</b><small>Löscht VP, Streak, Badges und Verlauf.</small></div>
      <button class="btn btn-ghost btn-sm" id="setReset" style="border-color:rgba(239,68,68,.5);color:#f87171">Reset</button>
    </div>

    <div style="margin-top:16px;display:flex;justify-content:flex-end">
      <button class="btn btn-gold btn-sm" id="setClose">Schliessen</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  </div>`;
  document.body.appendChild(ov);

  ov.addEventListener("click",e=>{ if(e.target===ov) ov.remove(); });
  $("#setClose").addEventListener("click",()=>ov.remove());

  $("#setPreview").addEventListener("change",e=>{
    STATE.settings.preview=e.target.checked; saveState();
    recomputeVisible(); EARLIEST_FUTURE=null;
    showToast(e.target.checked?"👁️":"🔒","Vorschau "+(e.target.checked?"aktiviert":"deaktiviert"),
      ALL_QUESTIONS.length+" Fragen verfügbar");
  });
  $("#setExport").addEventListener("click",exportProgress);
  $("#setImport").addEventListener("click",()=>$("#importFile").click());
  $("#importFile").addEventListener("change",importProgress);
  $("#setReset").addEventListener("click",()=>{
    if(confirm("Wirklich ALLE Daten löschen? Das kann nicht rückgängig gemacht werden.")){
      localStorage.removeItem(STORE_KEY);
      STATE=defaultState(); saveState();
      ov.remove(); recomputeVisible(); renderDashboard();
      showToast("🧹","Zurückgesetzt","Alle Daten wurden gelöscht.");
    }
  });
}

function exportProgress(){
  const blob=new Blob([JSON.stringify(STATE,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`bilateralis-fortschritt-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("💾","Exportiert","Fortschritt als JSON gespeichert.");
}

function importProgress(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(typeof data!=="object"||Array.isArray(data)) throw new Error("Unerwartetes Format");
      STATE=Object.assign(defaultState(), data, {
        streak:Object.assign({count:0,lastDate:null,max:0}, data.streak||{}),
        settings:Object.assign({preview:false}, data.settings||{}),
      });
      saveState(); recomputeVisible();
      const m=$("#settingsModal"); if(m) m.remove();
      renderDashboard();
      showToast("✅","Importiert","Fortschritt erfolgreich geladen.");
    }catch(err){
      console.error("Import fehlgeschlagen:",err);
      showToast("⚠️","Import fehlgeschlagen","Die Datei ist keine gültige Fortschritts-Datei.");
    }
  };
  reader.readAsText(file);
}

/* =========================================================================
   12) TOASTS & FEHLERANZEIGE
   ========================================================================= */
function showToast(em,title,sub){
  const wrap=$("#toastWrap");
  const t=document.createElement("div"); t.className="toast";
  t.innerHTML=`<span class="em">${em}</span><div><b>${esc(title)}</b><small>${esc(sub||"")}</small></div>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .4s,transform .4s"; t.style.opacity="0"; t.style.transform="translateY(14px)"; setTimeout(()=>t.remove(),420); },3600);
}

function noticeHTML(em,title,bodyHTML){
  return `<div class="view notice"><span class="em">${em}</span><h2>${esc(title)}</h2><p>${bodyHTML}</p></div>`;
}

function renderError(){
  APP.innerHTML = `<div class="view notice">
    <span class="em">⚠️</span>
    <h2>Fragen konnten nicht geladen werden</h2>
    <p>Die Datei <code>${DATA_URL}</code> wurde nicht gefunden oder ist nicht lesbar.</p>
    <p style="margin-top:12px">Bitte prüfe:</p>
    <p>1. Liegt <code>quiz_fragen.json</code> im Unterordner <code>Quiz/</code> neben dieser Seite?</p>
    <p>2. Wird die Seite über einen <b>Webserver</b> geöffnet (nicht per Doppelklick als <code>file://</code>)?<br>
       <small>Lokaler Server, z. B.: <code>python -m http.server</code> im Projektordner, dann <code>http://localhost:8000</code> öffnen.</small></p>
    <p style="margin-top:10px;color:var(--muted-2);font-size:.8rem">Technische Meldung: ${esc(DATA_ERROR&&DATA_ERROR.message||"unbekannt")}</p>
    <div style="margin-top:18px"><button class="btn btn-gold" id="retryBtn">Erneut versuchen</button></div>
  </div>`;
  const rb=$("#retryBtn"); if(rb) rb.addEventListener("click",()=>location.reload());
}

/* =========================================================================
   13) INITIALISIERUNG
   ========================================================================= */
$("#brandHome").addEventListener("click",()=>{ if(SESSION){ if(SESSION.timerId)clearInterval(SESSION.timerId); SESSION=null; } renderDashboard(); });
$("#btnSettings").addEventListener("click",openSettings);
$("#pillLevel").addEventListener("click",renderProfile);

(async function init(){
  await loadData();
  renderDashboard();
})();
</script>
