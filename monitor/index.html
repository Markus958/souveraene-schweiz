<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>News-, EU- und Risikomonitor – Souveräne Schweiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <style>
    :root { --red:#E30613; --ink:#202124; --muted:#667085; --line:#e5e7eb; --soft:#f7f7f8; --ok:#067647; --warn:#b54708; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; font-family:Inter,system-ui,sans-serif; color:var(--ink); background:#fff; }
    header { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.97); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
    .bar,.wrap { max-width:1180px; margin:auto; padding:0 20px; }
    .bar { min-height:54px; display:flex; align-items:center; gap:18px; }
    .brand { font:700 15px/1.1 'Source Serif 4',Georgia,serif; text-decoration:none; color:var(--ink); white-space:nowrap; }
    .brand span { color:var(--red); }
    h1 { font:700 22px/1.15 'Source Serif 4',Georgia,serif; margin:0; flex:1; }
    .back { color:var(--muted); text-decoration:none; font-size:12px; white-space:nowrap; }
    .toolbar-wrap { border-bottom:1px solid var(--line); background:#fff; }
    .toolbar { max-width:1180px; margin:auto; padding:8px 20px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .control { display:flex; align-items:center; gap:5px; }
    .control label { color:var(--muted); font-size:11px; }
    select,input[type="search"] { border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:#fff; font:12px Inter,system-ui,sans-serif; min-height:30px; }
    #searchInput { width:180px; }
    .source-status { position:relative; display:inline-flex; align-items:center; border:1px solid #b7e4cf; color:var(--ok); background:#ecfdf3; border-radius:999px; padding:5px 9px; font-size:11px; font-weight:700; cursor:help; }
    .source-status.incomplete { border-color:#fedf89; color:var(--warn); background:#fffaeb; }
    .tooltip { display:none; position:absolute; top:calc(100% + 7px); right:0; width:310px; max-height:380px; overflow:auto; background:#fff; border:1px solid var(--line); border-radius:9px; box-shadow:0 12px 30px rgba(0,0,0,.13); padding:9px 11px; color:var(--ink); font-weight:400; line-height:1.5; z-index:30; }
    .source-status:hover .tooltip,.source-status:focus-within .tooltip { display:block; }
    .source-line { display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid #f0f0f0; padding:4px 0; }
    .source-line:last-child { border-bottom:0; }
    main { padding:16px 0 60px; }
    .day { scroll-margin-top:105px; margin:0 0 34px; }
    .day-head { display:flex; align-items:baseline; gap:10px; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:9px; }
    .day-head h2 { font:700 20px/1.2 'Source Serif 4',Georgia,serif; margin:0; }
    .day-head .meta { color:var(--muted); font-size:11px; }
    h3 { font:700 16px/1.25 'Source Serif 4',Georgia,serif; margin:17px 0 7px; }
    .table-wrap { width:100%; overflow-x:auto; border-top:1px solid var(--line); }
    table { width:100%; border-collapse:collapse; table-layout:fixed; }
    th { text-align:left; font-size:11px; color:var(--muted); font-weight:600; padding:7px 7px; border-bottom:1px solid var(--line); vertical-align:bottom; }
    td { font-size:12px; line-height:1.42; padding:8px 7px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
    tr:last-child td { border-bottom:0; }
    .news-table .c-nr { width:4%; }
    .news-table .c-artikel { width:26%; }
    .news-table .c-ressort { width:10%; }
    .news-table .c-page { width:7%; }
    .news-table .c-pot { width:8%; }
    .news-table .c-approach { width:45%; }
    .eu-table .c-change { width:15%; }
    .eu-table .c-desc { width:40%; }
    .eu-table .c-rel { width:45%; }
    .risk-table .c-dossier { width:22%; }
    .risk-table .c-news { width:58%; }
    .risk-table .c-change { width:20%; }
    .article-link { color:var(--ink); font-weight:600; text-decoration:none; }
    .article-link:hover { color:var(--red); }
    .article-info-toggle { border:0; background:transparent; color:var(--red); cursor:pointer; font-size:13px; padding:0 2px; margin-left:5px; vertical-align:baseline; }
    .article-info-toggle:hover { color:#a6000b; }
    .article-detail-row td { background:#fbfbfc; padding:0 8px 10px; }
    .article-detail-card { border-left:3px solid var(--red); background:#fff; border-radius:0 8px 8px 0; box-shadow:0 4px 14px rgba(0,0,0,.05); padding:12px 14px; }
    .detail-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:10px 20px; }
    .detail-grid strong { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:3px; }
    .detail-grid p { margin:0; font-size:12px; line-height:1.5; }
    .detail-meta { grid-column:1 / -1; }
    .detail-source-link { margin-left:7px; color:var(--red); text-decoration:none; font-weight:600; }
    .detail-source-link:hover { text-decoration:underline; }
    .detail-note { margin-top:9px; padding-top:8px; border-top:1px solid var(--line); color:var(--muted); font-size:10px; }
    .small { color:var(--muted); font-size:11px; }
    .pot { font-weight:700; white-space:nowrap; }
    .yes { color:var(--red); font-weight:700; }
    .no { color:var(--ok); font-weight:700; }
    .empty { background:var(--soft); color:var(--muted); border-radius:7px; padding:10px 12px; font-size:12px; }
    .eu-links { position:relative; display:inline-block; margin-left:5px; cursor:help; color:var(--red); font-weight:700; }
    .eu-links .tooltip { left:0; right:auto; width:360px; }
    .eu-links a { color:#344054; display:block; margin:5px 0; text-decoration:none; }
    .eu-links a:hover { color:var(--red); }
    .history { margin-top:22px; border:1px solid var(--line); border-radius:9px; background:var(--soft); }
    .history > summary,.history-run > summary { cursor:pointer; list-style:none; font-size:12px; font-weight:700; padding:10px 12px; }
    .history > summary::-webkit-details-marker,.history-run > summary::-webkit-details-marker { display:none; }
    .history > summary::before,.history-run > summary::before { content:'›'; display:inline-block; margin-right:7px; transition:transform .15s ease; }
    .history[open] > summary::before,.history-run[open] > summary::before { transform:rotate(90deg); }
    .history-count { display:inline-block; min-width:20px; text-align:center; margin-left:5px; padding:1px 6px; border-radius:999px; background:#fff; border:1px solid var(--line); color:var(--muted); font-size:10px; }
    .history-body { padding:0 10px 10px; }
    .history-run { background:#fff; border:1px solid var(--line); border-radius:7px; margin-top:8px; }
    .history-snapshot { padding:0 10px 12px; }
    .history-snapshot h3:first-child { margin-top:8px; }
    footer { border-top:1px solid var(--line); color:var(--muted); font-size:11px; padding:18px 0 30px; }
    @media (max-width:820px) {
      .bar { align-items:flex-start; padding-top:9px; padding-bottom:9px; }
      h1 { font-size:18px; }
      .brand { display:none; }
      .toolbar { align-items:flex-end; }
      #searchInput { width:140px; }
      .day-head { align-items:flex-start; flex-direction:column; gap:3px; }
      .news-table { min-width:900px; }
      .eu-table,.risk-table { min-width:700px; }
      .detail-grid { grid-template-columns:1fr; }
      .detail-meta { grid-column:auto; }
    }
  </style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="/">Souveräne <span>Schweiz</span></a>
    <h1 id="pageTitle">News-, EU- und Risikomonitor</h1>
    <div id="sourceStatus" class="source-status">Quellen –</div>
    <a class="back" href="/">Zur Website</a>
  </div>
</header>
<div class="toolbar-wrap">
  <div class="toolbar">
    <div class="control"><label for="reportSelect">Tag</label><select id="reportSelect"></select></div>
    <div class="control"><label for="searchInput">Suche</label><input id="searchInput" type="search" placeholder="UBS, EU, AHV …"></div>
    <div class="control"><label for="statusFilter">Status</label><select id="statusFilter"><option value="all">Alle</option><option value="Neu">Neu</option><option value="Update">Update</option><option value="Korrektur">Korrektur</option><option value="Unklar">Unklar</option><option value="Duplikat">Duplikat</option><option value="changed">Geändert</option><option value="unchanged">Unverändert</option></select></div>
    <div class="control"><label for="dossierFilter">Bereich</label><select id="dossierFilter"><option value="all">Alle</option><option value="news">News</option><option value="eu">EU</option><option value="UBS">UBS</option><option value="F-35 / Air2030">F-35</option><option value="Patriot / Bodluv GR">Patriot</option><option value="13. AHV-Rente">13. AHV</option></select></div>
  </div>
</div>
<main><div class="wrap"><div id="reports"></div></div></main>
<footer><div class="wrap">Automatisch erstellter Arbeitsstand. Unvollständige Quellenlagen werden ausdrücklich ausgewiesen.</div></footer>
<script src="monitor.js?v=20261014-2"></script>
</body>
</html>
