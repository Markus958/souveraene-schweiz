<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<defs><style>
.bg { fill:#f7f7f5; }
.title { font-family: Georgia, 'Times New Roman', serif; font-size:60px; font-weight:700; fill:#1f1f1f; }
.subtitle { font-family: Arial, Helvetica, sans-serif; font-size:28px; fill:#4b4b4b; }
.eyebrow { font-family: Arial, Helvetica, sans-serif; font-size:24px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; fill:#6d6d6d; }
.card { fill:#ffffff; stroke:#d9ddd8; stroke-width:2.4; rx:24; }
.head { fill:#eef5ef; stroke:#bfd1c3; stroke-width:1.5; rx:18; }
.label { font-family: Arial, Helvetica, sans-serif; font-size:24px; font-weight:700; fill:#2f5e43; }
.big { font-family: Arial, Helvetica, sans-serif; font-size:50px; font-weight:700; fill:#1f1f1f; }
.small { font-family: Arial, Helvetica, sans-serif; font-size:24px; fill:#333333; }
.note { font-family: Arial, Helvetica, sans-serif; font-size:21px; fill:#666666; }
.callout { fill:#f6efe2; stroke:#dfcaa2; stroke-width:1.5; rx:18; }
.calltext { font-family: Arial, Helvetica, sans-serif; font-size:24px; fill:#3a3a3a; }
.footer { font-family: Arial, Helvetica, sans-serif; font-size:22px; fill:#666666; }
</style></defs>
<rect class="bg" x="0" y="0" width="1400" height="980"/>
<text x="90" y="90" class="eyebrow">10 Mio Schweiz · Zuwanderung</text>
<text x="90" y="162" class="title">Hohe Zuwanderung, ungleiche Steuerung</text>
<text x="90" y="212" class="subtitle">2024 zeigt den Kern des Problems: Der grösste Teil kommt aus dem Bereich mit dem geringsten Handlungsspielraum</text>

<rect x="90" y="280" width="300" height="240" class="card"/>
<rect x="115" y="305" width="205" height="44" class="head"/>
<text x="142" y="336" class="label">Gesamtzuwanderung</text>
<text x="120" y="420" class="big">170'607</text>
<text x="120" y="462" class="small">Personen 2024</text>
<text x="120" y="505" class="note">ständige Wohnbevölkerung</text>

<rect x="420" y="280" width="300" height="240" class="card"/>
<rect x="445" y="305" width="160" height="44" class="head"/>
<text x="472" y="336" class="label">EU/EFTA</text>
<text x="450" y="400" class="big">120'546</text>
<text x="450" y="442" class="small">70,7 % der Zuwanderung</text>
<text x="450" y="485" class="note">weitgehend FZA-gesteuert</text>

<rect x="750" y="280" width="300" height="240" class="card"/>
<rect x="775" y="305" width="165" height="44" class="head"/>
<text x="802" y="336" class="label">Drittstaaten</text>
<text x="780" y="400" class="big">50'061</text>
<text x="780" y="442" class="small">29,3 % der Zuwanderung</text>
<text x="780" y="485" class="note">kontingentiert und reguliert</text>

<rect x="1080" y="280" width="230" height="240" class="card"/>
<rect x="1105" y="305" width="140" height="44" class="head"/>
<text x="1132" y="336" class="label">Saldo</text>
<text x="1110" y="400" class="big">83'392</text>
<text x="1110" y="442" class="small">Nettozuwanderung</text>
<text x="1110" y="485" class="note">2024</text>

<rect x="90" y="590" width="1220" height="190" class="callout"/>
<text x="125" y="655" class="label">Lesart</text>
<text x="125" y="710" class="calltext">Die zentrale politische Asymmetrie lautet: Der zahlenmässig wichtigste Teil der Zuwanderung</text>
<text x="125" y="748" class="calltext">kommt aus dem EU/EFTA-Raum – und genau dort ist die direkte Steuerung der Schweiz am schwächsten.</text>

<text x="90" y="885" class="footer">Die Debatte dreht sich deshalb nicht nur um die Höhe der Zuwanderung, sondern um die Frage, wo die Schweiz überhaupt wirksam eingreifen kann.</text>
</svg>