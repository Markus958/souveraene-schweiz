<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800">
  <defs>
    <style>
      .bg { fill: #f7f7f5; }
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 64px; font-weight: 700; fill: #202020; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 28px; fill: #4a4a4a; }
      .eyebrow { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; fill: #6a6a6a; }
      .card-title { font-family: Georgia, 'Times New Roman', serif; font-size: 42px; font-weight: 700; fill: #202020; }
      .card-year { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #2f5e43; }
      .big { font-family: Arial, Helvetica, sans-serif; font-size: 62px; font-weight: 700; fill: #202020; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 30px; fill: #303030; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 24px; fill: #666666; }
      .card { fill: #ffffff; stroke: #d9ddd8; stroke-width: 2.5; rx: 28; }
      .accent { fill: #eef5ef; stroke: #b9cdbf; stroke-width: 2; rx: 22; }
      .arrow { stroke: #9ea7a0; stroke-width: 10; stroke-linecap: round; }
      .arrow-head { fill: #9ea7a0; }
      .footer { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #666666; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="1800" />

  <text x="110" y="110" class="eyebrow">Wohnen &amp; Raum</text>
  <text x="110" y="190" class="title">Mehr Haushalte brauchen mehr Raum</text>
  <text x="110" y="245" class="subtitle">Variante B: Ausgangslage und wachsender Wohnraumbedarf in klarer Reihenfolge</text>

  <!-- Card 1 -->
  <rect x="110" y="330" width="1180" height="320" class="card" />
  <rect x="150" y="370" width="380" height="74" class="accent" />
  <text x="190" y="418" class="card-year">Schon passiert</text>
  <text x="150" y="515" class="card-title">Land wurde bereits verbraucht</text>
  <text x="150" y="590" class="big">+54'000 ha</text>
  <text x="150" y="635" class="body">versiegeltes Landwirtschaftsland</text>
  <text x="150" y="680" class="small">1985–2009 · zeigt den bereits erfolgten Flächenverlust</text>

  <!-- Arrow 1 -->
  <line x1="700" y1="675" x2="700" y2="760" class="arrow" />
  <polygon points="700,800 675,760 725,760" class="arrow-head" />

  <!-- Card 2 -->
  <rect x="110" y="820" width="1180" height="320" class="card" />
  <rect x="150" y="860" width="230" height="74" class="accent" />
  <text x="195" y="908" class="card-year">Bis 2030</text>
  <text x="150" y="1005" class="card-title">zusätzlicher Wohnraumbedarf steigt weiter</text>
  <text x="150" y="1080" class="big">+240'000</text>
  <text x="150" y="1125" class="body">zusätzliche Haushalte</text>
  <text x="150" y="1170" class="small">Wüest Partner · mehr Bedarf an Wohnungen, Erschliessung und Infrastruktur</text>

  <!-- Arrow 2 -->
  <line x1="700" y1="1165" x2="700" y2="1250" class="arrow" />
  <polygon points="700,1290 675,1250 725,1250" class="arrow-head" />

  <!-- Card 3 -->
  <rect x="110" y="1310" width="1180" height="320" class="card" />
  <rect x="150" y="1350" width="230" height="74" class="accent" />
  <text x="195" y="1398" class="card-year">Bis 2050</text>
  <text x="150" y="1495" class="card-title">der Druck nimmt nochmals deutlich zu</text>
  <text x="150" y="1570" class="big">+750'000</text>
  <text x="150" y="1615" class="body">zusätzliche Haushalte</text>
  <text x="150" y="1660" class="small">Langfristige Grössenordnung des zusätzlichen Wohnraumbedarfs</text>

  <text x="110" y="1740" class="footer">Leselogik: erst bereits verlorener Raum, dann zusätzlicher Bedarf bis 2030, danach die noch grössere Belastung bis 2050.</text>
</svg>
