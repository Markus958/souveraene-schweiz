<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>
.title { font-family: Georgia, 'Times New Roman', serif; font-size: 46px; font-weight: 700; fill: #1f1f1f; }
.subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #666666; }
.body { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #1f1f1f; }
.bodySmall { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #1f1f1f; }
.small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #666666; }
.metric { font-family: Arial, Helvetica, sans-serif; font-size: 54px; font-weight: 700; fill: #1f1f1f; }
.metricRed { font-family: Arial, Helvetica, sans-serif; font-size: 54px; font-weight: 700; fill: #a61d24; }
.label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #1f1f1f; }
.cardTitle { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #1f1f1f; }
.source { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #666666; }
.caption { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #666666; }
</style>
<rect width="1600" height="900" fill="#ffffff"/><rect x="0" y="0" width="1600" height="26" fill="#a61d24"/><rect x="85" y="92" width="100" height="10" fill="#8eb286"/><text x="85" y="160" class="small" text-anchor="start"><tspan x="85" dy="0">10 Mio Schweiz</tspan></text><text x="85" y="225" class="title" text-anchor="start"><tspan x="85" dy="0">Wohnraum wird zum Engpass</tspan></text><text x="85" y="275" class="subtitle" text-anchor="start"><tspan x="85" dy="0">Mehr Nachfrage trifft auf einen Markt mit immer weniger Reserve.</tspan></text><rect x="85" y="330" rx="18" ry="18" width="300" height="170" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/><text x="235.0" y="378" class="label" text-anchor="middle"><tspan x="235.0" dy="0">Leerstand 2024</tspan></text><text x="235.0" y="428" class="metric" text-anchor="middle"><tspan x="235.0" dy="0">1,08 %</tspan></text><text x="235.0" y="470" class="small" text-anchor="middle"><tspan x="235.0" dy="0">landesweit</tspan></text><rect x="415" y="330" rx="18" ry="18" width="300" height="170" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/><text x="565.0" y="378" class="label" text-anchor="middle"><tspan x="565.0" dy="0">Leere Wohnungen</tspan></text><text x="565.0" y="428" class="metric" text-anchor="middle"><tspan x="565.0" dy="0">51'974</tspan></text><text x="565.0" y="470" class="small" text-anchor="middle"><tspan x="565.0" dy="0">Stand 1. Juni 2024</tspan></text><rect x="745" y="330" rx="18" ry="18" width="300" height="170" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/><text x="895.0" y="378" class="label" text-anchor="middle"><tspan x="895.0" dy="0">Angebotsmieten 2024</tspan></text><text x="895.0" y="428" class="metricRed" text-anchor="middle"><tspan x="895.0" dy="0">+3,2 %</tspan></text><text x="895.0" y="470" class="small" text-anchor="middle"><tspan x="895.0" dy="0">Schweiz gesamt</tspan></text><rect x="1075" y="330" rx="18" ry="18" width="440" height="170" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/><text x="1295.0" y="378" class="label" text-anchor="middle"><tspan x="1295.0" dy="0">Zusätzliche Haushalte</tspan></text><text x="1295.0" y="428" class="metricRed" text-anchor="middle"><tspan x="1295.0" dy="0">+240'000</tspan></text><text x="1295.0" y="470" class="small" text-anchor="middle"><tspan x="1295.0" dy="0">bis 2030</tspan></text><rect x="85" y="565" rx="18" ry="18" width="985" height="150" fill="#eaf3e2" stroke="#8eb286" stroke-width="1.5"/><text x="115" y="610" class="body" text-anchor="start"><tspan x="115" dy="0">Die Wohnungsfrage ist kein Nebeneffekt des Wachstums.</tspan><tspan x="115" dy="30">Wo Leerstand sinkt, Haushalte zunehmen und der Bau nicht Schritt hält,</tspan><tspan x="115" dy="30">wird Bevölkerungswachstum zuerst als Knappheit sichtbar.</tspan></text><rect x="1105" y="555" rx="18" ry="18" width="410" height="220" fill="#ffffff" stroke="#a61d24" stroke-width="2"/><text x="1135" y="602" class="cardTitle" text-anchor="start"><tspan x="1135" dy="0">Politische Lesart</tspan></text><text x="1135" y="638" class="bodySmall" text-anchor="start"><tspan x="1135" dy="0">Mehr Menschen bedeuten nicht automatisch</tspan><tspan x="1135" dy="28">mehr Wohnungen. In einem knappen Markt</tspan><tspan x="1135" dy="28">steigen zuerst Mieten, Suchdruck und</tspan><tspan x="1135" dy="28">Verteilungskonflikte um den Raum.</tspan></text><text x="85" y="852" class="source" text-anchor="start"><tspan x="85" dy="0">Quellenbasis: BFS Leerwohnungszählung 2024; Homegate/ZKB-Mietindex 2024; Wüest Partner 2024.</tspan></text></svg>