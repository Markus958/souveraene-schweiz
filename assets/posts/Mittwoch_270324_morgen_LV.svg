<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f8fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8ecf1;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="euLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#003399;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#003399;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#003399;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="chLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d42020;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d42020;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#d42020" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#003399"/>
    </marker>
    <clipPath id="chBorder">
      <path d="M520,200 L580,180 L680,185 L750,210 L780,260 L790,320 L770,380 L730,420 L670,440 L600,445 L540,430 L490,400 L470,350 L460,290 L480,240 Z"/>
    </clipPath>
    <pattern id="chPattern" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#fafbfc"/>
      <line x1="0" y1="20" x2="20" y2="0" stroke="#e0e4ea" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.15">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#8090a0" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#8090a0" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#8090a0" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#8090a0" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#8090a0" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="675" stroke="#8090a0" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="675" stroke="#8090a0" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="675" stroke="#8090a0" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="675" stroke="#8090a0" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="675" stroke="#8090a0" stroke-width="0.5"/>
  </g>

  <!-- Title bar -->
  <rect x="0" y="0" width="1200" height="72" fill="#1a2332" opacity="0.95"/>
  <text x="40" y="46" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="0.5">Kabotageprüfung im internationalen Personenverkehr</text>
  <text x="1160" y="46" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#8899aa" text-anchor="end">Schweiz · Eisenbahnrecht</text>

  <!-- Swiss territory shape -->
  <path d="M420,195 L510,170 L620,165 L740,175 L830,205 L870,260 L885,330 L865,400 L820,450 L740,475 L640,485 L550,475 L480,445 L440,395 L420,330 L415,265 Z" fill="#f0f2f5" stroke="#c8ced8" stroke-width="1.5" filter="url(#shadowLight)"/>

  <!-- CH label on territory -->
  <text x="645" y="340" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="60" font-weight="800" fill="#d42020" opacity="0.08" text-anchor="middle">CH</text>

  <!-- Swiss cross watermark -->
  <g transform="translate(630,290)" opacity="0.06">
    <rect x="-15" y="-45" width="30" height="90" fill="#d42020" rx="3"/>
    <rect x="-45" y="-15" width="90" height="30" fill="#d42020" rx="3"/>
  </g>

  <!-- EU territory indication (left side) -->
  <rect x="40" y="195" width="380" height="290" rx="8" fill="#eef1f8" stroke="#a0b0cc" stroke-width="1" stroke-dasharray="6,3" opacity="0.6"/>
  <g transform="translate(80,220)">
    <circle cx="0" cy="0" r="18" fill="#003399" opacity="0.9"/>
    <g transform="translate(0,0)">
      <g fill="#FFD700">
        <polygon points="0,-13 1.5,-10 4.5,-10 2,-8 3,-5 0,-6.5 -3,-5 -2,-8 -4.5,-10 -1.5,-10" transform="scale(0.55)"/>
        <polygon points="0,-13 1.5,-10 4.5,-10 2,-8 3,-5 0,-6.5 -3,-5 -2,-8 -4.5,-10 -1.5,-10" transform="rotate(30) scale(0.55)"/>
        <polygon points="0,-13 1.5,-10 4.5,-10 2,-8 3,-5 0,-6.5 -3,-5 -2,-8 -4.5,-10 -1.5,-10" transform="rotate(60) scale(0.55)"/>
        <polygon points="0,-13 1.5,-10 4.5,-10 2,-8 3,-5 0,-6.5 -3,-5 -2,-8 -4.5,-10 -1.5,-10" transform="rotate(90) scale(0.55)"/>
        <polygon points="0,-13 1.5,-10 4.5,-10 2,-8 3,-5 0,-6.5 -3,-5 -2,-8 -4.5,-10 -1.5,-10" transform="rotate(120) scale(0.55)"/>
        <polygon points="0,-13 1.5,-10 4.5,-10 2,-8 3,-5 0,-6.5 -3,-5 -2,-8 -4.5,-10 -1.5,-10" transform="rotate(150) scale(0.55)"/>
        <polygon points="0,-13 1.5,-10 4.5,-10 2,-8 3,-5 0,-6.5 -3,-5 -2,-8 -4.5,-10 -1.5,-10" transform="rotate(180) scale(0.55)"/>
        <polygon points="0,-13 1.5,-10 4.5,-10 2,-8 3,-5 0,-6.5 -3,-5 -2,-8 -4.5,-10 -1.5,-10" transform="rotate(210) scale(0.55)"/>
        <polygon points="0,-13 1.5,-10 4.5,-10 2,-8 3,-5 0,-6.5 -3,-5 -2,-8 -4.5,-10 -1.5,-10" transform="rotate(240) scale(0.55)"/>
        <polygon points="0,-13 1.5,-10 4.5,-10 2,-8 3,-5 0,-6.5 -3,-5 -2,-8 -4.5,-10 -1.5,-10" transform="rotate(270) scale(0.55)"/>
        <polygon points="0,-13 1.5,-10 4.5,-10 2,-8 3,-5 0,-6.5 -3,-5 -2,-8 -4.5,-10 -1.5,-10" transform="rotate(300) scale(0.55)"/>
        <polygon points="0,-13 1.5,-10 4.5,-10 2,-8 3,-5 0,-6.5 -3,-5 -2,-8 -4.5,-10 -1.5,-10" transform="rotate(330) scale(0.55)"/>
      </g>
    </g>
  </g>
  <text x="105" y="226" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#003399">EU-Raum</text>

  <!-- EU origin stations -->
  <g>
    <!-- München -->
    <circle cx="140" cy="280" r="7" fill="#003399" stroke="#fff" stroke-width="2"/>
    <text x="155" y="285" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" fill="#2a3a5c" font-weight="500">München</text>
    <!-- Stuttgart -->
    <circle cx="180" cy="330" r="7" fill="#003399" stroke="#fff" stroke-width="2"/>
    <text x="195" y="335" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" fill="#2a3a5c" font-weight="500">Stuttgart</text>
    <!-- Milano -->
    <circle cx="200" cy="420" r="7" fill="#003399" stroke="#fff" stroke-width="2"/>
    <text x="215" y="425" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" fill="#2a3a5c" font-weight="500">Milano</text>
  </g>

  <!-- Border crossing zone -->
  <rect x="400" y="180" width="40" height="310" fill="#ffd700" opacity="0.15" rx="4"/>
  <line x1="420" y1="180" x2="420" y2="490" stroke="#bfa800" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="420" y="510" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="11" fill="#8a7a00" text-anchor="middle" font-weight="600">GRENZE</text>

  <!-- International train line from EU into Switzerland (blue, thick, dashed) -->
  <g>
    <!-- München line -->
    <path d="M140,280 Q280,275 420,300 Q480,310 540,305 Q600,298 660,320 Q720,340 780,370 Q830,395 860,420" fill="none" stroke="#003399" stroke-width="4" stroke-dasharray="12,6" opacity="0.85" marker-end="url(#arrowBlue)"/>
    <text x="290" y="265" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="11" fill="#003399" font-weight="600" transform="rotate(-3,290,265)">EC / Internationale Linie</text>

    <!-- Stuttgart line -->
    <path d="M180,330 Q300,325 420,330 Q500,332 560,340" fill="none" stroke="#003399" stroke-width="3.5" stroke-dasharray="12,6" opacity="0.7"/>

    <!-- Milano line -->
    <path d="M200,420 Q310,425 420,400 Q490,380 560,370" fill="none" stroke="#003399" stroke-width="3.5" stroke-dasharray="12,6" opacity="0.7"/>
  </g>

  <!-- Swiss internal rail network (red, solid, organized) -->
  <g>
    <!-- Main horizontal line: Basel–Zürich–St.Gallen -->
    <path d="M460,250 L540,270 L660,280 L780,275 L850,280" fill="none" stroke="#d42020" stroke-width="3" opacity="0.9"/>

    <!-- Bern line -->
    <path d="M540,270 L520,350 L500,390" fill="none" stroke="#d42020" stroke-width="3" opacity="0.9"/>

    <!-- Zürich–Luzern -->
    <path d="M660,280 L630,350 L610,380" fill="none" stroke="#d42020" stroke-width="3" opacity="0.9"/>

    <!-- Zürich–Chur -->
    <path d="M660,280 L730,310 L800,340" fill="none" stroke="#d42020" stroke-width="3" opacity="0.9"/>

    <!-- Bern–Interlaken -->
    <path d="M520,350 L560,400 L570,430" fill="none" stroke="#d42020" stroke-width="2.5" opacity="0.7"/>

    <!-- Luzern–Lugano direction -->
    <path d="M610,380 L640,430 L660,460" fill="none" stroke="#d42020" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- Swiss stations (red dots with labels) -->
  <g>
    <!-- Basel -->
    <circle cx="460" cy="250" r="8" fill="#d42020" stroke="#fff" stroke-width="2.5" filter="url(#glowRed)"/>
    <rect x="432" y="228" width="55" height="18" rx="3" fill="#fff" opacity="0.9"/>
    <text x="460" y="241" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" fill="#d42020" text-anchor="middle" font-weight="700">Basel</text>

    <!-- Bern -->
    <circle cx="520" cy="350" r="8" fill="#d42020" stroke="#fff" stroke-width="2.5" filter="url(#glowRed)"/>
    <rect x="492" y="357" width="55" height="18" rx="3" fill="#fff" opacity="0.9"/>
    <text x="520" y="370" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" fill="#d42020" text-anchor="middle" font-weight="700">Bern</text>

    <!-- Zürich -->
    <circle cx="660" cy="280" r="10" fill="#d42020" stroke="#fff" stroke-width="3" filter="url(#glowRed)"/>
    <rect x="625" y="256" width="70" height="20" rx="3" fill="#fff" opacity="0.9"/>
    <text x="660" y="271" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" fill="#d42020" text-anchor="middle" font-weight="800">Zürich</text>

    <!-- Olten -->
    <circle cx="540" cy="270" r="6" fill="#d42020" stroke="#fff" stroke-width="2"/>
    <text x="540" y="262" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="10" fill="#6a1010" text-anchor="middle" font-weight="600">Olten</text>

    <!-- Luzern -->
    <circle cx="610" cy="380" r="7" fill="#d42020" stroke="#fff" stroke-width="2"/>
    <rect x="578" y="387" width="64" height="17" rx="3" fill="#fff" opacity="0.85"/>
    <text x="610" y="400" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="11" fill="#d42020" text-anchor="middle" font-weight="600">Luzern</text>

    <!-- St. Gallen -->
    <circle cx="800" cy="275" r="6" fill="#d42020" stroke="#fff" stroke-width="2"/>
    <text x="800" y="266" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="10" fill="#6a1010" text-anchor="middle" font-weight="600">St.Gallen</text>

    <!-- Chur -->
    <circle cx="800" cy="340" r="6" fill="#d42020" stroke="#fff" stroke-width="2"/>
    <text x="818" y="344" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="10" fill="#6a1010" font-weight="600">Chur</text>

    <!-- Interlaken -->
    <circle cx="570" cy="430" r="5" fill="#d42020" stroke="#fff" stroke-width="2"/>
    <text x="570" y="448" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="10" fill="#6a1010" text-anchor="middle" font-weight="500">Interlaken</text>
  </g>

  <!-- Stops on international line within CH (highlighted) -->
  <g>
    <!-- Stop marker 1: Basel -->
    <circle cx="460" cy="300" r="5" fill="#ffd700" stroke="#003399" stroke-width="2"/>
    <!-- Stop marker 2: Olten -->
    <circle cx="545" cy="305" r="5" fill="#ffd700" stroke="#003399" stroke-width="2"/>
    <!-- Stop marker 3: Zürich -->
    <circle cx="660" cy="318" r="5" fill="#ffd700" stroke="#003399" stroke-width="2"/>
    <!-- Stop marker 4 -->
    <circle cx="780" cy="370" r="5" fill="#ffd700" stroke="#003399" stroke-width="2"/>
  </g>

  <!-- Magnifying glass / inspection symbol -->
  <g transform="translate(920,140)" filter="url(#shadow)">
    <!-- Glass background -->
    <rect x="-10" y="-10" width="260" height="190" rx="12" fill="#fff" stroke="#c8ced8" stroke-width="1.5"/>

    <!-- Magnifying glass icon -->
    <g transform="translate(40,50)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1a2332" stroke-width="4.5"/>
      <circle cx="0" cy="0" r="28" fill="#f0f4ff" opacity="0.5"/>
      <line x1="22" y1="22" x2="42" y2="42" stroke="#1a2332" stroke-width="5" stroke-linecap="round"/>
      <!-- Question mark inside lens -->
      <text x="0" y="8" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="32" fill="#003399" text-anchor="middle" font-weight="800">?</text>
    </g>

    <!-- Checkmark icon -->
    <g transform="translate(180,45)">
      <circle cx="0" cy="0" r="22" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
      <path d="M-10,0 L-3,8 L12,-8" fill="none" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Text -->
    <text x="120" y="110" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="22" fill="#1a2332" text-anchor="middle" font-weight="800">«Hauptzweck?»</text>

    <text x="120" y="135" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" fill="#5a6a7a" text-anchor="middle">Liegt der Hauptzweck im</text>
    <text x="120" y="152" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" fill="#5a6a7a" text-anchor="middle">grenzüberschreitenden Verkehr?</text>

    <!-- Connecting line to train route -->
    <line x1="-10" y1="170" x2="-60" y2="200" stroke="#8899aa" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="-60,200 -55,193 -65,195" fill="#8899aa"/>
  </g>

  <!-- Arrow pointing from inspection to route -->
  <path d="M910,250 Q880,290 830,370" fill="none" stroke="#8899aa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="830,370 835,360 825,362" fill="#8899aa"/>

  <!-- Kabotage question markers on Swiss stops -->
  <g>
    <g transform="translate(545,285)">
      <rect x="-18" y="-14" width="36" height="18" rx="9" fill="#ff9800" opacity="0.9"/>
      <text x="0" y="0" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">KB?</text>
    </g>
    <g transform="translate(660,298)">
      <rect x="-18" y="-14" width="36" height="18" rx="9" fill="#ff9800" opacity="0.9"/>
      <text x="0" y="0" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">KB?</text>
    </g>
    <g transform="translate(780,350)">
      <rect x="-18" y="-14" width="36" height="18" rx="9" fill="#ff9800" opacity="0.9"/>
      <text x="0" y="0" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">KB?</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(40,540)">
    <rect x="-15" y="-20" width="520" height="115" rx="8" fill="#fff" stroke="#c8ced8" stroke-width="1" filter="url(#shadowLight)"/>

    <text x="0" y="0" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" fill="#1a2332" font-weight="700">Legende</text>

    <!-- EU line -->
    <line x1="0" y1="25" x2="40" y2="25" stroke="#003399" stroke-width="4" stroke-dasharray="10,5"/>
    <text x="50" y="30" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" fill="#2a3a5c">Internationale Zuglinie (EU → CH)</text>

    <!-- CH line -->
    <line x1="0" y1="50" x2="40" y2="50" stroke="#d42020" stroke-width="3"/>
    <text x="50" y="55" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" fill="#2a3a5c">Schweizer Schienennetz (SBB)</text>

    <!-- Stop -->
    <circle cx="20" cy="75" r="5" fill="#ffd700" stroke="#003399" stroke-width="2"/>
    <text x="50" y="80" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" fill="#2a3a5c">Haltepunkt auf internationaler Linie in der Schweiz</text>

    <!-- KB marker -->
    <rect x="5" y="88" width="30" height="14" rx="7" fill="#ff9800"/>
    <text x="20" y="99" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">KB?</text>
    <text x="50" y="100" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" fill="#2a3a5c">Kabotageprüfung: Inlandbeförderung auf internationaler Linie</text>

    <!-- Second column -->
    <g transform="translate(290,15)">
      <circle cx="10" cy="10" r="6" fill="#d42020" stroke="#fff" stroke-width="2"/>
      <text x="25" y="15" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" fill="#2a3a5c">Schweizer Bahnhof</text>

      <circle cx="10" cy="37" r="6" fill="#003399" stroke="#fff" stroke-width="2"/>
      <text x="25" y="42" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" fill="#2a3a5c">EU-Bahnhof</text>
    </g>
  </g>

  <!-- Explanatory text box (right bottom) -->
  <g transform="translate(620,530)">
    <rect x="-10" y="-15" width="555" height="100" rx="8" fill="#1a2332" opacity="0.95" filter="url(#shadow)"/>
    <text x="10" y="8" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" fill="#ffd700" font-weight="700">Art. 7 PBG / Landverkehrsabkommen CH–EU</text>
    <text x="10" y="30" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" fill="#c8d8e8">Internationale Linien dürfen Passagiere innerhalb der Schweiz nur</text>
    <text x="10" y="48" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" fill="#c8d8e8">befördern, wenn der Hauptzweck im grenzüberschreitenden</text>
    <text x="10" y="66" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" fill="#c8d8e8">Verkehr liegt. Andernfalls liegt unzulässige Kabotage vor.</text>
    <rect x="480" y="50" width="48" height="24" rx="4" fill="#d42020"/>
    <text x="480" y="50" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="9" fill="#fff" font-weight="600">
      <tspan x="504" dy="16" text-anchor="middle">BAV</tspan>
    </text>
  </g>

  <!-- Source line -->
  <text x="1170" y="665" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="9" fill="#8899aa" text-anchor="end">Quelle: Personenbeförderungsgesetz (PBG), Landverkehrsabkommen CH–EU | Sachinfografik</text>
</svg>