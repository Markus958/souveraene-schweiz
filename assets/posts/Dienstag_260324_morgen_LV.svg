<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <clipPath id="netClip">
      <rect x="200" y="80" width="800" height="500" rx="20"/>
    </clipPath>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000033"/>
    </filter>
    <linearGradient id="euGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003399" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0055a4" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
    <pattern id="euStars" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <polygon points="10,2 12,8 18,8 13,12 15,18 10,14 5,18 7,12 2,8 8,8" fill="#FFD700" opacity="0.25" transform="scale(0.7)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="0" x2="1200" y2="675" stroke="#000" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="0" y2="675" stroke="#000" stroke-width="0.5"/>
  </g>

  <!-- Serie label top left -->
  <rect x="0" y="0" width="220" height="36" fill="#d42a2a" rx="0"/>
  <text x="16" y="24" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="white" letter-spacing="2">SERIE: LANDVERKEHR</text>

  <!-- EU regulatory frame - outer blue frame reaching over the network -->
  <!-- Right claw -->
  <path d="M1050,120 Q1120,120 1120,200 L1120,480 Q1120,560 1050,560 L980,560 L980,530 L1020,530 Q1060,530 1060,480 L1060,200 Q1060,160 1020,160 L980,160 L980,120 Z" fill="url(#euGrad)" filter="url(#shadow)"/>
  <rect x="980" y="120" width="140" height="440" fill="url(#euStars)" opacity="0.4" rx="10"/>

  <!-- Top claw -->
  <path d="M350,50 L850,50 Q920,50 920,100 L920,140 L880,140 L880,110 Q880,85 850,85 L350,85 Q320,85 320,110 L320,140 L280,140 L280,100 Q280,50 350,50 Z" fill="url(#euGrad)" filter="url(#shadow)"/>

  <!-- Bottom claw -->
  <path d="M350,620 L850,620 Q920,620 920,575 L920,540 L880,540 L880,565 Q880,590 850,590 L350,590 Q320,590 320,565 L320,540 L280,540 L280,575 Q280,620 350,620 Z" fill="url(#euGrad)" filter="url(#shadow)"/>

  <!-- Left claw -->
  <path d="M150,120 Q80,120 80,200 L80,480 Q80,560 150,560 L220,560 L220,530 L180,530 Q140,530 140,480 L140,200 Q140,160 180,160 L220,160 L220,120 Z" fill="url(#euGrad)" filter="url(#shadow)"/>
  <rect x="80" y="120" width="140" height="440" fill="url(#euStars)" opacity="0.4" rx="10"/>

  <!-- EU label top -->
  <rect x="510" y="42" width="180" height="30" fill="#003399" rx="4"/>
  <text x="600" y="63" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1.5">EU-REGELRAHMEN</text>

  <!-- EU label right -->
  <g transform="translate(1100,340) rotate(90)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1.5">EU-REGULIERUNG</text>
  </g>

  <!-- EU label left -->
  <g transform="translate(100,340) rotate(-90)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1.5">EU-REGULIERUNG</text>
  </g>

  <!-- White background for Swiss network area -->
  <rect x="220" y="100" width="760" height="480" fill="white" rx="12" filter="url(#shadow)"/>

  <!-- Swiss cross watermark -->
  <g opacity="0.06" transform="translate(600,340)">
    <rect x="-60" y="-15" width="120" height="30" fill="#d42a2a"/>
    <rect x="-15" y="-60" width="30" height="120" fill="#d42a2a"/>
  </g>

  <!-- Swiss Rail Network - orderly grid pattern in red -->
  <!-- Horizontal main lines -->
  <g stroke="#d42a2a" stroke-width="3.5" stroke-linecap="round" fill="none">
    <!-- Main east-west lines -->
    <line x1="260" y1="220" x2="940" y2="220"/>
    <line x1="260" y1="310" x2="940" y2="310"/>
    <line x1="260" y1="400" x2="940" y2="400"/>
    <line x1="260" y1="490" x2="940" y2="490"/>

    <!-- Main north-south lines -->
    <line x1="340" y1="140" x2="340" y2="540"/>
    <line x1="460" y1="140" x2="460" y2="540"/>
    <line x1="600" y1="140" x2="600" y2="540"/>
    <line x1="740" y1="140" x2="740" y2="540"/>
    <line x1="860" y1="140" x2="860" y2="540"/>
  </g>

  <!-- Secondary/diagonal lines -->
  <g stroke="#d42a2a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6">
    <line x1="340" y1="220" x2="460" y2="310"/>
    <line x1="460" y1="220" x2="600" y2="310"/>
    <line x1="600" y1="310" x2="740" y2="400"/>
    <line x1="740" y1="220" x2="860" y2="310"/>
    <line x1="340" y1="310" x2="460" y2="400"/>
    <line x1="460" y1="400" x2="600" y2="490"/>
    <line x1="600" y1="220" x2="740" y2="310"/>
    <line x1="740" y1="400" x2="860" y2="490"/>
    <line x1="340" y1="400" x2="460" y2="490"/>
  </g>

  <!-- Tertiary thin lines -->
  <g stroke="#d42a2a" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.35">
    <line x1="280" y1="160" x2="340" y2="220"/>
    <line x1="860" y1="220" x2="920" y2="160"/>
    <line x1="280" y1="520" x2="340" y2="490"/>
    <line x1="860" y1="490" x2="920" y2="520"/>
    <line x1="400" y1="140" x2="400" y2="540"/>
    <line x1="530" y1="140" x2="530" y2="540"/>
    <line x1="670" y1="140" x2="670" y2="540"/>
    <line x1="800" y1="140" x2="800" y2="540"/>
    <line x1="260" y1="265" x2="940" y2="265"/>
    <line x1="260" y1="355" x2="940" y2="355"/>
    <line x1="260" y1="445" x2="940" y2="445"/>
  </g>

  <!-- Station nodes - major -->
  <g fill="white" stroke="#d42a2a" stroke-width="2.5">
    <!-- Row 1 -->
    <circle cx="340" cy="220" r="8"/>
    <circle cx="460" cy="220" r="8"/>
    <circle cx="600" cy="220" r="10"/>
    <circle cx="740" cy="220" r="8"/>
    <circle cx="860" cy="220" r="8"/>
    <!-- Row 2 -->
    <circle cx="340" cy="310" r="8"/>
    <circle cx="460" cy="310" r="8"/>
    <circle cx="600" cy="310" r="10"/>
    <circle cx="740" cy="310" r="8"/>
    <circle cx="860" cy="310" r="8"/>
    <!-- Row 3 -->
    <circle cx="340" cy="400" r="8"/>
    <circle cx="460" cy="400" r="8"/>
    <circle cx="600" cy="400" r="10"/>
    <circle cx="740" cy="400" r="8"/>
    <circle cx="860" cy="400" r="8"/>
    <!-- Row 4 -->
    <circle cx="340" cy="490" r="7"/>
    <circle cx="460" cy="490" r="7"/>
    <circle cx="600" cy="490" r="8"/>
    <circle cx="740" cy="490" r="7"/>
    <circle cx="860" cy="490" r="7"/>
  </g>

  <!-- Station nodes - minor -->
  <g fill="#d42a2a" stroke="none">
    <circle cx="400" cy="265" r="3"/>
    <circle cx="530" cy="265" r="3"/>
    <circle cx="670" cy="265" r="3"/>
    <circle cx="800" cy="265" r="3"/>
    <circle cx="400" cy="355" r="3"/>
    <circle cx="530" cy="355" r="3"/>
    <circle cx="670" cy="355" r="3"/>
    <circle cx="800" cy="355" r="3"/>
    <circle cx="400" cy="445" r="3"/>
    <circle cx="530" cy="445" r="3"/>
    <circle cx="670" cy="445" r="3"/>
    <circle cx="800" cy="445" r="3"/>
  </g>

  <!-- City labels on key nodes -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="340" y="208">Genève</text>
    <text x="460" y="208">Lausanne</text>
    <text x="600" y="207">Bern</text>
    <text x="740" y="208">Luzern</text>
    <text x="860" y="208">Zürich</text>
    <text x="340" y="298">Fribourg</text>
    <text x="600" y="298">Thun</text>
    <text x="860" y="298">St.Gallen</text>
    <text x="460" y="418">Sion</text>
    <text x="600" y="418">Brig</text>
    <text x="740" y="418">Bellinzona</text>
    <text x="860" y="418">Chur</text>
    <text x="340" y="508">Martigny</text>
    <text x="600" y="508">Locarno</text>
    <text x="740" y="508">Lugano</text>
  </g>

  <!-- Central Swiss cross on Bern node -->
  <g transform="translate(600,310)">
    <circle cx="0" cy="0" r="10" fill="#d42a2a"/>
    <rect x="-6" y="-1.8" width="12" height="3.6" fill="white" rx="0.5"/>
    <rect x="-1.8" y="-6" width="3.6" height="12" fill="white" rx="0.5"/>
  </g>

  <!-- Arrows indicating EU pressure from all sides -->
  <g fill="#003399" opacity="0.7">
    <!-- Right arrows -->
    <polygon points="970,250 955,240 955,260"/>
    <polygon points="970,340 955,330 955,350"/>
    <polygon points="970,430 955,420 955,440"/>

    <!-- Left arrows -->
    <polygon points="230,250 245,240 245,260"/>
    <polygon points="230,340 245,330 245,350"/>
    <polygon points="230,430 245,420 245,440"/>

    <!-- Top arrows -->
    <polygon points="450,95 440,110 460,110"/>
    <polygon points="600,95 590,110 610,110"/>
    <polygon points="750,95 740,110 760,110"/>

    <!-- Bottom arrows -->
    <polygon points="450,585 440,570 460,570"/>
    <polygon points="600,585 590,570 610,570"/>
    <polygon points="750,585 740,570 760,570"/>
  </g>

  <!-- Main message text area - bottom -->
  <rect x="250" y="602" width="700" height="56" fill="#1a1a1a" rx="6" filter="url(#shadow)"/>
  <text x="600" y="626" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="0.5">Landverkehr ist nicht nur Verkehr –</text>
  <text x="600" y="648" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ff6b6b" text-anchor="middle" letter-spacing="0.5">sondern Regelmacht im Service public.</text>

  <!-- Legend -->
  <g transform="translate(250,130)">
    <rect x="-10" y="-14" width="175" height="52" fill="white" rx="5" stroke="#ddd" stroke-width="1" opacity="0.95"/>
    <line x1="0" y1="0" x2="28" y2="0" stroke="#d42a2a" stroke-width="3.5"/>
    <circle cx="14" cy="0" r="4" fill="white" stroke="#d42a2a" stroke-width="2"/>
    <text x="36" y="4" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Schweizer Bahnnetz</text>
    <rect x="0" y="16" width="28" height="10" fill="url(#euGrad)" rx="2"/>
    <text x="36" y="26" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">EU-Regelrahmen</text>
  </g>

  <!-- Source line -->
  <text x="1185" y="668" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#999" text-anchor="end">Sachgrafik · Landverkehrsabkommen CH–EU</text>
</svg>