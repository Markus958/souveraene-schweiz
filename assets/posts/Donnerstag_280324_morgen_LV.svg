<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f8f8"/>
      <stop offset="100%" stop-color="#eaeaea"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2001a"/>
      <stop offset="100%" stop-color="#b80015"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e2001a"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2a5fa5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#e2001a"/>

  <!-- Title area -->
  <rect x="40" y="24" width="8" height="40" rx="2" fill="#e2001a"/>
  <text x="60" y="52" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a">Schweizer Taktknoten: Das Rückgrat des Bahnsystems</text>
  <text x="60" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#666">Wie der Taktfahrplan Anschlüsse sichert — und internationale Züge auf Restkapazität beschränkt</text>

  <!-- LEFT SECTION: Taktknoten diagram -->
  <!-- Central clock / hub -->
  <g transform="translate(320, 340)">
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#e2001a" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

    <!-- Main clock circle -->
    <circle cx="0" cy="0" r="58" fill="white" stroke="#e2001a" stroke-width="4" filter="url(#shadow)"/>

    <!-- Clock face markers -->
    <g stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-48" x2="0" y2="-40"/>
      <line x1="0" y1="48" x2="0" y2="40"/>
      <line x1="-48" y1="0" x2="-40" y2="0"/>
      <line x1="48" y1="0" x2="40" y2="0"/>
    </g>
    <g stroke="#999" stroke-width="1.2" stroke-linecap="round">
      <line x1="24" y1="-41.5" x2="20" y2="-34.6"/>
      <line x1="41.5" y1="-24" x2="34.6" y2="-20"/>
      <line x1="41.5" y1="24" x2="34.6" y2="20"/>
      <line x1="24" y1="41.5" x2="20" y2="34.6"/>
      <line x1="-24" y1="41.5" x2="-20" y2="34.6"/>
      <line x1="-41.5" y1="24" x2="-34.6" y2="20"/>
      <line x1="-41.5" y1="-24" x2="-34.6" y2="-20"/>
      <line x1="-24" y1="-41.5" x2="-20" y2="-34.6"/>
    </g>

    <!-- Clock hands pointing to :00 (minute at 12, hour at 12) symbolizing synchronization -->
    <line x1="0" y1="4" x2="0" y2="-32" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="4" x2="18" y2="-18" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- SBB-style red second hand dot -->
    <circle cx="0" cy="-38" r="4" fill="#e2001a"/>
    <line x1="0" y1="6" x2="0" y2="-34" stroke="#e2001a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="3" fill="#1a1a1a"/>

    <!-- Label -->
    <text x="0" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#e2001a">TAKTKNOTEN</text>
    <text x="0" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Symmetriezeit :00/:30</text>
  </g>

  <!-- Incoming/Outgoing train lines (S-Bahn / IR / RE style) -->
  <!-- Line 1: Top-left -->
  <line x1="120" y1="180" x2="255" y2="310" stroke="#e2001a" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <rect x="60" y="158" width="80" height="30" rx="4" fill="#e2001a" filter="url(#shadow)"/>
  <text x="100" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="white">IR 17</text>

  <!-- Line 2: Top -->
  <line x1="320" y1="160" x2="320" y2="268" stroke="#e2001a" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <rect x="282" y="128" width="76" height="30" rx="4" fill="#e2001a" filter="url(#shadow)"/>
  <text x="320" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="white">IC 1</text>

  <!-- Line 3: Top-right -->
  <line x1="520" y1="190" x2="388" y2="312" stroke="#e2001a" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <rect x="488" y="162" width="76" height="30" rx="4" fill="#e2001a" filter="url(#shadow)"/>
  <text x="526" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="white">RE 3</text>

  <!-- Line 4: Bottom-left (outgoing) -->
  <line x1="255" y1="370" x2="120" y2="490" stroke="#e2001a" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <rect x="58" y="492" width="80" height="30" rx="4" fill="#e2001a" filter="url(#shadow)"/>
  <text x="98" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="white">S 12</text>

  <!-- Line 5: Bottom -->
  <line x1="320" y1="412" x2="320" y2="510" stroke="#e2001a" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <rect x="282" y="514" width="76" height="30" rx="4" fill="#e2001a" filter="url(#shadow)"/>
  <text x="320" y="534" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="white">IC 5</text>

  <!-- Line 6: Bottom-right (outgoing) -->
  <line x1="388" y1="368" x2="510" y2="480" stroke="#e2001a" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <rect x="484" y="480" width="76" height="30" rx="4" fill="#e2001a" filter="url(#shadow)"/>
  <text x="522" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="white">IR 36</text>

  <!-- Anschluss-Pfeile (connection indicators) -->
  <g opacity="0.5">
    <path d="M160,200 Q200,280 260,320" fill="none" stroke="#c0c0c0" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="M500,210 Q440,280 380,320" fill="none" stroke="#c0c0c0" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Divider line -->
  <line x1="630" y1="100" x2="630" y2="590" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- RIGHT SECTION: International line on residual capacity -->
  <g transform="translate(910, 300)">
    <!-- Track representation -->
    <rect x="-230" y="-8" width="460" height="16" rx="3" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>

    <!-- Capacity blocks - Swiss domestic (filled, red) -->
    <rect x="-225" y="-5" width="52" height="10" rx="2" fill="#e2001a" opacity="0.9"/>
    <rect x="-168" y="-5" width="52" height="10" rx="2" fill="#e2001a" opacity="0.9"/>
    <rect x="-111" y="-5" width="52" height="10" rx="2" fill="#e2001a" opacity="0.9"/>
    <rect x="-54" y="-5" width="52" height="10" rx="2" fill="#e2001a" opacity="0.9"/>
    <rect x="3" y="-5" width="52" height="10" rx="2" fill="#e2001a" opacity="0.9"/>
    <rect x="60" y="-5" width="52" height="10" rx="2" fill="#e2001a" opacity="0.9"/>
    <rect x="117" y="-5" width="52" height="10" rx="2" fill="#e2001a" opacity="0.9"/>

    <!-- Residual capacity block (blue, international) -->
    <rect x="174" y="-5" width="52" height="10" rx="2" fill="#2a5fa5" opacity="0.85"/>

    <!-- Labels -->
    <text x="-30" y="-22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#e2001a">Schweizer Taktverkehr (Priorität)</text>
    <text x="200" y="-22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2a5fa5">Rest-</text>
    <text x="200" y="-10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2a5fa5">kapazität</text>

    <!-- Capacity bar label -->
    <text x="0" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#888">Trassenkapazität auf dem Schweizer Netz</text>
  </g>

  <!-- International train illustration -->
  <g transform="translate(910, 180)">
    <!-- Train body -->
    <rect x="-60" y="-18" width="120" height="36" rx="8" fill="#2a5fa5" filter="url(#shadow)"/>
    <rect x="-48" y="-12" width="20" height="14" rx="2" fill="#6fa8dc" opacity="0.6"/>
    <rect x="-22" y="-12" width="20" height="14" rx="2" fill="#6fa8dc" opacity="0.6"/>
    <rect x="4" y="-12" width="20" height="14" rx="2" fill="#6fa8dc" opacity="0.6"/>
    <rect x="30" y="-12" width="20" height="14" rx="2" fill="#6fa8dc" opacity="0.6"/>
    <!-- Wheels -->
    <circle cx="-35" cy="20" r="5" fill="#444"/>
    <circle cx="-15" cy="20" r="5" fill="#444"/>
    <circle cx="15" cy="20" r="5" fill="#444"/>
    <circle cx="35" cy="20" r="5" fill="#444"/>
    <!-- Rail -->
    <line x1="-75" y1="25" x2="75" y2="25" stroke="#888" stroke-width="2"/>
    <text x="0" y="-26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2a5fa5">Internationaler Zug</text>
    <text x="0" y="-40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#888">(z.B. TGV Lyria, Nightjet, EC)</text>
  </g>

  <!-- Arrow from international train to residual capacity -->
  <path d="M910,220 L910,260 Q910,270 920,275 L1070,275" fill="none" stroke="#2a5fa5" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>
  <text x="980" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#2a5fa5">Zugang nur</text>
  <text x="980" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#2a5fa5">bei Restkapazität</text>

  <!-- Swiss domestic train illustration -->
  <g transform="translate(760, 400)">
    <rect x="-50" y="-15" width="100" height="30" rx="6" fill="#e2001a" filter="url(#shadow)"/>
    <rect x="-38" y="-10" width="16" height="12" rx="2" fill="#ff8080" opacity="0.5"/>
    <rect x="-18" y="-10" width="16" height="12" rx="2" fill="#ff8080" opacity="0.5"/>
    <rect x="2" y="-10" width="16" height="12" rx="2" fill="#ff8080" opacity="0.5"/>
    <rect x="22" y="-10" width="16" height="12" rx="2" fill="#ff8080" opacity="0.5"/>
    <circle cx="-28" cy="17" r="4" fill="#444"/>
    <circle cx="-10" cy="17" r="4" fill="#444"/>
    <circle cx="10" cy="17" r="4" fill="#444"/>
    <circle cx="28" cy="17" r="4" fill="#444"/>
    <line x1="-60" y1="21" x2="60" y2="21" stroke="#888" stroke-width="2"/>
    <text x="0" y="-24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#e2001a">Schweizer IC/IR</text>
  </g>

  <!-- Arrow from domestic to capacity bar -->
  <path d="M760,430 L760,460 Q760,470 770,472 L780,472" fill="none" stroke="#e2001a" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Key insight boxes -->
  <g transform="translate(680, 460)">
    <rect x="0" y="0" width="480" height="100" rx="8" fill="white" stroke="#e2001a" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#e2001a"/>

    <!-- Key icon -->
    <text x="28" y="30" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#e2001a">KERNPRINZIP</text>

    <text x="28" y="52" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">① Alle Züge treffen sich im Knoten zur Minute :00 oder :30</text>
    <text x="28" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">② Umsteigeverbindungen sind in alle Richtungen garantiert</text>
    <text x="28" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">③ Internationale Züge dürfen den Taktfahrplan nicht stören</text>
  </g>

  <!-- Taktknoten explanation labels on left -->
  <g transform="translate(70, 570)">
    <rect x="0" y="0" width="500" height="52" rx="6" fill="white" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
    <circle cx="20" cy="26" r="8" fill="#e2001a"/>
    <text x="20" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="white">!</text>
    <text x="38" y="22" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#333">Taktknoten = Knotenpunkt, an dem sich Linien zur festen Taktzeit treffen</text>
    <text x="38" y="40" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#888">z.B. Bern, Zürich HB, Olten, Biel — alle 30 oder 60 Minuten synchronisiert</text>
  </g>

  <!-- Legend -->
  <g transform="translate(680, 120)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#444">LEGENDE</text>
    <rect x="0" y="12" width="24" height="10" rx="2" fill="#e2001a"/>
    <text x="32" y="22" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Schweizer Taktverkehr</text>
    <rect x="180" y="12" width="24" height="10" rx="2" fill="#2a5fa5"/>
    <text x="212" y="22" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Internationaler Verkehr</text>
    <line x1="370" y1="17" x2="400" y2="17" stroke="#888" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="408" y="22" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Restkapazität</text>
  </g>

  <!-- Swiss cross watermark -->
  <g transform="translate(1140, 640)" opacity="0.12">
    <rect x="-18" y="-6" width="36" height="12" rx="1" fill="#e2001a"/>
    <rect x="-6" y="-18" width="12" height="36" rx="1" fill="#e2001a"/>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="669" width="1200" height="6" fill="#e2001a"/>

  <!-- Source -->
  <text x="1160" y="660" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#bbb">Sachinfografik · Taktfahrplan CH · Konzept SBB/BAV</text>
</svg>