<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>
.title { font-family: Georgia, 'Times New Roman', serif; font-size: 46px; font-weight: 700; fill: #1f1f1f; }
.subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #666666; }
.body { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #1f1f1f; }
.bodySmall { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #1f1f1f; }
.small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #666666; }
.metric { font-family: Arial, Helvetica, sans-serif; font-size: 54px; font-weight: 700; fill: #1f1f1f; }
.metricRed { font-family: Arial, Helvetica, sans-serif; font-size: 54px; font-weight: 700; fill: #a61d24; }
.label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #1f1f1f; }
.cardTitle { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #1f1f1f; }
.source { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #666666; }
.caption { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #666666; }
</style>
<rect width="1600" height="900" fill="#ffffff"/><rect x="0" y="0" width="1600" height="26" fill="#a61d24"/><rect x="85" y="92" width="100" height="10" fill="#8eb286"/><text x="85" y="160" class="small" text-anchor="start"><tspan x="85" dy="0">10 Mio Schweiz</tspan></text><text x="85" y="225" class="title" text-anchor="start"><tspan x="85" dy="0">Mehr Haushalte brauchen mehr Raum</tspan></text><text x="85" y="275" class="subtitle" text-anchor="start"><tspan x="85" dy="0">Die Lücke wächst nicht nur wegen mehr Menschen, sondern auch wegen kleinerer Haushalte.</tspan></text><line x1="240" y1="515" x2="1360" y2="515" stroke="#a61d24" stroke-width="8" stroke-linecap="round"/><circle cx="240" cy="515" r="22" fill="#ffffff" stroke="#a61d24" stroke-width="10"/><line x1="240" y1="493" x2="240" y2="400" stroke="#d9d9d9" stroke-width="3"/><rect x="90.0" y="300" rx="18" ry="18" width="300" height="130" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/><text x="240" y="342" class="label" text-anchor="middle"><tspan x="240" dy="0">2030</tspan></text><text x="240" y="390" class="metricRed" text-anchor="middle"><tspan x="240" dy="0">+240'000</tspan></text><text x="240" y="422" class="small" text-anchor="middle"><tspan x="240" dy="0">zusätzliche Haushalte</tspan></text><circle cx="800" cy="515" r="22" fill="#ffffff" stroke="#a61d24" stroke-width="10"/><line x1="800" y1="493" x2="800" y2="400" stroke="#d9d9d9" stroke-width="3"/><rect x="650.0" y="300" rx="18" ry="18" width="300" height="130" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/><text x="800" y="342" class="label" text-anchor="middle"><tspan x="800" dy="0">2050</tspan></text><text x="800" y="390" class="metricRed" text-anchor="middle"><tspan x="800" dy="0">+750'000</tspan></text><text x="800" y="422" class="small" text-anchor="middle"><tspan x="800" dy="0">zusätzliche Haushalte</tspan></text><circle cx="1360" cy="515" r="22" fill="#ffffff" stroke="#a61d24" stroke-width="10"/><line x1="1360" y1="493" x2="1360" y2="400" stroke="#d9d9d9" stroke-width="3"/><rect x="1190.0" y="300" rx="18" ry="18" width="340" height="130" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/><text x="1360" y="342" class="label" text-anchor="middle"><tspan x="1360" dy="0">1985–2009</tspan></text><text x="1360" y="390" class="metric" text-anchor="middle"><tspan x="1360" dy="0">+54'000 ha</tspan></text><text x="1360" y="422" class="small" text-anchor="middle"><tspan x="1360" dy="0">versiegeltes Landwirtschaftsland</tspan></text><rect x="85" y="620" rx="18" ry="18" width="700" height="165" fill="#eaf3e2" stroke="#8eb286" stroke-width="1.5"/><text x="115" y="665" class="body" text-anchor="start"><tspan x="115" dy="0">Pfad 1: Verdichtung nach innen</tspan><tspan x="115" dy="28">mehr Wohnungen auf gleicher Fläche,</tspan><tspan x="115" dy="28">aber mehr Höhe, mehr Konflikte,</tspan><tspan x="115" dy="28">mehr Druck auf Quartiere und Ortsbilder.</tspan></text><rect x="815" y="620" rx="18" ry="18" width="700" height="165" fill="#fff6e8" stroke="#d8b36a" stroke-width="1.5"/><text x="845" y="665" class="body" text-anchor="start"><tspan x="845" dy="0">Pfad 2: Fläche nach aussen</tspan><tspan x="845" dy="28">mehr Bauland und mehr Erschliessung,</tspan><tspan x="845" dy="28">aber mehr Kulturlandverlust,</tspan><tspan x="845" dy="28">mehr Zersiedelung und höhere Infrastrukturkosten.</tspan></text><text x="85" y="852" class="source" text-anchor="start"><tspan x="85" dy="0">Quellenbasis: Wüest Partner 2024 (Haushalte bis 2030/2050); sanu/ARE/BFS zur Bodennutzung.</tspan></text></svg>