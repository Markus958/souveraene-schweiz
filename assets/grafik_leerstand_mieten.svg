<rect width="1600" height="900" fill="#ffffff"/><rect x="0" y="0" width="1600" height="26" fill="#a61d24"/><rect x="85" y="92" width="100" height="10" fill="#8eb286"/><text x="85" y="160" class="small" text-anchor="start"><tspan x="85" dy="0">10 Mio Schweiz</tspan></text><text x="85" y="225" class="title" text-anchor="start"><tspan x="85" dy="0">Mehr Nachfrage, weniger Puffer</tspan></text><text x="85" y="275" class="subtitle" text-anchor="start"><tspan x="85" dy="0">Die Reserve am Wohnungsmarkt ist seit dem Höchststand 2020 deutlich geschrumpft.</tspan></text><line x1="180" y1="500" x2="1420" y2="500" stroke="#d9d9d9" stroke-width="10" stroke-linecap="round"/><circle cx="527.2" cy="500" r="23" fill="#ffffff" stroke="#a61d24" stroke-width="10"/><line x1="527.2" y1="480" x2="527.2" y2="385" stroke="#d9d9d9" stroke-width="3"/><circle cx="762.8" cy="500" r="23" fill="#ffffff" stroke="#8eb286" stroke-width="8"/><line x1="762.8" y1="480" x2="762.8" y2="385" stroke="#d9d9d9" stroke-width="3"/><circle cx="1320.8" cy="500" r="23" fill="#ffffff" stroke="#1f1f1f" stroke-width="10"/><line x1="1320.8" y1="480" x2="1320.8" y2="385" stroke="#d9d9d9" stroke-width="3"/><rect x="1180.8" y="285" rx="18" ry="18" width="280" height="132" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/><text x="1320.8" y="327" class="label" text-anchor="middle"><tspan x="1320.8" dy="0">Höchststand 2020</tspan></text><text x="1320.8" y="373" class="metric" text-anchor="middle"><tspan x="1320.8" dy="0">1,72 %</tspan></text><text x="1320.8" y="405" class="small" text-anchor="middle"><tspan x="1320.8" dy="0">spürbar mehr Reserve</tspan></text><rect x="612.8" y="285" rx="18" ry="18" width="300" height="132" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/><text x="762.8" y="327" class="label" text-anchor="middle"><tspan x="762.8" dy="0">Marktgleichgewicht</tspan></text><text x="762.8" y="373" class="metric" text-anchor="middle"><tspan x="762.8" dy="0">1,27 %</tspan></text><text x="762.8" y="405" class="small" text-anchor="middle"><tspan x="762.8" dy="0">Wüest-Partner-Richtwert</tspan></text><rect x="387.20000000000005" y="285" rx="18" ry="18" width="280" height="132" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/><text x="527.2" y="327" class="label" text-anchor="middle"><tspan x="527.2" dy="0">Stand 2024</tspan></text><text x="527.2" y="373" class="metricRed" text-anchor="middle"><tspan x="527.2" dy="0">1,08 %</tspan></text><text x="527.2" y="405" class="small" text-anchor="middle"><tspan x="527.2" dy="0">klar darunter</tspan></text><rect x="85" y="600" rx="18" ry="18" width="980" height="150" fill="#fff6e8" stroke="#d8b36a" stroke-width="1.5"/><text x="115" y="645" class="body" text-anchor="start"><tspan x="115" dy="0">Sinkt die Leerstandsquote unter das Gleichgewichtsniveau,</tspan><tspan x="115" dy="30">nimmt der Druck auf Angebotsmieten und Wohnungssuche zu.</tspan><tspan x="115" dy="30">Für Zuziehende und Umziehende wird Knappheit direkt spürbar.</tspan></text><rect x="1110" y="595" rx="18" ry="18" width="405" height="165" fill="#ffffff" stroke="#a61d24" stroke-width="2"/><text x="1138" y="642" class="cardTitle" text-anchor="start"><tspan x="1138" dy="0">Zusätzlicher Druck</tspan></text><text x="1138" y="678" class="bodySmall" text-anchor="start"><tspan x="1138" dy="0">+3,2 % Angebotsmieten 2024</tspan><tspan x="1138" dy="28">schweizweit laut Homegate/ZKB.</tspan></text><text x="85" y="852" class="source" text-anchor="start"><tspan x="85" dy="0">Quellenbasis: BFS Leerwohnungszählung 2024; Wüest Partner (Gleichgewichtsniveau); Homegate/ZKB-Mietindex 2024.</tspan></text></svg>