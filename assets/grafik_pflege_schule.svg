<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<defs>
<style>
.bg { fill:#f7f7f5; }
.title { font-family: Georgia, 'Times New Roman', serif; font-size: 58px; font-weight:700; fill:#1f1f1f; }
.subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 27px; fill:#4c4c4c; }
.eyebrow { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; fill:#6d6d6d; }
.card { fill:#ffffff; stroke:#d9ddd8; stroke-width:2.5; rx:26; }
.cardhead { fill:#eef5ef; stroke:#bfd1c3; stroke-width:1.5; rx:18; }
.label { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight:700; fill:#2f5e43; }
.big { font-family: Arial, Helvetica, sans-serif; font-size: 48px; font-weight:700; fill:#1f1f1f; }
.body { font-family: Arial, Helvetica, sans-serif; font-size: 25px; fill:#333333; }
.note { font-family: Arial, Helvetica, sans-serif; font-size: 21px; fill:#666666; }
.mini { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill:#333333; }
.linebg { fill:#e9ece8; rx:18; }
.linefill { fill:#9db6a3; rx:18; }
.alert { fill:#f6efe2; stroke:#dfcaa2; stroke-width:1.5; rx:18; }
</style>
</defs>
<rect class="bg" x="0" y="0" width="1400" height="980"/>
<text x="90" y="90" class="eyebrow">Schule &amp; Pflege</text>
<text x="90" y="165" class="title">Infrastruktur ist auch Personal</text>
<text x="90" y="215" class="subtitle">Wachstum kann nur getragen werden, wenn genug Fachkräfte vorhanden sind – genau dort entstehen bereits heute Lücken</text>

<rect x="90" y="290" width="760" height="560" class="card"/>
<rect x="120" y="320" width="230" height="46" class="cardhead"/>
<text x="148" y="351" class="label">Pflege bis 2030</text>
<text x="125" y="430" class="big">43'000</text>
<text x="125" y="468" class="body">benötigte Pflegefachkräfte</text>
<rect x="125" y="520" width="520" height="34" class="linebg"/>
<rect x="125" y="520" width="520" height="34" class="linefill"/>
<text x="670" y="545" class="mini">Bedarf</text>

<text x="125" y="635" class="big">29'000</text>
<text x="125" y="673" class="body">erwartete Abschlüsse</text>
<rect x="125" y="725" width="520" height="34" class="linebg"/>
<rect x="125" y="725" width="350" height="34" class="linefill"/>
<text x="500" y="750" class="mini">Angebot</text>

<text x="125" y="810" class="note">Ergebnis: strukturelle Lücke von rund 14'500 Pflegefachkräften.</text>

<rect x="900" y="290" width="410" height="560" class="card"/>
<rect x="930" y="320" width="170" height="46" class="cardhead"/>
<text x="958" y="351" class="label">Schule</text>
<text x="930" y="430" class="big">ZH 2024/25</text>
<text x="930" y="472" class="body">Ausnahmeregelung</text>
<text x="930" y="514" class="body">auf allen Stufen der</text>
<text x="930" y="556" class="body">Volksschule</text>

<rect x="930" y="620" width="350" height="145" class="alert"/>
<text x="955" y="662" class="mini">Die Botschaft dahinter:</text>
<text x="955" y="705" class="mini">Nicht nur Bauten fehlen,</text>
<text x="955" y="738" class="mini">sondern bereits heute auch</text>
<text x="955" y="771" class="mini">qualifizierte Fachkräfte.</text>

<text x="930" y="820" class="note">Wachstum erhöht damit den Druck gleichzeitig auf Räume und Personal.</text>
</svg>