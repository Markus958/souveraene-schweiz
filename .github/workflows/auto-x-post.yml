name: X-Post automatisch aktualisieren

# Zeiten in UTC → Schweiz (CEST = UTC+2)
on:
  schedule:
    - cron: '17 5-9 * * *'    # 07:17–11:17 CH (stündlich)
    - cron: '17 12-14 * * *'  # 14:17–16:17 CH (stündlich)
    - cron: '17 16-19 * * *'  # 18:17–21:17 CH (stündlich)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Token diagnostizieren
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python3 << 'EOF'
          import os
          t = os.environ.get('X_BEARER_TOKEN', '')
          print('Token-Länge:', len(t))
          print('Token beginnt mit:', t[:20] + '...' if len(t) > 20 else t)
          bad = [hex(ord(c)) for c in t if ord(c) < 32 or ord(c) > 126]
          print('Ungültige Zeichen:', bad if bad else 'keine')
          EOF

      - name: Neuesten Post via X API v2 abrufen
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USER_ID:      ${{ vars.X_USER_ID }}
        run: python3 .github/scripts/fetch_x_post_api.py
        continue-on-error: true   # Zeigt Fehler an, ohne Workflow sofort zu stoppen

      - name: Commit und Push (nur bei Änderung)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet data/latest-post.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderung am Post."
          else
            git add data/latest-post.json
            git commit -m "Auto: neuester Post @mllw58 aktualisiert"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Änderung erkannt und committed."
          fi

      - name: Deploy-Workflow antriggern
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
