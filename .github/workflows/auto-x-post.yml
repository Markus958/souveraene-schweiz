name: X-Post automatisch aktualisieren

# Zeiten in UTC (Schweiz = UTC+2 im Sommer / UTC+1 im Winter)
# Zielzeiten CH: 08:00, 09:00, 14:00, 20:00
on:
  schedule:
    - cron: '0 6 * * *'   # 08:00 CEST
    - cron: '0 7 * * *'   # 09:00 CEST
    - cron: '0 12 * * *'  # 14:00 CEST
    - cron: '0 18 * * *'  # 20:00 CEST
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Neuesten Post via X API abrufen
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python3 .github/scripts/fetch_x_post_api.py

      - name: Commit und Push (nur bei Änderung)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderung."
          else
            git add data/latest-post.json
            git commit -m "Auto: neuester Post @mllw58 aktualisiert"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy-Workflow antriggern
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
