name: Tägliche Wartungsprüfung

on:
  schedule:
    - cron: '30 3 * * *'  # 03:30 UTC täglich (05:30 CEST)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Integrität prüfen
        run: python scripts/check_integrity.py
