name: GoatCounter Stats aktualisieren

on:
  schedule:
    - cron: '0 5-18 * * *'  # stündlich 07:00–20:00 Uhr CH-Zeit (UTC+2)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Stats abrufen
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python .github/scripts/fetch_stats.py

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.json
          git diff --cached --quiet || git commit -m "stats: GoatCounter Daten aktualisiert"
          git pull --rebase
          git push
