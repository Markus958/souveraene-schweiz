name: GoatCounter Stats aktualisieren

on:
  schedule:
    - cron: '21 5-18 * * *'  # stündlich xx:21, 07:21–20:21 Uhr CH-Zeit (UTC+2)
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Stats abrufen
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python .github/scripts/fetch_stats.py

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.json assets/stats-times assets/km-log.csv assets/km-countries.csv
          git diff --cached --quiet || git commit -m "stats: GoatCounter Daten aktualisiert"
          git pull --rebase -X ours
          git push

      - name: Deploy auslösen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml
