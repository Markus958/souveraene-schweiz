name: Test news monitor

on:
  pull_request:
    paths:
      - '.github/scripts/monitor/**'
      - '.github/workflows/test-gmail-newsletter.yml'
      - '.github/workflows/monitor-*.yml'
      - 'monitor/nzz-status.js'
      - 'monitor/monitor.js'
      - 'monitor/accordion.js'
      - 'monitor/test-current-news-visibility.js'
      - 'monitor/review.js'
      - 'monitor/review.css'
      - 'monitor/pruefmodus.html'
      - 'monitor/index.html'
      - 'docs/NEWS_MONITOR_EDITORIAL_AI.md'
      - 'data/monitor/config/sources.json'
      - 'requirements-gmail.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full monitor test suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run full monitor test suite
        run: python -m unittest discover -s .github/scripts/monitor/tests -v

      - name: Validate source configuration
        run: python -m json.tool data/monitor/config/sources.json >/dev/null

      - name: Compile monitor modules
        run: python -m compileall -q .github/scripts/monitor

      - name: Check monitor JavaScript syntax
        run: |
          node --check monitor/nzz-status.js
          node --check monitor/monitor.js
          node --check monitor/accordion.js
          node --check monitor/test-current-news-visibility.js
          node --check monitor/review.js
