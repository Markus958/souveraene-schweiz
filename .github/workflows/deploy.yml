name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (full history for git log dates)
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Inject last-modified dates
        run: node .github/scripts/inject_dates.js

      - name: Inject stats password hash
        env:
          PW_FUER_STATISTIK_SEITE: ${{ secrets.PW_FUER_STATISTIK_SEITE }}
        run: |
          python3 -c "
          import os, hashlib
          pw = os.environ['PW_FUER_STATISTIK_SEITE']
          h = hashlib.sha256(pw.encode()).hexdigest()
          with open('statistik.html', 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace('__STATS_PW_HASH__', h)
          with open('statistik.html', 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Password hash injected: {h[:8]}...')
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
