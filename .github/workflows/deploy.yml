name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # E-paper commits only update internal/early-warning state. They are followed by
    # the Daily Run in a Full Run and do not need their own public Pages deployment.
    if: ${{ github.event_name != 'push' || github.event.head_commit.message != 'monitor: update e-paper early-warning state' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main (full history for git log dates)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inject last-modified dates
        run: node .github/scripts/inject_dates.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: GoatCounter Stats abrufen
        continue-on-error: true
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: pip install -q requests && python .github/scripts/fetch_stats.py

      # Erzeugt faktencheck-NN.html je Faktencheck aus faktenchecks.html
      # und traegt fehlende Adressen in die sitemap.xml nach.
      - name: Faktencheck-Einzelseiten generieren
        run: python .github/scripts/build_faktencheck_seiten.py

      - name: Glossar-Querverweise generieren
        run: python .github/scripts/build_glossar_crossref.py

      - name: Suchindex generieren
        run: python .github/scripts/build_search_index.py

      - name: Inject stats password hash
        env:
          PW_FUER_STATISTIK_SEITE: ${{ secrets.PW_FUER_STATISTIK_SEITE }}
        run: |
          python3 -c "
          import os, hashlib
          pw = os.environ['PW_FUER_STATISTIK_SEITE']
          h = hashlib.sha256(pw.encode()).hexdigest()
          with open('statistik.html', 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace('__STATS_PW_HASH__', h)
          with open('statistik.html', 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Password hash injected: {h[:8]}...')
          "

      - name: Build public Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'monitor-out/' \
            --exclude 'node_modules/' \
            --exclude 'data/monitor/state/' \
            --exclude 'data/monitor/config/' \
            --exclude 'data/monitor/reports/epaper/' \
            --exclude 'TECHNIK.md' \
            --exclude 'CLAUDE.md' \
            --exclude 'package.json' \
            --exclude 'package-lock.json'

          echo 'Public monitor files:'
          find _site/data/monitor -maxdepth 3 -type f -print 2>/dev/null || true

          if find _site -path '*/data/monitor/state/*' -o -path '*/data/monitor/config/*' | grep -q .; then
            echo 'ERROR: internal monitor state/config leaked into Pages artifact'
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
