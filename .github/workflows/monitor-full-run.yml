name: Monitor - Full Run

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'E-Paper-Ausgabe: auto, NZZ oder NZZ am Sonntag'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - nzz
          - nzzas

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor-full-run
  cancel-in-progress: true

jobs:
  epaper:
    name: 1 – E-Paper
    uses: ./.github/workflows/monitor-epaper-evening.yml
    with:
      edition: ${{ inputs.edition || 'auto' }}
      dispatch_daily: false
    secrets: inherit

  daily:
    name: 2 – Daily Run
    needs: epaper
    if: ${{ always() }}
    uses: ./.github/workflows/monitor-news.yml
    secrets: inherit
