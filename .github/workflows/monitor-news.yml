name: Monitor - Daily Run

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '30 7 * * *'
      timezone: 'Europe/Zurich'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Shared with the evening workflow: budget reads, API calls and ledger/cache
  # persistence must never overlap across morning/evening runs.
  group: monitor-editorial-ai
  cancel-in-progress: false

jobs:
  monitor-daily-run:
    runs-on: ubuntu-24.04
    outputs:
      # Do not expose the raw 'true' value as a job output: it can equal the
      # opt-in secret GMAIL_SOURCE_ENABLED and GitHub then suppresses it.
      should_run: ${{ steps.gate.outputs.should_run == 'true' && 'run' || 'skip' }}
    env:
      MONITOR_MODE: daily-run
      MONITOR_OUTPUT_DIR: monitor-out
      MONITOR_PERSIST_STATE: '1'
      NZZ_COOKIE_HEADER: ${{ secrets.NZZ_COOKIE_HEADER }}
      # Gmail remains opt-in. OAuth credentials stay on the Raspberry; Actions
      # receives only the sanitised feed URL and its independent read key.
      GMAIL_SOURCE_ENABLED: ${{ secrets.GMAIL_SOURCE_ENABLED }}
      GMAIL_FEED_URL: ${{ secrets.GMAIL_FEED_URL }}
      GMAIL_FEED_API_KEY: ${{ secrets.GMAIL_FEED_API_KEY }}
      # Shadow mode only: public selection remains unchanged. The model is a
      # repository variable so it can be changed without a code change.
      EDITORIAL_AI_ENABLED: ${{ vars.EDITORIAL_AI_ENABLED || 'false' }}
      EDITORIAL_AI_MODEL: ${{ vars.EDITORIAL_AI_MODEL || 'gpt-6-luna' }}
      EDITORIAL_AI_INPUT_USD_PER_MTOK: ${{ vars.EDITORIAL_AI_INPUT_USD_PER_MTOK || '0.10' }}
      EDITORIAL_AI_CACHED_INPUT_USD_PER_MTOK: ${{ vars.EDITORIAL_AI_CACHED_INPUT_USD_PER_MTOK || '0.01' }}
      EDITORIAL_AI_CACHE_WRITE_USD_PER_MTOK: ${{ vars.EDITORIAL_AI_CACHE_WRITE_USD_PER_MTOK || '0.125' }}
      EDITORIAL_AI_OUTPUT_USD_PER_MTOK: ${{ vars.EDITORIAL_AI_OUTPUT_USD_PER_MTOK || '0.50' }}
      EDITORIAL_AI_MONTHLY_BUDGET_USD: ${{ vars.EDITORIAL_AI_MONTHLY_BUDGET_USD || '10' }}
      EDITORIAL_AI_MAX_CANDIDATES: ${{ vars.EDITORIAL_AI_MAX_CANDIDATES || '0' }}
      EDITORIAL_AI_CACHE_RETENTION_DAYS: ${{ vars.EDITORIAL_AI_CACHE_RETENTION_DAYS || '45' }}
      EDITORIAL_AI_CACHE_PATH: .cache/newsmonitor/editorial_ai_cache.json
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve Zurich schedule
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo('Europe/Zurich')
          now = datetime.now(tz)
          event_name = os.getenv('EVENT_NAME') or ''
          schedule = (os.getenv('EVENT_SCHEDULE') or '').strip()
          offset_hours = int(now.utcoffset().total_seconds() // 3600)

          morning_schedules = {'30 7 * * *'}

          should_run = event_name in {'workflow_dispatch', 'workflow_call'}
          already_ran_today = False
          existing_generated_at = ''
          run_kind = 'manual' if should_run else 'unknown'

          if event_name == 'schedule':
              if schedule in morning_schedules:
                  run_kind = 'morning-daily'
                  report_path = Path('data/monitor/reports') / f'{now.date().isoformat()}.json'
                  if report_path.exists():
                      try:
                          report = json.loads(report_path.read_text(encoding='utf-8'))
                          existing_generated_at = str(report.get('generated_at') or '')
                          reliability = str(report.get('run_reliability') or '')
                          status = str(report.get('status') or '')
                          if existing_generated_at:
                              generated = datetime.fromisoformat(existing_generated_at.replace('Z', '+00:00'))
                              if generated.tzinfo is None:
                                  generated = generated.replace(tzinfo=tz)
                              generated_local = generated.astimezone(tz)
                              cutoff = datetime.combine(now.date(), time(7, 0), tzinfo=tz)
                              already_ran_today = (
                                  generated_local >= cutoff
                                  and reliability == 'complete'
                                  and status == 'success'
                              )
                      except Exception:
                          already_ran_today = False
                  should_run = not already_ran_today
              else:
                  should_run = False

          print(f"should_run={'true' if should_run else 'false'}")
          print(f"local_time={now.isoformat()}")
          print(f"utc_offset_hours={offset_hours}")
          print(f"schedule={schedule}")
          print(f"event_name={event_name}")
          print(f"run_kind={run_kind}")
          print(f"already_ran_today={'true' if already_ran_today else 'false'}")
          print(f"existing_generated_at={existing_generated_at}")
          PY

      - name: Show schedule decision
        run: |
          echo "Zurich time: ${{ steps.gate.outputs.local_time }}"
          echo "UTC offset: ${{ steps.gate.outputs.utc_offset_hours }}"
          echo "Scheduled expression: ${{ steps.gate.outputs.schedule }}"
          echo "Event: ${{ steps.gate.outputs.event_name }}"
          echo "Run kind: ${{ steps.gate.outputs.run_kind }}"
          echo "Already ran today: ${{ steps.gate.outputs.already_ran_today }}"
          echo "Existing report: ${{ steps.gate.outputs.existing_generated_at }}"
          echo "Run: ${{ steps.gate.outputs.should_run }}"

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh durable editorial usage ledger
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git fetch origin main
          python .github/scripts/monitor/sync_editorial_usage.py

      # The E-Paper job already saves an immutable snapshot with this run ID.
      # Use a distinct Daily key, otherwise the restored E-Paper key prevents
      # saving the new Daily analyses for the next manual Full Run.
      # One-time migration: changing editorial_ai.py changes the primary
      # cache namespace, even though previously validated article analyses
      # remain compatible. Restore the last verified pre-PR31 snapshot.
      # Keep the current-code prefix first, so newer snapshots take priority.
      - name: Restore private editorial analysis cache
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/newsmonitor/editorial_ai_cache.json
          key: editorial-ai-${{ runner.os }}-${{ hashFiles('.github/scripts/monitor/editorial_ai.py', '.github/scripts/monitor/prompts/editorial_v1.md') }}-${{ github.run_id }}-daily
          restore-keys: |
            editorial-ai-${{ runner.os }}-${{ hashFiles('.github/scripts/monitor/editorial_ai.py', '.github/scripts/monitor/prompts/editorial_v1.md') }}-
            editorial-ai-${{ runner.os }}-78c97a197929b086a3ead14cf475c7204bda9bbedd673248416fe49f2560ef56-

      - name: Preserve previous run of the day
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/archive_runs.py before

      - name: Run online news monitor
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/run_monitor.py

      - name: Publish editorial review candidates before quality filtering
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        run: python .github/scripts/monitor/review_feed.py daily --input monitor-out/monitor-daily-run.json

      - name: Report source retries and incomplete run status
        if: steps.gate.outputs.should_run == 'true'
        # Targeted P1 retries happened within run_monitor.py before any AI calls.
        # This step reports partial coverage; it never runs the monitor twice.
        run: python .github/scripts/monitor/retry_incomplete_run.py

      - name: Enrich publication dates from RSS and Bund API
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/enrich_structured_dates.py

      - name: Filter and rank public news by freshness, relevance and novelty
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/filter_report_freshness.py

      - name: Apply contextual relevance guard
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/post_quality_guard.py

      - name: Evaluate editorial AI shadow selection
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/editorial_eval.py

      - name: Register current run in 30-day history
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/archive_runs.py after

      - name: Build internal searchable monitor view
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/internal_view.py

      - name: Commit monitor state and daily archive
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          python .github/scripts/monitor/sync_editorial_usage.py
          git add data/monitor/state/news_state.json data/monitor/state/procedure_state.json data/monitor/state/risk_state.json data/monitor/state/reminders.json data/monitor/state/run_history.json data/monitor/state/editorial_ai_usage.json data/monitor/reports/ data/monitor/review/ || true
          if git diff --cached --quiet; then
            echo "No monitor state or archive changes to commit."
            exit 0
          fi
          git commit -m "monitor: update daily state and report archive"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt ${attempt} failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "Unable to push monitor state after 3 attempts."
          exit 1

      - name: Upload daily monitor report
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: monitor-daily-run
          path: |
            monitor-out/monitor-daily-run.json
            monitor-out/internal-monitor.html
            monitor-out/internal-monitor-index.json
            monitor-out/editorial-ai-shadow.json
            monitor-out/editorial-ai-evaluation.json
          if-no-files-found: warn
          retention-days: 30

  deploy-public-monitor:
    name: Deploy public monitor
    needs: monitor-daily-run
    if: needs.monitor-daily-run.outputs.should_run == 'run'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
