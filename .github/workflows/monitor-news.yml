name: Monitor - Daily Run

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '7 5 * * *'
      timezone: 'Europe/Zurich'
    - cron: '37 5 * * *'
      timezone: 'Europe/Zurich'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor-daily-run
  cancel-in-progress: false

jobs:
  monitor-daily-run:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    env:
      MONITOR_MODE: daily-run
      MONITOR_OUTPUT_DIR: monitor-out
      MONITOR_PERSIST_STATE: '1'
      NZZ_COOKIE_HEADER: ${{ secrets.NZZ_COOKIE_HEADER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve Zurich schedule
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo('Europe/Zurich')
          now = datetime.now(tz)
          event_name = os.getenv('EVENT_NAME') or ''
          schedule = (os.getenv('EVENT_SCHEDULE') or '').strip()
          offset_hours = int(now.utcoffset().total_seconds() // 3600)

          should_run = event_name in {'workflow_dispatch', 'workflow_call'}
          already_ran_today = False
          existing_generated_at = ''

          if event_name == 'schedule':
              report_path = Path('data/monitor/reports') / f'{now.date().isoformat()}.json'
              if report_path.exists():
                  try:
                      report = json.loads(report_path.read_text(encoding='utf-8'))
                      existing_generated_at = str(report.get('generated_at') or '')
                      reliability = str(report.get('run_reliability') or '')
                      status = str(report.get('status') or '')
                      if existing_generated_at:
                          generated = datetime.fromisoformat(existing_generated_at.replace('Z', '+00:00'))
                          if generated.tzinfo is None:
                              generated = generated.replace(tzinfo=tz)
                          generated_local = generated.astimezone(tz)
                          cutoff = datetime.combine(now.date(), time(5, 0), tzinfo=tz)
                          already_ran_today = (
                              generated_local >= cutoff
                              and reliability == 'complete'
                              and status == 'success'
                          )
                  except Exception:
                      already_ran_today = False
              should_run = not already_ran_today

          print(f"should_run={'true' if should_run else 'false'}")
          print(f"local_time={now.isoformat()}")
          print(f"utc_offset_hours={offset_hours}")
          print(f"schedule={schedule}")
          print(f"event_name={event_name}")
          print(f"already_ran_today={'true' if already_ran_today else 'false'}")
          print(f"existing_generated_at={existing_generated_at}")
          PY

      - name: Show schedule decision
        run: |
          echo "Zurich time: ${{ steps.gate.outputs.local_time }}"
          echo "UTC offset: ${{ steps.gate.outputs.utc_offset_hours }}"
          echo "Scheduled expression: ${{ steps.gate.outputs.schedule }}"
          echo "Event: ${{ steps.gate.outputs.event_name }}"
          echo "Already ran today: ${{ steps.gate.outputs.already_ran_today }}"
          echo "Existing report: ${{ steps.gate.outputs.existing_generated_at }}"
          echo "Run: ${{ steps.gate.outputs.should_run }}"

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Preserve previous run of the day
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/archive_runs.py before

      - name: Run combined news, procedure and risk monitor
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/run_monitor.py

      - name: Retry incomplete source run once
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/retry_incomplete_run.py

      - name: Enrich publication dates from RSS and Bund API
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/enrich_structured_dates.py

      - name: Filter and rank public news by freshness, relevance and novelty
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/filter_report_freshness.py

      - name: Apply contextual relevance guard
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/post_quality_guard.py

      - name: Register current run in 30-day history
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/archive_runs.py after

      - name: Build internal searchable monitor view
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/internal_view.py

      - name: Commit monitor state and daily archive
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor/state/news_state.json data/monitor/state/procedure_state.json data/monitor/state/risk_state.json data/monitor/state/reminders.json data/monitor/state/run_history.json data/monitor/reports/ || true
          if git diff --cached --quiet; then
            echo "No monitor state or archive changes to commit."
            exit 0
          fi
          git commit -m "monitor: update daily state and report archive"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt ${attempt} failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "Unable to push monitor state after 3 attempts."
          exit 1

      - name: Upload daily monitor report
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: monitor-daily-run
          path: |
            monitor-out/monitor-daily-run.json
            monitor-out/internal-monitor.html
            monitor-out/internal-monitor-index.json
          if-no-files-found: warn
          retention-days: 30

  deploy-public-monitor:
    name: Deploy public monitor
    needs: monitor-daily-run
    if: needs.monitor-daily-run.outputs.should_run == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
