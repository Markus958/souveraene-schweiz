name: Monitor – E-Paper Evening

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Ausgabe: auto, NZZ oder NZZ am Sonntag'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - nzz
          - nzzas
  workflow_call:
    inputs:
      edition:
        description: 'Ausgabe: auto, nzz oder nzzas'
        required: false
        default: auto
        type: string
      dispatch_daily:
        description: 'Daily Run nach dem E-Paper starten'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/scripts/monitor/archive.py'
      - '.github/scripts/monitor/eventize.py'
      - '.github/scripts/monitor/nzz_epaper_collect.cjs'
      - '.github/scripts/monitor/nzz_pdf_extract.py'
      - '.github/scripts/monitor/run_epaper_evening.py'
      - '.github/workflows/monitor-epaper-evening.yml'
  schedule:
    - cron: '45 21 * * *'
      timezone: "Europe/Zurich"

permissions:
  actions: write
  contents: write

jobs:
  epaper-evening:
    runs-on: ubuntu-24.04
    env:
      MONITOR_OUTPUT_DIR: monitor-out
      NZZ_COOKIE_HEADER: ${{ secrets.NZZ_COOKIE_HEADER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve Zurich schedule and edition
        id: gate
        shell: bash
        env:
          REQUESTED_EDITION: ${{ inputs.edition || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo('Europe/Zurich'))
          requested = (os.getenv('REQUESTED_EDITION') or 'auto').strip().lower()
          direct_run = os.getenv('EVENT_NAME') in {'workflow_dispatch', 'workflow_call', 'push'}

          # GitHub can delay scheduled workflows; do not reject a valid run based on its actual start time.
          should_run = direct_run or os.getenv('EVENT_NAME') == 'schedule'

          if requested in {'nzz', 'nzzas'}:
              edition = requested
          elif now.weekday() == 6:
              edition = 'nzzas'
          elif now.weekday() == 5 and not direct_run and now.hour >= 21:
              edition = 'nzzas'
          else:
              edition = 'nzz'

          target_date = now.date()
          if edition == 'nzzas' and now.weekday() == 5:
              target_date = target_date + timedelta(days=1)

          print(f"should_run={'true' if should_run else 'false'}")
          print(f"edition={edition}")
          print(f"target_date={target_date.isoformat()}")
          print(f"local_time={now.isoformat()}")
          PY

      - name: Show schedule decision
        run: |
          echo "Zurich time: ${{ steps.gate.outputs.local_time }}"
          echo "Edition: ${{ steps.gate.outputs.edition }}"
          echo "Target issue date: ${{ steps.gate.outputs.target_date }}"
          echo "Run: ${{ steps.gate.outputs.should_run }}"

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install e-paper dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python -m pip install --disable-pip-version-check --quiet pymupdf

      - name: Download NZZ e-paper PDF
        if: steps.gate.outputs.should_run == 'true'
        id: download
        continue-on-error: true
        env:
          NZZ_EPAPER_EDITION: ${{ steps.gate.outputs.edition }}
          NZZ_EPAPER_TARGET_DATE: ${{ steps.gate.outputs.target_date }}
          NZZ_EPAPER_PDF_PATH: monitor-out/current-epaper.pdf
          NZZ_EPAPER_META_PATH: monitor-out/epaper-download.json
        run: node .github/scripts/monitor/nzz_epaper_collect.cjs

      - name: Extract e-paper headlines
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        env:
          NZZ_EPAPER_EDITION: ${{ steps.gate.outputs.edition }}
          NZZ_EPAPER_PDF_PATH: monitor-out/current-epaper.pdf
          NZZ_EPAPER_OUTPUT: monitor-out/epaper-findings.json
        run: |
          if [ -f monitor-out/current-epaper.pdf ]; then
            python .github/scripts/monitor/nzz_pdf_extract.py
          else
            echo "No PDF available for extraction."
          fi

      - name: Validate e-paper issue date
        if: steps.gate.outputs.should_run == 'true'
        env:
          TARGET_DATE: ${{ steps.gate.outputs.target_date }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import date, datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path('monitor-out/epaper-findings.json')
          if not path.is_file():
              raise SystemExit('epaper-findings.json fehlt; Tageslauf wird nicht gestartet.')
          payload = json.loads(path.read_text(encoding='utf-8'))
          issue_date = str((payload.get('metadata') or {}).get('issue_date') or '')
          target = date.fromisoformat(os.environ['TARGET_DATE'])
          now = datetime.now(ZoneInfo('Europe/Zurich'))
          accepted = {target.isoformat()}
          # NZZ often exposes tomorrow's edition on the previous evening. Accept it,
          # but keep the real issue date so run_epaper_evening.py archives it under tomorrow.
          if now.hour >= 21:
              accepted.add((target + timedelta(days=1)).isoformat())
          if issue_date not in accepted:
              raise SystemExit(
                  f'Falsche NZZ-Ausgabe geladen: {issue_date or "unbekannt"}; '
                  f'erlaubt: {", ".join(sorted(accepted))}.'
              )
          rollover = issue_date != target.isoformat()
          print(f'NZZ-Ausgabe geprüft: {issue_date}; evening_rollover={str(rollover).lower()}')
          PY

      - name: Analyse early-warning events
        if: steps.gate.outputs.should_run == 'true'
        env:
          NZZ_EPAPER_EDITION: ${{ steps.gate.outputs.edition }}
          NZZ_EPAPER_OUTPUT: monitor-out/epaper-findings.json
        run: python .github/scripts/monitor/run_epaper_evening.py

      - name: Validate e-paper pipeline
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pdf = Path('monitor-out/current-epaper.pdf')
          meta = Path('monitor-out/epaper-download.json')
          findings = Path('monitor-out/epaper-findings.json')
          report = Path('monitor-out/monitor-epaper-evening.json')

          errors = []
          if not pdf.is_file():
              errors.append('current-epaper.pdf fehlt')
          else:
              data = pdf.read_bytes()
              if len(data) <= 100_000 or not data.startswith(b'%PDF'):
                  errors.append('current-epaper.pdf ist keine valide PDF-Datei')

          if not meta.is_file():
              errors.append('epaper-download.json fehlt')
          else:
              try:
                  payload = json.loads(meta.read_text(encoding='utf-8'))
                  if payload.get('pdf_detected') is not True:
                      errors.append('Collector meldet pdf_detected != true')
              except Exception as exc:
                  errors.append(f'epaper-download.json unlesbar: {exc}')

          for path, label in ((findings, 'epaper-findings.json'), (report, 'monitor-epaper-evening.json')):
              if not path.is_file():
                  errors.append(f'{label} fehlt')
              else:
                  try:
                      json.loads(path.read_text(encoding='utf-8'))
                  except Exception as exc:
                      errors.append(f'{label} unlesbar: {exc}')

          if errors:
              print('E-paper pipeline validation failed:')
              for error in errors:
                  print(f'- {error}')
              raise SystemExit(1)

          print('E-paper pipeline validation passed: PDF, metadata, findings and analysis are present and valid.')
          PY

      - name: Build internal searchable monitor view
        if: steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/internal_view.py

      - name: Commit e-paper monitor state and metadata
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor/state/news_state.json data/monitor/state/reminders.json data/monitor/reports/epaper/ || true
          if git diff --cached --quiet; then
            echo "No e-paper state changes to commit."
            exit 0
          fi
          git commit -m "monitor: update e-paper early-warning state"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 3
          done
          exit 1

      - name: Refresh daily monitor report with e-paper candidates
        if: steps.gate.outputs.should_run == 'true' && (github.event_name != 'workflow_call' || inputs.dispatch_daily)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run monitor-news.yml --ref main
          echo "Dispatched daily monitor to merge the e-paper archive into the public report."

      - name: Upload e-paper artifact
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: monitor-epaper-evening
          path: |
            monitor-out/current-epaper.pdf
            monitor-out/epaper-download.json
            monitor-out/epaper-findings.json
            monitor-out/monitor-epaper-evening.json
            monitor-out/internal-monitor.html
            monitor-out/internal-monitor-index.json
          if-no-files-found: warn
          retention-days: 1
