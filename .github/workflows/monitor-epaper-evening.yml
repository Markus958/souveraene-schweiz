name: Monitor – E-Paper Evening

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Ausgabe: auto, NZZ oder NZZ am Sonntag'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - nzz
          - nzzas
      trigger_mode:
        description: 'Auslöser: manuell oder Raspberry'
        required: false
        default: manual
        type: choice
        options:
          - manual
          - raspberry
      target_date:
        description: 'Optionales Ausgabedatum YYYY-MM-DD; für Raspberry obligatorisch'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      edition:
        description: 'Ausgabe: auto, nzz oder nzzas'
        required: false
        default: auto
        type: string
      trigger_mode:
        required: false
        default: manual
        type: string
      target_date:
        required: false
        default: ''
        type: string
      dispatch_daily:
        description: 'Daily Run nach dem E-Paper starten'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/scripts/monitor/archive.py'
      - '.github/scripts/monitor/eventize.py'
      - '.github/scripts/monitor/nzz_epaper_collect.cjs'
      - '.github/scripts/monitor/nzz_pdf_extract.py'
      - '.github/scripts/monitor/run_epaper_evening.py'
      - '.github/workflows/monitor-epaper-evening.yml'
  schedule:
    - cron: '30/5 21 * * *'
      timezone: "Europe/Zurich"
    - cron: '*/5 22-23 * * *'
      timezone: "Europe/Zurich"

permissions:
  actions: write
  contents: write

concurrency:
  group: monitor-editorial-ai
  cancel-in-progress: false

jobs:
  epaper-evening:
    runs-on: ubuntu-24.04
    env:
      MONITOR_OUTPUT_DIR: monitor-out
      NZZ_COOKIE_HEADER: ${{ secrets.NZZ_COOKIE_HEADER }}
      EDITORIAL_AI_ENABLED: ${{ vars.EDITORIAL_AI_ENABLED || 'false' }}
      EDITORIAL_AI_MODEL: ${{ vars.EDITORIAL_AI_MODEL || 'gpt-6-luna' }}
      EDITORIAL_AI_INPUT_USD_PER_MTOK: ${{ vars.EDITORIAL_AI_INPUT_USD_PER_MTOK || '0.10' }}
      EDITORIAL_AI_CACHED_INPUT_USD_PER_MTOK: ${{ vars.EDITORIAL_AI_CACHED_INPUT_USD_PER_MTOK || '0.01' }}
      EDITORIAL_AI_CACHE_WRITE_USD_PER_MTOK: ${{ vars.EDITORIAL_AI_CACHE_WRITE_USD_PER_MTOK || '0.125' }}
      EDITORIAL_AI_OUTPUT_USD_PER_MTOK: ${{ vars.EDITORIAL_AI_OUTPUT_USD_PER_MTOK || '0.50' }}
      EDITORIAL_AI_MONTHLY_BUDGET_USD: ${{ vars.EDITORIAL_AI_MONTHLY_BUDGET_USD || '10' }}
      EDITORIAL_AI_CACHE_PATH: .cache/newsmonitor/editorial_ai_cache.json
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve Zurich schedule and edition
        id: gate
        shell: bash
        env:
          REQUESTED_EDITION: ${{ inputs.edition || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_MODE: ${{ inputs.trigger_mode || 'manual' }}
          REQUESTED_TARGET_DATE: ${{ inputs.target_date || '' }}
          PYTHONPATH: .github/scripts/monitor
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from epaper_schedule import resolve_epaper_schedule, should_process_issue

          now = datetime.now(ZoneInfo('Europe/Zurich'))
          requested = (os.getenv('REQUESTED_EDITION') or 'auto').strip().lower()
          decision = resolve_epaper_schedule(
              now,
              event_name=os.getenv('EVENT_NAME', ''),
              requested_edition=requested,
              trigger_mode=os.getenv('TRIGGER_MODE', 'manual'),
              requested_target_date=os.getenv('REQUESTED_TARGET_DATE', ''),
          )
          force_run = decision.trigger_mode in {'manual', 'push'}
          should_run = decision.should_run
          target_date = decision.target_date
          edition = decision.edition
          archive = Path('data/monitor/reports/epaper') / f'{target_date.isoformat()}-{edition}.json'
          status_path = Path('data/monitor/status/nzz-epaper.json')
          status = {}
          if status_path.exists():
              try:
                  status = json.loads(status_path.read_text(encoding='utf-8'))
              except Exception:
                  status = {}
          issue = status.get('issue') or {}
          attempt = status.get('current_attempt') or {}
          same_issue = issue.get('edition') == edition and issue.get('target_date') == target_date.isoformat()
          retry_ai_only = bool(same_issue and attempt.get('edition_available') and (attempt.get('editorial_ai') or {}).get('status') not in {'success', 'disabled'})
          should_run, processing_reason = should_process_issue(
              decision,
              direct_run=force_run,
              archive_exists=archive.exists(),
              retry_ai_only=retry_ai_only,
              attempt_complete=bool(attempt.get('complete')),
          )

          print(f"should_run={'true' if should_run else 'false'}")
          print(f"edition={edition}")
          print(f"target_date={target_date.isoformat()}")
          print(f"local_time={now.isoformat()}")
          print(f"intended_evening={decision.intended_evening.isoformat()}")
          print(f"schedule_reason={processing_reason}")
          print(f"trigger_mode={decision.trigger_mode}")
          print(f"retry_ai_only={'true' if retry_ai_only else 'false'}")
          PY

      - name: Show schedule decision
        run: |
          echo "Zurich time: ${{ steps.gate.outputs.local_time }}"
          echo "Edition: ${{ steps.gate.outputs.edition }}"
          echo "Target issue date: ${{ steps.gate.outputs.target_date }}"
          echo "Intended evening: ${{ steps.gate.outputs.intended_evening }}"
          echo "Schedule reason: ${{ steps.gate.outputs.schedule_reason }}"
          echo "Trigger mode: ${{ steps.gate.outputs.trigger_mode }}"
          echo "Run: ${{ steps.gate.outputs.should_run }}"

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh durable editorial usage ledger
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git fetch origin main
          python .github/scripts/monitor/sync_editorial_usage.py

      - name: Restore shared private editorial analysis cache
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/newsmonitor/editorial_ai_cache.json
          key: editorial-ai-${{ runner.os }}-${{ hashFiles('.github/scripts/monitor/editorial_ai.py', '.github/scripts/monitor/prompts/editorial_v1.md') }}-${{ github.run_id }}
          restore-keys: |
            editorial-ai-${{ runner.os }}-${{ hashFiles('.github/scripts/monitor/editorial_ai.py', '.github/scripts/monitor/prompts/editorial_v1.md') }}-

      - name: Restore private e-paper retry material
        id: epaper-work-cache
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/newsmonitor/epaper-work
          key: epaper-work-${{ steps.gate.outputs.edition }}-${{ steps.gate.outputs.target_date }}

      - name: Reuse successful download and extraction
        if: steps.gate.outputs.should_run == 'true' && steps.epaper-work-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p monitor-out
          cp .cache/newsmonitor/epaper-work/current-epaper.pdf monitor-out/current-epaper.pdf
          cp .cache/newsmonitor/epaper-work/epaper-download.json monitor-out/epaper-download.json
          cp .cache/newsmonitor/epaper-work/epaper-findings.json monitor-out/epaper-findings.json

      - name: Set up Node
        if: steps.gate.outputs.should_run == 'true' && steps.epaper-work-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Restore Playwright download caches
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: epaper-playwright-${{ runner.os }}-node24-v1

      - name: Install e-paper dependencies
        if: steps.gate.outputs.should_run == 'true' && steps.epaper-work-cache.outputs.cache-hit != 'true'
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python -m pip install --disable-pip-version-check --quiet pymupdf

      - name: Download NZZ e-paper PDF
        if: steps.gate.outputs.should_run == 'true' && steps.epaper-work-cache.outputs.cache-hit != 'true'
        id: download
        continue-on-error: true
        env:
          NZZ_EPAPER_EDITION: ${{ steps.gate.outputs.edition }}
          NZZ_EPAPER_TARGET_DATE: ${{ steps.gate.outputs.target_date }}
          NZZ_EPAPER_PDF_PATH: monitor-out/current-epaper.pdf
          NZZ_EPAPER_META_PATH: monitor-out/epaper-download.json
        run: node .github/scripts/monitor/nzz_epaper_collect.cjs

      - name: Extract e-paper headlines
        id: extract
        if: steps.gate.outputs.should_run == 'true' && steps.epaper-work-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          NZZ_EPAPER_EDITION: ${{ steps.gate.outputs.edition }}
          NZZ_EPAPER_PDF_PATH: monitor-out/current-epaper.pdf
          NZZ_EPAPER_OUTPUT: monitor-out/epaper-findings.json
        run: |
          if [ -f monitor-out/current-epaper.pdf ]; then
            python .github/scripts/monitor/nzz_pdf_extract.py
          else
            echo "No PDF available for extraction."
          fi

      - name: Validate e-paper issue date
        id: validate
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.gate.outputs.target_date }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import date
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path('monitor-out/epaper-findings.json')
          if not path.is_file():
              raise SystemExit('epaper-findings.json fehlt; Tageslauf wird nicht gestartet.')
          payload = json.loads(path.read_text(encoding='utf-8'))
          issue_date = str((payload.get('metadata') or {}).get('issue_date') or '')
          target = date.fromisoformat(os.environ['TARGET_DATE'])
          accepted = {target.isoformat()}
          if issue_date not in accepted:
              raise SystemExit(
                  f'Falsche NZZ-Ausgabe geladen: {issue_date or "unbekannt"}; '
                  f'erlaubt: {", ".join(sorted(accepted))}.'
              )
          rollover = issue_date != target.isoformat()
          print(f'NZZ-Ausgabe geprüft: {issue_date}; evening_rollover={str(rollover).lower()}')
          PY

      - name: Analyse early-warning events
        id: analysis
        if: steps.gate.outputs.should_run == 'true' && steps.validate.outcome == 'success'
        continue-on-error: true
        env:
          NZZ_EPAPER_EDITION: ${{ steps.gate.outputs.edition }}
          NZZ_EPAPER_OUTPUT: monitor-out/epaper-findings.json
        run: python .github/scripts/monitor/run_epaper_evening.py

      - name: Preserve validated e-paper for targeted retries
        if: steps.gate.outputs.should_run == 'true' && steps.validate.outcome == 'success' && steps.epaper-work-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/newsmonitor/epaper-work
          cp monitor-out/current-epaper.pdf .cache/newsmonitor/epaper-work/current-epaper.pdf
          cp monitor-out/epaper-download.json .cache/newsmonitor/epaper-work/epaper-download.json
          cp monitor-out/epaper-findings.json .cache/newsmonitor/epaper-work/epaper-findings.json

      - name: Validate e-paper pipeline
        id: pipeline
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pdf = Path('monitor-out/current-epaper.pdf')
          meta = Path('monitor-out/epaper-download.json')
          findings = Path('monitor-out/epaper-findings.json')
          report = Path('monitor-out/monitor-epaper-evening.json')

          errors = []
          if not pdf.is_file():
              errors.append('current-epaper.pdf fehlt')
          else:
              data = pdf.read_bytes()
              if len(data) <= 100_000 or not data.startswith(b'%PDF'):
                  errors.append('current-epaper.pdf ist keine valide PDF-Datei')

          if not meta.is_file():
              errors.append('epaper-download.json fehlt')
          else:
              try:
                  payload = json.loads(meta.read_text(encoding='utf-8'))
                  if payload.get('pdf_detected') is not True:
                      errors.append('Collector meldet pdf_detected != true')
              except Exception as exc:
                  errors.append(f'epaper-download.json unlesbar: {exc}')

          for path, label in ((findings, 'epaper-findings.json'), (report, 'monitor-epaper-evening.json')):
              if not path.is_file():
                  errors.append(f'{label} fehlt')
              else:
                  try:
                      json.loads(path.read_text(encoding='utf-8'))
                  except Exception as exc:
                      errors.append(f'{label} unlesbar: {exc}')

          if errors:
              print('E-paper pipeline validation failed:')
              for error in errors:
                  print(f'- {error}')
              raise SystemExit(1)

          print('E-paper pipeline validation passed: PDF, metadata, findings and analysis are present and valid.')
          PY

      - name: Persist NZZ processing status
        if: always() && steps.gate.outputs.should_run == 'true'
        env:
          NZZ_EPAPER_EDITION: ${{ steps.gate.outputs.edition }}
          NZZ_EPAPER_TARGET_DATE: ${{ steps.gate.outputs.target_date }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        run: python .github/scripts/monitor/epaper_status.py

      - name: Build internal searchable monitor view
        if: always() && steps.gate.outputs.should_run == 'true'
        run: python .github/scripts/monitor/internal_view.py

      - name: Commit e-paper monitor state and metadata
        if: always() && steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          python .github/scripts/monitor/sync_editorial_usage.py
          git add data/monitor/state/news_state.json data/monitor/state/reminders.json data/monitor/state/editorial_ai_usage.json data/monitor/reports/epaper/ data/monitor/status/nzz-epaper.json || true
          if git diff --cached --quiet; then
            echo "No e-paper state changes to commit."
            exit 0
          fi
          git commit -m "monitor: update e-paper early-warning state"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 3
          done
          exit 1

      - name: Refresh daily monitor report with e-paper candidates
        if: steps.gate.outputs.should_run == 'true' && inputs.dispatch_daily == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run monitor-news.yml --ref main
          echo "Dispatched daily monitor to merge the e-paper archive into the public report."

      - name: Upload e-paper artifact
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: monitor-epaper-evening
          path: |
            monitor-out/current-epaper.pdf
            monitor-out/epaper-download.json
            monitor-out/epaper-findings.json
            monitor-out/monitor-epaper-evening.json
            monitor-out/editorial-ai-shadow.json
            monitor-out/internal-monitor.html
            monitor-out/internal-monitor-index.json
          if-no-files-found: warn
          retention-days: 1

      - name: Fail on recorded processing error
        if: always() && steps.gate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('data/monitor/status/nzz-epaper.json').read_text(encoding='utf-8'))
          current = status.get('current_attempt') or {}
          if current.get('overall_status') == 'failed':
              raise SystemExit('NZZ-Verarbeitung fehlgeschlagen; Details stehen im persistenten Status.')
          print(f"NZZ-Verarbeitung: {current.get('overall_status')}; complete={current.get('complete')}")
          PY
