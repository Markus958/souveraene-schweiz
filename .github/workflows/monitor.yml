name: Monitor Foundation Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-dry-run:
    runs-on: ubuntu-24.04
    env:
      MONITOR_MODE: dry-run
      MONITOR_OUTPUT_DIR: monitor-out
      NZZ_COOKIE_HEADER: ${{ secrets.NZZ_COOKIE_HEADER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor foundation validation
        run: python .github/scripts/monitor/run_monitor.py

      - name: Upload dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-foundation-dry-run
          path: monitor-out/monitor-dry-run.json
          if-no-files-found: warn
          retention-days: 14
