name: Neuesten X-Post aktualisieren

on:
  schedule:
    - cron: '0 6,10,14,18,22 * * *'  # 5× täglich (06:00, 10:00, 14:00, 18:00, 22:00 UTC)
  workflow_dispatch:                  # Auch manuell auslösbar (Repo → Actions → Run workflow)

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Neuesten Post via Nitter-RSS abrufen und index.html aktualisieren
        run: python3 .github/scripts/update_x_post.py

      - name: Commit und Push (nur bei Änderung)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Kein neuer Post, kein Commit."
          else
            git add index.html
            git commit -m "Auto: neuester Post @mllw58 aktualisiert"
            git push || echo "Push fehlgeschlagen – wird beim naechsten Lauf wiederholt."
          fi
