name: Neuesten X-Post aktualisieren

on:
  schedule:
    - cron: '0 6,10,14,18,22 * * *'  # 5× täglich (06:00, 10:00, 14:00, 18:00, 22:00 UTC)
  workflow_dispatch:                  # Auch manuell auslösbar (Repo → Actions → Run workflow)

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Neuesten Post via RSSHub abrufen und index.html aktualisieren
        run: |
          python3 << 'PYEOF'
          import re, sys, html as html_module
          from datetime import datetime, timezone, timedelta
          from xml.etree import ElementTree as ET
          import urllib.request, urllib.error

          USERNAME = 'MLLW58'

          # RSSHub-Instanzen – wird der Reihe nach versucht bis eine antwortet
          RSS_URLS = [
              f'https://rsshub.app/twitter/user/{USERNAME}',
              f'https://rss.fatflows.com/twitter/user/{USERNAME}',
          ]

          xml_data = None
          for rss_url in RSS_URLS:
              try:
                  req = urllib.request.Request(
                      rss_url,
                      headers={'User-Agent': 'Mozilla/5.0 (compatible; RSS-reader)'}
                  )
                  with urllib.request.urlopen(req, timeout=15) as r:
                      xml_data = r.read()
                  print(f'RSS geladen: {rss_url}')
                  break
              except Exception as e:
                  print(f'Fehler bei {rss_url}: {e}')

          if not xml_data:
              print('Kein RSS-Feed erreichbar – Abbruch ohne Änderung.')
              sys.exit(0)

          root = ET.fromstring(xml_data)
          channel = root.find('channel')
          item = channel.find('item')
          if item is None:
              print('Kein Item im Feed gefunden.')
              sys.exit(0)

          # Titel und Link
          raw_title = item.findtext('title', '').strip()
          link      = item.findtext('link', '').strip()

          # Beschreibung: HTML-Tags entfernen
          raw_desc  = item.findtext('description', '').strip()
          desc_text = re.sub(r'<[^>]+>', ' ', raw_desc)
          desc_text = re.sub(r'\s+', ' ', desc_text).strip()
          desc_text = html_module.unescape(desc_text)

          titel  = html_module.unescape(raw_title)
          teaser = desc_text if desc_text and desc_text != titel else titel

          # Datum parsen: "Mon, 23 Mar 2026 12:00:00 +0000"
          pub_date = item.findtext('pubDate', '').strip()
          monate = ['Jan.','Feb.','März','Apr.','Mai','Juni',
                    'Juli','Aug.','Sep.','Okt.','Nov.','Dez.']
          try:
              dt = datetime.strptime(pub_date, '%a, %d %b %Y %H:%M:%S %z')
              dt = dt.astimezone(timezone(timedelta(hours=1)))
              datum = f"{dt.day}. {monate[dt.month-1]} {dt.year} · {dt.strftime('%H:%M')}"
          except Exception:
              datum = pub_date[:16] if pub_date else ''

          # JS-String escapen
          def js(s):
              return s.replace('\\', '\\\\').replace("'", "\\'")

          new_block = (
              "  var LETZTER_POST = {\n"
              f"    datum: '{js(datum)}',\n"
              f"    titel: '{js(titel)}',\n"
              f"    text:  '{js(teaser)}',\n"
              f"    url:   '{link}'\n"
              "  };"
          )

          with open('index.html', 'r', encoding='utf-8') as f:
              html_content = f.read()

          updated = re.sub(
              r'var LETZTER_POST = \{.*?\};',
              new_block,
              html_content,
              flags=re.DOTALL
          )

          if updated == html_content:
              print('Kein neuer Post – bereits aktuell.')
              sys.exit(0)

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(updated)

          print(f'Aktualisiert: {titel}')
          PYEOF

      - name: Commit und Push (nur bei Änderung)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "Kein neuer Post, kein Commit." || (
            git add index.html &&
            git commit -m "Auto: neuester Post @mllw58 aktualisiert" &&
            git push
          )
