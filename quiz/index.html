<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CH-EU Quiz</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E30613">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CH-EU Quiz">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="robots" content="noindex">
  <meta name="description" content="Teste dein Wissen zum Paket Schweiz–EU mit interaktiven Quizfragen.">
  <meta property="og:title" content="CH-EU Quiz | Souveräne Schweiz" />
  <meta property="og:description" content="Teste dein Wissen zum Paket Schweiz–EU – Mythos oder Fakt, Was steht wirklich drin." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.souveraene-schweiz.ch/quiz/" />
  <meta property="og:image" content="https://www.souveraene-schweiz.ch/assets/ch-eu/CH-EU_Quiz_OG.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.souveraene-schweiz.ch/assets/ch-eu/CH-EU_Quiz_OG.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F5F0;
      --primary: #E30613;
      --secondary: #0033B6;
      --correct: #2E7D32;
      --correct-bg: #E8F5E9;
      --incorrect: #C62828;
      --incorrect-bg: #FFEBEE;
      --text: #1A1A1A;
      --muted: #666666;
      --surface: #FFFFFF;
      --border: #E0E0E0;
      --r: 8px;
      --shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Brand nav ── */
    #brand-nav {
      background: #CC0000; display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px; height: 48px;
      position: sticky; top: 0; z-index: 200; flex-shrink: 0;
    }
    .brand-logo {
      font-family: 'Playfair Display', Georgia, serif; font-weight: 700;
      font-size: 1rem; color: #fff; text-decoration: none;
      display: flex; align-items: center; gap: 8px;
    }
    .kreuz {
      width: 20px; height: 20px; background: #fff; border-radius: 2px;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .kreuz::before { content: '+'; color: #CC0000; font-size: 1.05rem; font-weight: 900; line-height: 1; font-family: Arial, sans-serif; }
    .brand-back {
      font-size: 0.8rem; color: rgba(255,255,255,0.82); text-decoration: none;
      padding: 6px 0; white-space: nowrap;
    }
    .brand-back:hover { color: #fff; }
    #brand-crumb {
      background: #f8f8f6; border-bottom: 1px solid #e8e8e6;
      padding: 5px 16px; font-size: 0.72rem; color: #999; flex-shrink: 0;
    }
    #brand-crumb a { color: #999; text-decoration: none; }
    #brand-crumb a:hover { color: #CC0000; }
    #brand-crumb span { margin: 0 4px; }
    #brand-crumb strong { color: #444; }

    html, body {
      height: 100%;
      font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 16px;
    }

    /* ── Screens ── */
    .screen { display: none; flex-direction: column; flex: 1; }
    .screen.active { display: flex; }

    /* ── Typography ── */
    h1 { font-size: 30px; font-weight: 800; line-height: 1.2; }
    h2 { font-size: 20px; font-weight: 700; }
    .section-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--muted); margin: 18px 0 8px;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface); border-radius: var(--r);
      padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px;
    }

    /* ── Buttons ── */
    .btn {
      display: block; width: 100%; min-height: 52px; padding: 14px 16px;
      border: none; border-radius: var(--r); font-size: 16px; font-weight: 600;
      cursor: pointer; transition: opacity .15s, transform .1s; text-align: center;
      text-decoration: none; color: inherit;
    }
    .btn:active { transform: scale(.97); opacity: .9; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline {
      background: var(--surface); border: 1.5px solid var(--border); color: var(--text);
    }
    .btn-disabled { opacity: .45; pointer-events: none; }

    /* ── Option buttons ── */
    .opt {
      display: block; width: 100%; min-height: 56px; padding: 14px 16px;
      margin-bottom: 12px; border: 1.5px solid var(--border); border-radius: var(--r);
      background: var(--surface); font-size: 15px; text-align: left; cursor: pointer;
      transition: border-color .18s, background .18s; line-height: 1.4; font-family: inherit;
    }
    .opt:active:not([disabled]) { transform: scale(.98); }
    .opt.correct  { background: var(--correct-bg);   border-color: var(--correct);   color: var(--correct);   }
    .opt.incorrect{ background: var(--incorrect-bg); border-color: var(--incorrect); color: var(--incorrect); }
    .opt[disabled]{ pointer-events: none; }

    /* ── Chips ── */
    .chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--surface); font-size: 13px; cursor: pointer;
      transition: all .15s; white-space: nowrap; font-family: inherit;
    }
    .chip.on { background: var(--secondary); border-color: var(--secondary); color: #fff; }
    .chip.hidden-chip { display: none; }
    .doss-select {
      width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: var(--r);
      background: var(--surface); font-size: 14px; font-family: inherit; cursor: pointer;
      color: var(--text);
    }

    /* ── Format grid ── */
    .fmt-grid { display: flex; gap: 8px; }
    .fmt-card {
      flex: 1 1 0; min-width: 0;
      padding: 14px 10px; border: 1.5px solid var(--border); border-radius: var(--r);
      background: var(--surface); cursor: pointer; text-align: center; transition: all .15s;
    }
    .fmt-card.on { border-color: var(--secondary); background: #EEF2FF; }
    .fmt-card .fi { font-size: 22px; margin-bottom: 4px; }
    .fmt-card .fn { font-size: 12px; font-weight: 600; line-height: 1.2; }

    /* ── Toggle ── */
    .toggle { display: flex; border: 1.5px solid var(--border); border-radius: var(--r); overflow: hidden; }
    .toggle-opt {
      flex: 1; padding: 11px; text-align: center; cursor: pointer; font-size: 14px;
      font-weight: 500; transition: all .15s; background: var(--surface); font-family: inherit;
    }
    .toggle-opt.on { background: var(--secondary); color: #fff; border: none; }

    /* ── Difficulty ── */
    .diff-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .diff-card {
      padding: 12px 6px; border: 1.5px solid var(--border); border-radius: var(--r);
      background: var(--surface); cursor: pointer; text-align: center; font-size: 13px;
      font-weight: 600; transition: all .15s;
    }
    .diff-card .di { font-size: 18px; display: block; margin-bottom: 2px; }
    .diff-card .dtime { display: block; font-size: 10px; font-weight: 400; color: var(--muted); margin-top: 2px; }
    .diff-card.on.l { border-color: var(--correct);   background: var(--correct-bg);   color: var(--correct); }
    .diff-card.on.m { border-color: #E65100;           background: #FFF3E0;             color: #E65100; }
    .diff-card.on.s { border-color: var(--incorrect);  background: var(--incorrect-bg); color: var(--incorrect); }

    /* ── Progress bar ── */
    .pbar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
    .pbar-fill { height: 100%; background: var(--primary); transition: width .35s; }

    /* ── Timer bar ── */
    .tbar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 5px; }
    .tbar-fill {
      height: 100%; background: var(--secondary);
      transition: width 1s linear, background .3s;
    }
    .tbar-fill.warn { background: #E65100; }
    .tbar-fill.danger { background: var(--primary); }

    /* ── Game header ── */
    .ghdr {
      position: sticky; top: 0; background: var(--bg); padding: 10px 0 6px;
      z-index: 20; border-bottom: 1px solid transparent;
    }
    .ghdr-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .q-counter { font-size: 13px; color: var(--muted); }
    .score-display { font-size: 13px; font-weight: 700; color: var(--secondary); }
    .streak-badge { color: #FF6D00; font-weight: 800; font-size: 13px; }
    .timer-txt { text-align: right; font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* ── Question area ── */
    .qscroll { flex: 1; overflow-y: auto; padding-bottom: 80px; }
    .q-label {
      font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 8px; display: block;
    }
    .q-label.mythos_oder_fakt      { color: var(--primary); }
    .q-label.was_steht_wirklich_drin{ color: var(--secondary); }
    .q-label.schaetzfrage           { color: #7B1FA2; }
    .q-label.zuordnung              { color: #00695C; }
    .q-text { font-size: 17px; font-weight: 500; line-height: 1.55; margin-bottom: 20px; }

    /* ── Explanation ── */
    .expl {
      padding: 14px; background: #EEF2FF; border-radius: var(--r);
      border-left: 3px solid var(--secondary); font-size: 14px; line-height: 1.6;
      margin-top: 8px;
    }
    .expl .src { margin-top: 6px; font-size: 11px; color: var(--muted); }

    /* ── Sticky continue btn ── */
    .cont-btn { position: sticky; bottom: 16px; margin-top: 12px; }

    /* ── Matching ── */
    .match-cols-hdr {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px;
    }
    .match-col-lbl {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--muted); text-align: center;
    }
    .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .match-item {
      min-height: 60px; padding: 12px 10px; border: 1.5px solid var(--border);
      border-radius: var(--r); background: var(--surface); font-size: 13px;
      cursor: pointer; text-align: center; display: flex; align-items: center;
      justify-content: center; transition: all .2s; line-height: 1.3; font-family: inherit;
    }
    .match-item.sel     { border-color: var(--secondary); background: #EEF2FF; }
    .match-item.correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); pointer-events: none; }
    .match-item.wrong   { border-color: var(--incorrect); background: var(--incorrect-bg); }
    .match-item.done    { opacity: .35; pointer-events: none; }
    .match-fb { text-align: center; font-size: 13px; font-weight: 600; min-height: 20px; margin-bottom: 4px; }

    /* ── Level progress ── */
    .lvl-bar { height: 7px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 5px; }
    .lvl-fill { height: 100%; background: var(--secondary); transition: width .5s; }

    /* ── Result ── */
    .result-hero { text-align: center; padding: 28px 0 16px; }
    .big-score { font-size: 64px; font-weight: 800; color: var(--secondary); line-height: 1; }
    .cat-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 0;
      border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .cat-row:last-child { border-bottom: none; }
    .cat-lbl { min-width: 110px; }
    .cat-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .cat-fill { height: 100%; }
    .cat-num { min-width: 36px; text-align: right; color: var(--muted); }
    .footer-btns { padding: 16px 0 24px; display: flex; flex-direction: column; gap: 10px; }

    /* ── Animations ── */
    @keyframes pop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.025)} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 30%{transform:translateX(-5px)} 70%{transform:translateX(5px)} }
    .anim-pop   { animation: pop   .3s ease; }
    .anim-shake { animation: shake .3s ease; }

    /* ── Loading ── */
    .loading-screen {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 100vh;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .8s linear infinite; margin-bottom: 16px;
    }

    /* ── Scrollable start screen ── */
    .start-scroll { flex: 1; overflow-y: auto; padding-bottom: 32px; }
  </style>
</head>

<nav id="brand-nav">
  <a href="/" class="brand-logo"><span class="kreuz"></span>Souveräne Schweiz</a>
  <a href="/ch-eu/" class="brand-back">← Paket CH–EU</a>
</nav>
<div id="brand-crumb">
  <a href="/">Start</a><span>/</span><a href="/ch-eu/">Paket CH–EU</a><span>/</span><strong>Quiz</strong>
</div>
<div id="app"></div>

<script>
'use strict';

// ─────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────
const LEVELS = [
  { name: 'Einsteiger', icon: '🌱', min: 0,   max: 49  },
  { name: 'Kenner',     icon: '📚', min: 50,  max: 99  },
  { name: 'Experte',    icon: '🎓', min: 100, max: 149 },
  { name: 'Diplomat',   icon: '🏛️', min: 150, max: Infinity },
];

const DOSSIER_LABEL = {
  strom:'Strom', pfz:'PFZ', landverkehr:'Landverkehr', gesundheit:'Gesundheit',
  lebensmittel:'Lebensmittel', beitrag:'Beitrag', mra:'MRA', luftverkehr:'Luftverkehr',
  landwirtschaft:'Landwirtschaft', 'eu-programme':'EU-Programme', weltraum:'Weltraum',
  querschnitt:'Querschnitt', richli:'Richli-Gutachten', faktenchecks:'Faktenchecks', '10mio':'10 Mio.'
};

const CAT_LABEL = { geschichte:'Geschichte', alltag:'Alltag', institutionell:'Institutionell' };

const FORMAT_META = {
  mixed:                { label:'Gemischt',                   icon:'🎲', cls:''        },
  mythos_oder_fakt:     { label:'Mythos oder Fakt',           icon:'⚖️', cls:'mythos_oder_fakt' },
  was_steht_wirklich_drin:{ label:'Was steht wirklich drin',  icon:'📄', cls:'was_steht_wirklich_drin' },
  schaetzfrage:         { label:'Schätzfragen',               icon:'🔢', cls:'schaetzfrage' },
  zuordnung:            { label:'Zuordnung',                  icon:'🔗', cls:'zuordnung' },
};

const DIFF_TIME = { leicht: 0, mittel: 20, schwer: 12 };
const DIFF_META = {
  leicht: { label:'Leicht', icon:'🟢', cls:'l', time:'kein Timer' },
  mittel: { label:'Mittel', icon:'🟡', cls:'m', time:'20s / Frage' },
  schwer: { label:'Schwer', icon:'🔴', cls:'s', time:'12s / Frage' },
};

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let allQ = [];

const S = {
  // settings
  fmts: ['mixed'],
  doss: ['all'],
  diff: 'mittel',
  size: 10,
  // session
  session: [],
  idx: 0,
  score: 0,
  streak: 0,
  results: [],
  // game
  answered: false,
  timerID: null,
  timeLeft: 0,
  timeMax: 0,
  // zuordnung
  zs: null,
  zProcessing: false,
};

// ─────────────────────────────────────────────
// LOCAL STORAGE
// ─────────────────────────────────────────────
function loadLS() {
  return {
    totalCorrect: parseInt(localStorage.getItem('cheq_tc') || '0'),
    uniqueCorrect: new Set(JSON.parse(localStorage.getItem('cheq_uc') || '[]')),
    qScores: JSON.parse(localStorage.getItem('cheq_qs') || '{}'),
    highscores: JSON.parse(localStorage.getItem('cheq_hs') || '{}'),
    last_daily_date: localStorage.getItem('cheq_ldd') || null,
    daily_streak: parseInt(localStorage.getItem('cheq_ds') || '0'),
  };
}

function saveLS() {
  localStorage.setItem('cheq_tc', String(LS.totalCorrect));
  localStorage.setItem('cheq_uc', JSON.stringify([...LS.uniqueCorrect]));
  localStorage.setItem('cheq_qs', JSON.stringify(LS.qScores));
  localStorage.setItem('cheq_hs', JSON.stringify(LS.highscores));
}

let LS = loadLS();

// ─────────────────────────────────────────────
// LEVELS
// ─────────────────────────────────────────────
function getLevel(n) {
  return LEVELS.find(l => n >= l.min && n <= l.max) || LEVELS[0];
}
function getLevelPct(n) {
  const l = getLevel(n);
  if (l.max === Infinity) return 100;
  return Math.round(((n - l.min) / (l.max - l.min + 1)) * 100);
}
function getNextLevel(n) {
  const i = LEVELS.findIndex(l => n >= l.min && n <= l.max);
  return i < LEVELS.length - 1 ? LEVELS[i + 1].name : null;
}

// ─────────────────────────────────────────────
// QUESTION POOL
// ─────────────────────────────────────────────
function qWeight(q) {
  const sc = LS.qScores[q.id] || 0;
  if (sc >= 5) return 0.15;
  if (sc >= 3) return 0.4;
  if (sc <= -3) return 3.0;
  if (sc <= -1) return 2.0;
  if (sc === 0) return 1.5;
  return 1.0;
}

function filterPool() {
  let pool = allQ;

  // Format
  if (!S.fmts.includes('mixed')) {
    pool = pool.filter(q => S.fmts.includes(q.format));
  }

  // Dossier / category
  if (!S.doss.includes('all')) {
    pool = pool.filter(q =>
      S.doss.includes(q.dossier) || (q.querschnitt && S.doss.includes(q.querschnitt))
    );
  }

  // Difficulty weighting (prefer selected, keep others with lower weight)
  if (S.diff !== 'all') {
    const pref = pool.filter(q => q.difficulty === S.diff);
    const other = pool.filter(q => q.difficulty !== S.diff);
    // 70% pool from preferred, 30% from others
    const cap = Math.ceil(other.length * 0.43); // ~30/70 ratio
    pool = [...pref, ...shuffle(other).slice(0, cap)];
  }

  return pool.length > 0 ? pool : allQ;
}

function pickWeighted(pool, count) {
  const rem = pool.map(q => ({ q, w: qWeight(q) }));
  const result = [];
  while (result.length < count && rem.length > 0) {
    const total = rem.reduce((s, r) => s + r.w, 0);
    let r = Math.random() * total;
    let i = 0;
    for (; i < rem.length - 1; i++) {
      r -= rem[i].w;
      if (r <= 0) break;
    }
    result.push(rem[i].q);
    rem.splice(i, 1);
  }
  return result;
}

function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

// ─────────────────────────────────────────────
// SCORING
// ─────────────────────────────────────────────
function calcPts(timeLeft, timeMax, streak) {
  const base = 100;
  const tBonus = timeMax > 0 ? Math.round((timeLeft / timeMax) * 100) : 0;
  const mult = streak >= 10 ? 3 : streak >= 5 ? 2 : streak >= 3 ? 1.5 : 1;
  return Math.round((base + tBonus) * mult);
}

// ─────────────────────────────────────────────
// RENDER HELPERS
// ─────────────────────────────────────────────
const $app = document.getElementById('app');
function setHTML(html) { $app.innerHTML = html; }

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────
// SCREEN: LOADING
// ─────────────────────────────────────────────
function showLoading() {
  setHTML(`
    <div class="loading-screen">
      <div class="spinner"></div>
      <div style="font-size:18px;font-weight:700">CH-EU Quiz</div>
      <div style="font-size:14px;color:var(--muted);margin-top:6px">Lade Fragen…</div>
    </div>`);
}

// ─────────────────────────────────────────────
// SCREEN: START
// ─────────────────────────────────────────────
function showStart() {
  clearTimer();
  const avFmts = [...new Set(allQ.map(q => q.format))];
  const avDoss = [...new Set(allQ.map(q => q.dossier))];
  const avCats = [...new Set(allQ.map(q => q.querschnitt).filter(c => c && c !== 'None'))];
  const lvl = getLevel(LS.totalCorrect);
  const lvlPct = getLevelPct(LS.totalCorrect);
  const nextLvl = getNextLevel(LS.totalCorrect);
  const hs = LS.highscores[S.diff] || 0;

  // Format cards – only show formats that exist OR "mixed"
  const fmtCards = ['mixed','mythos_oder_fakt','was_steht_wirklich_drin','schaetzfrage','zuordnung']
    .filter(f => f === 'mixed' || avFmts.includes(f))
    .map(f => {
      const m = FORMAT_META[f];
      return `<div class="fmt-card${S.fmts.includes(f)?' on':''}" onclick="toggleFmt('${f}')">
        <div class="fi">${m.icon}</div>
        <div class="fn">${m.label}</div>
      </div>`;
    }).join('');

  // Dossier select
  const curDoss = S.doss.includes('all') ? 'all' : (S.doss[0] || 'all');

      <span class="di">${m.icon}</span>${m.label}<span class="dtime">${m.time}</span>
    </div>`;
  }).join('');

  const totalPts = filterPool().length;

  setHTML(`
    <div class="start-scroll">
      <!-- Hero -->
      <div style="text-align:center;padding:28px 0 12px">
        <div style="font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--primary);margin-bottom:4px">Paket CH–EU</div>
        <h1 style="font-family:'Playfair Display',Georgia,serif;font-weight:900">Quiz</h1>

          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted)">Dein Level</div>
            <div style="font-size:22px;font-weight:800;margin-top:2px">${lvl.icon} ${lvl.name}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:13px;color:var(--muted)">${LS.totalCorrect} richtig</div>
            ${hs ? `<div style="font-size:12px;color:var(--muted)">HS: ${hs} Pkt.</div>` : ''}
          </div>
        </div>
        <div style="margin-top:10px">

      <div class="fmt-grid" id="fmt-grid">${fmtCards}</div>

      <!-- Start -->

          Quiz starten →
        </button>

      <div style="text-align:center;font-size:12px;color:var(--muted);margin-top:10px">

      </div>

}

// ─────────────────────────────────────────────
// START SCREEN HANDLERS
// ─────────────────────────────────────────────
function toggleFmt(f) {
  if (f === 'mixed') {
    S.fmts = ['mixed'];
  } else {
    S.fmts = S.fmts.filter(x => x !== 'mixed');
    if (S.fmts.includes(f)) {
      S.fmts = S.fmts.filter(x => x !== f);
      if (!S.fmts.length) S.fmts = ['mixed'];
    } else {
      S.fmts.push(f);
    }
  }
  const avFmts = [...new Set(allQ.map(q => q.format))];
  const el = document.getElementById('fmt-grid');
  if (el) el.innerHTML = ['mixed','mythos_oder_fakt','was_steht_wirklich_drin','schaetzfrage','zuordnung']
    .filter(f2 => f2 === 'mixed' || avFmts.includes(f2))
    .map(f2 => {
      const m = FORMAT_META[f2];
      return `<div class="fmt-card${S.fmts.includes(f2)?' on':''}" onclick="toggleFmt('${f2}')">
        <div class="fi">${m.icon}</div><div class="fn">${m.label}</div></div>`;
    }).join('');
  refreshStartCount();
}

function setDoss(val) {
  S.doss = [val];
  refreshStartCount();
}

function toggleDoss(d) {
  if (d === 'all') {
    S.doss = ['all'];
  } else {
    S.doss = S.doss.filter(x => x !== 'all');
    if (S.doss.includes(d)) {
      S.doss = S.doss.filter(x => x !== d);
      if (!S.doss.length) S.doss = ['all'];
    } else {
      S.doss.push(d);
    }
  }
  refreshStartCount();
}

function pickDiff(d) {
  S.diff = d;
  const el = document.getElementById('diff-grid');
  if (!el) return;
  el.innerHTML = ['leicht','mittel','schwer'].map(dd => {
    const m = DIFF_META[dd];
    return `<div class="diff-card${S.diff===dd?' on '+m.cls:''}" onclick="pickDiff('${dd}')">
      <span class="di">${m.icon}</span>${m.label}<span class="dtime">${m.time}</span></div>`;
  }).join('');
}

function pickSize(n) {
  S.size = n;
  const el = document.getElementById('size-toggle');
  if (!el) return;
  el.innerHTML = `
    <button class="toggle-opt${n===10?' on':''}" onclick="pickSize(10)">10 Fragen</button>
    <button class="toggle-opt${n===20?' on':''}" onclick="pickSize(20)">20 Fragen</button>`;
}

function refreshStartCount() {
  const pool = filterPool();
  const el = document.querySelector('#app > .start-scroll > div:last-child');
  if (el) el.textContent = `${allQ.length} Fragen verfügbar · ${pool.length} in aktueller Auswahl`;
}

// ─────────────────────────────────────────────
// GAME START
// ─────────────────────────────────────────────
function startGame() {
  const pool = filterPool();
  if (!pool.length) {
    alert('Keine Fragen für diese Auswahl. Bitte andere Einstellungen wählen.');
    return;
  }
  const count = Math.min(S.size, pool.length);
  S.session = pickWeighted(pool, count);
  S.idx = 0; S.score = 0; S.streak = 0; S.results = [];
  gcEvent('quiz/' + S.diff, 'Quiz gestartet – ' + DIFF_META[S.diff].label);
  showQuestion();
}

// ─────────────────────────────────────────────
// QUESTION ROUTING
// ─────────────────────────────────────────────
function showQuestion() {
  S.answered = false;
  clearTimer();
  const q = S.session[S.idx];
  if (!q) { showResult(); return; }
  if (q.format === 'zuordnung') showZuordnung();
  else showMC();
}

// ─────────────────────────────────────────────
// MC SCREEN (mythos_oder_fakt, was_steht_wirklich_drin, schaetzfrage)
// ─────────────────────────────────────────────
function showMC() {
  const q = S.session[S.idx];
  const total = S.session.length;
  const tMax = DIFF_TIME[S.diff];
  S.timeMax = tMax; S.timeLeft = tMax;

  const qText = q.format === 'mythos_oder_fakt' ? q.statement : q.question;
  const fmLabel = FORMAT_META[q.format]?.label || q.format;

  const timerHTML = tMax > 0 ? `
    <div class="tbar"><div class="tbar-fill" id="tfill" style="width:100%"></div></div>
    <div class="timer-txt" id="ttxt">${tMax}s</div>` : '';

  const optsHTML = q.options.map((opt, i) =>
    `<button class="opt" onclick="pickOpt(${i})">${esc(opt)}</button>`
  ).join('');

  setHTML(`
    <div style="flex:1;display:flex;flex-direction:column;padding-top:8px">
      <div class="ghdr">
        <div class="ghdr-row">
          <span class="q-counter">Frage ${S.idx+1} von ${total}</span>
          <span class="score-display">${S.score} Pkt.${S.streak>=3?` <span class="streak-badge">🔥×${S.streak}</span>`:''}</span>
        </div>
        <div class="pbar"><div class="pbar-fill" style="width:${(S.idx/total)*100}%"></div></div>
        ${timerHTML}
      </div>
      <div class="qscroll">
        <span class="q-label ${q.format}">${fmLabel}</span>
        <div class="q-text">${esc(qText)}</div>
        <div id="opts">${optsHTML}</div>
        <div id="expl" style="display:none"></div>
      </div>
      <div class="cont-btn" id="cont" style="display:none">
        <button class="btn btn-primary" onclick="nextQ()">
          ${S.idx+1 < total ? 'Weiter →' : 'Ergebnis anzeigen →'}
        </button>
      </div>
    </div>`);

  if (tMax > 0) startTimer();
}

function pickOpt(idx) {
  if (S.answered) return;
  S.answered = true;
  clearTimer();

  const q = S.session[S.idx];
  const ok = idx === q.correct_option;

  // Update question score (weighted priority)
  LS.qScores[q.id] = (LS.qScores[q.id] || 0) + (ok ? 1 : -2);

  if (ok) {
    S.streak++;
    const pts = calcPts(S.timeLeft, S.timeMax, S.streak);
    S.score += pts;
    if (!LS.uniqueCorrect.has(q.id)) { LS.uniqueCorrect.add(q.id); LS.totalCorrect++; }
    S.results.push({ id: q.id, correct: true, points: pts, dossier: q.dossier });
  } else {
    S.streak = 0;
    S.results.push({ id: q.id, correct: false, points: 0, dossier: q.dossier });
  }
  saveLS();

  // Style buttons
  const btns = document.querySelectorAll('.opt');
  btns.forEach((b, i) => {
    b.setAttribute('disabled', '');
    if (i === q.correct_option) { b.classList.add('correct'); if (i === idx) b.classList.add('anim-pop'); }
    else if (i === idx) { b.classList.add('incorrect'); b.classList.add('anim-shake'); }
  });

  // Explanation
  const expl = document.getElementById('expl');
  expl.style.display = 'block';
  expl.innerHTML = `<div class="expl">
    <strong>${ok ? '✓ Richtig!' : '✗ Falsch.'}</strong> ${esc(q.explanation)}
    <div class="src">Quelle: ${srcHTML(q)}</div>
  </div>`;

  document.getElementById('cont').style.display = 'block';
}

function nextQ() { S.idx++; showQuestion(); }

// ─────────────────────────────────────────────
// TIMER
// ─────────────────────────────────────────────
function startTimer() {
  S.timerID = setInterval(() => {
    S.timeLeft = Math.max(0, S.timeLeft - 1);
    const pct = (S.timeLeft / S.timeMax) * 100;
    const fill = document.getElementById('tfill');
    const txt  = document.getElementById('ttxt');
    if (!fill) { clearTimer(); return; }
    fill.style.width = pct + '%';
    fill.className = 'tbar-fill' + (pct <= 25 ? ' danger' : pct <= 50 ? ' warn' : '');
    if (txt) txt.textContent = S.timeLeft + 's';
    if (S.timeLeft <= 0) { clearTimer(); if (!S.answered) timeUp(); }
  }, 1000);
}

function clearTimer() {
  if (S.timerID) { clearInterval(S.timerID); S.timerID = null; }
}

function timeUp() {
  S.answered = true;
  const q = S.session[S.idx];
  LS.qScores[q.id] = (LS.qScores[q.id] || 0) - 2;
  S.streak = 0;
  S.results.push({ id: q.id, correct: false, points: 0, dossier: q.dossier });
  saveLS();

  const btns = document.querySelectorAll('.opt');
  btns.forEach((b, i) => {
    b.setAttribute('disabled', '');
    if (i === q.correct_option) b.classList.add('correct');
  });

  const expl = document.getElementById('expl');
  expl.style.display = 'block';
  expl.innerHTML = `<div class="expl">
    <strong>⏱️ Zeit abgelaufen!</strong> ${esc(q.explanation)}
    <div class="src">Quelle: ${srcHTML(q)}</div>
  </div>`;
  document.getElementById('cont').style.display = 'block';
}

// ─────────────────────────────────────────────
// ZUORDNUNG SCREEN
// ─────────────────────────────────────────────
function showZuordnung() {
  const q = S.session[S.idx];
  const total = S.session.length;
  const tMax = DIFF_TIME[S.diff];
  S.timeMax = tMax; S.timeLeft = tMax;

  const rightShuffled = shuffle(q.pairs.map((p, i) => ({ text: p.right, pi: i })));

  S.zs = {
    pairs: q.pairs,
    left:  q.pairs.map((p, i) => ({ text: p.left,  pi: i, done: false })),
    right: rightShuffled.map((r, _i) => ({ text: r.text, pi: r.pi, done: false })),
    selL: null, selR: null,
    errors: 0, matched: 0,
  };
  S.zProcessing = false;

  const timerHTML = tMax > 0 ? `
    <div class="tbar"><div class="tbar-fill" id="tfill" style="width:100%"></div></div>
    <div class="timer-txt" id="ttxt">${tMax}s</div>` : '';

  setHTML(`
    <div style="flex:1;display:flex;flex-direction:column;padding-top:8px">
      <div class="ghdr">
        <div class="ghdr-row">
          <span class="q-counter">Frage ${S.idx+1} von ${total}</span>
          <span class="score-display">${S.score} Pkt.${S.streak>=3?` <span class="streak-badge">🔥×${S.streak}</span>`:''}</span>
        </div>
        <div class="pbar"><div class="pbar-fill" style="width:${(S.idx/total)*100}%"></div></div>
        ${timerHTML}
      </div>
      <div class="qscroll">
        <span class="q-label zuordnung">Zuordnung</span>
        <div class="q-text">${esc(q.question)}</div>
        <div class="match-cols-hdr">
          <div class="match-col-lbl">Begriff</div>
          <div class="match-col-lbl">Bedeutung</div>
        </div>
        <div class="match-grid" id="mgrid">${renderZGrid()}</div>
        <div class="match-fb" id="mfb"></div>
        <div id="expl" style="display:none"></div>
      </div>
      <div class="cont-btn" id="cont" style="display:none">
        <button class="btn btn-primary" onclick="nextQ()">
          ${S.idx+1 < total ? 'Weiter →' : 'Ergebnis anzeigen →'}
        </button>
      </div>
    </div>`);

  if (tMax > 0) startTimer();
}

function renderZGrid() {
  const zs = S.zs;
  let h = '';
  for (let i = 0; i < zs.left.length; i++) {
    const l = zs.left[i];
    const r = zs.right[i];
    let lc = 'match-item' + (l.done ? ' done' : zs.selL === i ? ' sel' : '');
    let rc = 'match-item' + (r.done ? ' done' : zs.selR === i ? ' sel' : '');
    h += `<button class="${lc}" onclick="zPickL(${i})" ${l.done?'disabled':''}>${esc(l.text)}</button>`;
    h += `<button class="${rc}" onclick="zPickR(${i})" ${r.done?'disabled':''}>${esc(r.text)}</button>`;
  }
  return h;
}

function zPickL(i) {
  if (S.answered || S.zProcessing) return;
  const zs = S.zs;
  if (zs.left[i].done) return;
  zs.selL = i;
  document.getElementById('mgrid').innerHTML = renderZGrid();
  if (zs.selL !== null && zs.selR !== null) zTryMatch();
}

function zPickR(i) {
  if (S.answered || S.zProcessing) return;
  const zs = S.zs;
  if (zs.right[i].done) return;
  zs.selR = i;
  document.getElementById('mgrid').innerHTML = renderZGrid();
  if (zs.selL !== null && zs.selR !== null) zTryMatch();
}

function zTryMatch() {
  const zs = S.zs;
  if (zs.selL === null || zs.selR === null) return;
  S.zProcessing = true;

  const l = zs.left[zs.selL];
  const r = zs.right[zs.selR];
  const ok = l.pi === r.pi;
  const grid = document.getElementById('mgrid');
  const fb = document.getElementById('mfb');

  if (ok) {
    // Flash correct
    const items = grid.querySelectorAll('.match-item');
    const li = zs.selL * 2;
    const ri = zs.selL * 2 + 1;
    // Find the actual elements by grid position
    const allItems = Array.from(grid.querySelectorAll('.match-item'));
    // Left items are at even indices (0,2,4,6), right at odd (1,3,5,7)
    // But we need to find selL-th left and selR-th right
    const leftItems = allItems.filter((_, idx) => idx % 2 === 0);
    const rightItems = allItems.filter((_, idx) => idx % 2 === 1);
    if (leftItems[zs.selL]) leftItems[zs.selL].className = 'match-item correct';
    if (rightItems[zs.selR]) rightItems[zs.selR].className = 'match-item correct';

    fb.textContent = '✓ Richtig!';
    fb.style.color = 'var(--correct)';

    setTimeout(() => {
      l.done = true; r.done = true;
      zs.matched++;
      zs.selL = null; zs.selR = null;
      S.zProcessing = false;
      grid.innerHTML = renderZGrid();
      if (zs.matched === zs.pairs.length) {
        setTimeout(finishZuordnung, 200);
      } else {
        fb.textContent = '';
      }
    }, 600);
  } else {
    zs.errors++;
    const allItems = Array.from(grid.querySelectorAll('.match-item'));
    const leftItems = allItems.filter((_, idx) => idx % 2 === 0);
    const rightItems = allItems.filter((_, idx) => idx % 2 === 1);
    if (leftItems[zs.selL]) leftItems[zs.selL].className = 'match-item wrong anim-shake';
    if (rightItems[zs.selR]) rightItems[zs.selR].className = 'match-item wrong anim-shake';

    fb.textContent = `✗ Nicht korrekt (${zs.errors} Fehler)`;
    fb.style.color = 'var(--incorrect)';

    setTimeout(() => {
      zs.selL = null; zs.selR = null;
      S.zProcessing = false;
      grid.innerHTML = renderZGrid();
      setTimeout(() => { fb.textContent = ''; }, 300);
    }, 900);
  }
}

function finishZuordnung() {
  clearTimer();
  S.answered = true;
  const q = S.session[S.idx];
  const zs = S.zs;
  const err = zs.errors;

  const baseM = err === 0 ? 1 : err === 1 ? 0.75 : err === 2 ? 0.5 : 0.25;
  const base = 100;
  const tBonus = S.timeMax > 0 ? Math.round((S.timeLeft / S.timeMax) * 100) : 0;
  const sMult = S.streak >= 10 ? 3 : S.streak >= 5 ? 2 : S.streak >= 3 ? 1.5 : 1;
  const pts = Math.round((base + tBonus) * sMult * baseM);
  const ok = err === 0;

  if (ok) {
    S.streak++;
    if (!LS.uniqueCorrect.has(q.id)) { LS.uniqueCorrect.add(q.id); LS.totalCorrect++; }
  } else {
    S.streak = 0;
  }
  S.score += pts;
  LS.qScores[q.id] = (LS.qScores[q.id] || 0) + (ok ? 1 : -1);
  S.results.push({ id: q.id, correct: ok, points: pts, dossier: q.dossier });
  saveLS();

  const expl = document.getElementById('expl');
  expl.style.display = 'block';
  expl.innerHTML = `<div class="expl">
    <strong>${ok ? '✓ Alle Zuordnungen richtig!' : `${pts} Punkte (${err} Fehler)`}</strong> ${esc(q.explanation)}
    <div class="src">Quelle: ${srcHTML(q)}</div>
  </div>`;
  document.getElementById('cont').style.display = 'block';
}

// ─────────────────────────────────────────────
// RESULT SCREEN
// ─────────────────────────────────────────────
function showResult() {
  clearTimer();
  const total = S.results.length;
  const correct = S.results.filter(r => r.correct).length;
  const pct = total ? Math.round((correct / total) * 100) : 0;

  // Category breakdown
  const byDoss = {};
  S.results.forEach(r => {
    if (!byDoss[r.dossier]) byDoss[r.dossier] = { c: 0, t: 0 };
    byDoss[r.dossier].t++;
    if (r.correct) byDoss[r.dossier].c++;
  });

  // Highscore
  const prevHS = LS.highscores[S.diff] || 0;
  const newHS = S.score > prevHS;
  if (newHS) LS.highscores[S.diff] = S.score;
  saveLS();

  const lvl = getLevel(LS.totalCorrect);
  const lvlPct = getLevelPct(LS.totalCorrect);
  const nextLvl = getNextLevel(LS.totalCorrect);

  const emoji = pct >= 80 ? '🎉' : pct >= 60 ? '👍' : pct >= 40 ? '🤔' : '📚';

  const catRows = Object.entries(byDoss).map(([d, v]) => {
    const p = Math.round((v.c / v.t) * 100);
    const col = v.c === v.t ? 'var(--correct)' : v.c === 0 ? 'var(--incorrect)' : 'var(--secondary)';
    return `<div class="cat-row">
      <span class="cat-lbl">${DOSSIER_LABEL[d]||d}</span>
      <div class="cat-bar"><div class="cat-fill" style="width:${p}%;background:${col}"></div></div>
      <span class="cat-num">${v.c}/${v.t}</span>
    </div>`;
  }).join('');

  setHTML(`
    <div style="flex:1;overflow-y:auto;padding-bottom:24px">
      <div class="result-hero">
        <div style="font-size:52px;margin-bottom:8px">${emoji}</div>
        <div class="big-score">${pct}%</div>
        <div style="font-size:18px;font-weight:700;margin-top:4px">${correct} von ${total} richtig</div>
        <div style="font-size:14px;color:var(--muted);margin-top:4px">
          ${S.score} Punkte${newHS ? ' · 🏆 Neuer Highscore!' : ''}
        </div>
      </div>

      <!-- Level -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:700;font-size:17px">${lvl.icon} ${lvl.name}</div>
          <div style="font-size:13px;color:var(--muted)">${LS.totalCorrect} einzigartig richtig</div>
        </div>
        <div style="margin-top:8px">
          <div class="lvl-bar"><div class="lvl-fill" style="width:${lvlPct}%"></div></div>
          ${nextLvl ? `<div style="font-size:11px;color:var(--muted);margin-top:4px">Nächstes Level: ${nextLvl}</div>` : ''}
        </div>
      </div>

      <!-- Category breakdown -->
      <div class="section-label">Nach Thema</div>
      <div class="card" style="padding:4px 16px">${catRows}</div>

      <!-- Share button -->
      <button class="btn btn-primary" style="margin-top:8px" onclick="doShare(${pct},${correct},${total})">
        📤 Ergebnis teilen
      </button>

      <div class="footer-btns">
        <button class="btn btn-outline" onclick="startGame()">🔄 Nochmal spielen</button>
        <button class="btn btn-outline" onclick="showStart()">⚙️ Andere Einstellungen</button>
      </div>
    </div>`);
}

// ─────────────────────────────────────────────
// SHARE
// ─────────────────────────────────────────────
function doShare(pct, correct, total) {
  gcEvent('quiz/share', 'Quiz Ergebnis geteilt');
  const lvl = getLevel(LS.totalCorrect);
  const canvas = document.createElement('canvas');
  canvas.width = 1080; canvas.height = 1080;
  const c = canvas.getContext('2d');

  // Background
  c.fillStyle = '#F5F5F0'; c.fillRect(0, 0, 1080, 1080);

  // Red top bar
  c.fillStyle = '#E30613'; c.fillRect(0, 0, 1080, 130);
  // Blue stripe
  c.fillStyle = '#0033B6'; c.fillRect(0, 130, 1080, 14);

  // Title
  c.fillStyle = '#FFFFFF'; c.font = 'bold 58px -apple-system,Arial,sans-serif';
  c.textAlign = 'center'; c.fillText('CH–EU Quiz', 540, 90);

  // Big percent
  c.fillStyle = '#0033B6'; c.font = 'bold 180px -apple-system,Arial,sans-serif';
  c.fillText(pct + '%', 540, 400);

  // Subtitle
  c.fillStyle = '#1A1A1A'; c.font = '42px -apple-system,Arial,sans-serif';
  c.fillText(correct + ' von ' + total + ' Fragen richtig', 540, 470);

  // Level badge background
  c.fillStyle = '#0033B6';
  const bW = 340; const bH = 76; const bX = 540 - bW/2; const bY = 510;
  roundRect(c, bX, bY, bW, bH, 16);
  c.fill();
  c.fillStyle = '#FFFFFF'; c.font = 'bold 46px -apple-system,Arial,sans-serif';
  c.fillText(lvl.name, 540, 563);

  // Divider
  c.strokeStyle = '#CCCCCC'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(120, 630); c.lineTo(960, 630); c.stroke();

  // CTA
  c.fillStyle = '#666666'; c.font = '34px -apple-system,Arial,sans-serif';
  c.fillText('Teste dich selbst →', 540, 700);
  c.fillStyle = '#1A1A1A'; c.font = 'bold 38px -apple-system,Arial,sans-serif';
  c.fillText('souveraene-schweiz.ch/quiz', 540, 758);

  // CH cross
  c.fillStyle = '#E30613';
  c.beginPath(); roundRect(c, 470, 820, 140, 140, 18); c.fill();
  c.fillStyle = '#FFFFFF';
  c.fillRect(527, 836, 26, 108);
  c.fillRect(486, 877, 108, 26);

  const QUIZ_URL = 'https://souveraene-schweiz.ch/quiz/';
  const shareText = `Ich kenne das Paket CH–EU zu ${pct}%! Level: ${lvl.name}`;

  canvas.toBlob(blob => {
    const file = new File([blob], 'ch-eu-quiz.png', { type: 'image/png' });

    // 1. Best case: image + url + text (supported on iOS Safari, Android Chrome)
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file], url: QUIZ_URL })) {
      navigator.share({ title: 'CH-EU Quiz', text: shareText, url: QUIZ_URL, files: [file] })
        .catch(() => downloadPNG(blob));

    // 2. Image only (url not supported together with files on some platforms)
    } else if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ title: 'CH-EU Quiz', text: shareText + '\n' + QUIZ_URL, files: [file] })
        .catch(() => downloadPNG(blob));

    // 3. URL + text only (no image, but still clickable)
    } else if (navigator.share) {
      navigator.share({ title: 'CH-EU Quiz', text: shareText, url: QUIZ_URL })
        .catch(() => downloadPNG(blob));

    // 4. Fallback: PNG download
    } else {
      downloadPNG(blob);
    }
  }, 'image/png');
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y); c.arcTo(x + w, y, x + w, y + r, r);
  c.lineTo(x + w, y + h - r); c.arcTo(x + w, y + h, x + w - r, y + h, r);
  c.lineTo(x + r, y + h); c.arcTo(x, y + h, x, y + h - r, r);
  c.lineTo(x, y + r); c.arcTo(x, y, x + r, y, r);
  c.closePath();
}

function downloadPNG(blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ch-eu-quiz.png'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// ─────────────────────────────────────────────
// SOURCE HELPER
// ─────────────────────────────────────────────
function srcHTML(q) {
  const url   = q.reference_url || q.source || '';
  const title = q.reference_title || url;
  if (!title) return '';
  const href = url ? (url.startsWith('http') ? url : 'https://' + url) : null;
  const label = esc(title.length > 80 ? title.slice(0, 78) + '…' : title);
  return href
    ? `<a href="${href}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">${label}</a>`
    : label;
}

// ─────────────────────────────────────────────
// ANALYTICS
// ─────────────────────────────────────────────
function gcEvent(path, title) {
  if (window.goatcounter && window.goatcounter.count) {
    window.goatcounter.count({ path, title: (title || path) + ' | ' + window.location.href, event: true });
  }
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
async function init() {
  showLoading();
  try {
    const res = await fetch('quiz_fragen.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allQ = (data.questions || []).filter(q => q && q.id && q.format);
    if (!allQ.length) throw new Error('Keine Fragen in der Datei gefunden.');
    showStart();
  } catch (e) {
    setHTML(`
      <div class="loading-screen">
        <div style="font-size:40px;margin-bottom:12px">⚠️</div>
        <div style="font-size:16px;font-weight:700;color:var(--text)">Fragen konnten nicht geladen werden</div>
        <div style="font-size:13px;color:var(--muted);margin-top:6px;text-align:center;padding:0 20px">${esc(e.message)}</div>
        <button class="btn btn-primary" style="margin-top:20px;width:auto;padding:12px 24px" onclick="init()">Erneut versuchen</button>
      </div>`);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
}

init();
</script>
<script data-goatcounter="https://souveraene-schweiz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
