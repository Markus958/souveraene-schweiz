<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CH–EU Quiz – Souveräne Schweiz</title>
  <meta name="description" content="Bürgerbildungs-Quiz zum Abkommenspaket Schweiz–EU (Bilaterale III). Offline nutzbar, ohne Konto, ohne Tracking." />
  <meta name="theme-color" content="#2c3e6b" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CH–EU Quiz" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <a class="skip-link" href="#app">Zum Inhalt springen</a>

  <!-- Wurzel der Single-Page-App – Inhalt wird von js/ui.js gerendert -->
  <div id="app" role="main" aria-live="polite">
    <div class="boot" role="status">
      <p>Quiz wird geladen …</p>
      <noscript>Dieses Quiz benötigt JavaScript. Bitte aktiviere JavaScript in deinem Browser.</noscript>
    </div>
  </div>

  <!-- Container für Toast-Meldungen und Modal-Overlays -->
  <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>
  <div id="modal-root"></div>

  <!-- Hauptlogik als ES-Modul (kein Build-Step nötig) -->
  <script type="module" src="js/app.js"></script>

  <!-- Service-Worker-Registrierung (Offline-Fähigkeit) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // Domain-Platzhalter: relative Registrierung, Scope = /quiz/ – anpassen wenn eigene Domain vergeben
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('Service-Worker konnte nicht registriert werden:', err);
        });
      });
    }
  </script>
</body>
</html>
